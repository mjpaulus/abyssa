deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: S.", "tags": ["weather", "lighting", "reference"], "updated": "2026-09-25", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: S.</p>\n<h3>Detail</h3>\n<p>Study: Lightning.js _grow (recursive midpoint bolts, return-stroke train) and ShadingGLSL lightningContribution (two-slot inverse-square).</p>\n<p>CHANGE: Inject the two strongest bolts as uniforms into sea/raft/terrain through our fog-chunk-style global patch; bolt ribbons as one InstancedBufferGeometry. Today lightning is a flash scalar + underside sheet.</p>\n<p>SHIPPED (branch ref-lightning, not merged):</p>\n<ul>\n<li><code>world/lightning.js</code> — each MAIN stroke of the weather&#x27;s schedule grows a channel: 64-segment</li>\n</ul>\n<p>  midpoint-displaced trunk from just under the cloud deck down TOWARD the sea (ends 4-14 u up),</p>\n<p>  2-4 branches; ONE InstancedBufferGeometry of camera-facing additive ribbons (fog:false),</p>\n<p>  pool of 4 channels (512 quads), zero per-frame allocation. Pulses = the weather&#x27;s own</p>\n<p>  echo timings/amplitudes (instant rise, 25 ms hold, 35 ms decay), then a wider, fainter</p>\n<p>  afterimage (250 ms decay). Position/shape = pure function of (deal seed, stroke index).</p>\n<ul>\n<li><code>water.js</code> fog chunk — <code>abyssaBolt0/1</code> (xyz + intensity), <code>abyssaBoltCol</code>, <code>abyssaBoltK</code></li>\n</ul>\n<p>  installed exactly like <code>abyssaAir</code>; <code>vFogP</code> world-position varying; <code>ABYSSA_LIT</code> planted</p>\n<p>  at the head of <code>lights_fragment_begin</code> so lit materials use their real normal and</p>\n<p>  everything else a screen-derivative flat normal; inverse-square with a floor distance;</p>\n<p>  the water leg extinguished by the clear column (KMOL, storm-scaled, gain <code>depthK</code>);</p>\n<p>  added BEFORE the eye leg&#x27;s extinction. The sea takes 0.15 of the diffuse term (<code>gBoltK</code>,</p>\n<p>  the gSunK pattern). Sheet terms (sea + rain layer) at <code>sheet</code> = 0.5, <code>setWeatherLight</code>&#x27;s</p>\n<p>  flash boost at <code>coarseK</code> = 0.45 — the coarse fallback still works under the degrade</p>\n<p>  ladder; only the ribbon mesh sheds (perf stage &gt;= 3).</p>\n<ul>\n<li><code>weather.js</code> — <code>flMain</code>, deal gen/seed, <code>lightningSchedule()</code>, <code>st.clock</code>,</li>\n</ul>\n<p>  <code>weather.strokes()</code>. Lab: &#x27;lightning&#x27; knob group (GLASS.lightning). Probe:</p>\n<p>  <code>__bolt.state()/fire(x,z,strength)/last()/hold(x,y,z,I)/ribbons(on)</code>. <code>__bolt.last()</code> is</p>\n<p>  the audio hook: {x,y,z,t,amp,top,tx,tz}.</p>\n<p>OPEN (needs Michael&#x27;s eye): peak 8 / floor 45 / temp 0.35 are numeric picks; the flat 0.36</p>\n<p>reflectance (the chunk never sees albedo) desaturates a flash, which is defensible but is</p>\n<p>taste. Clouds are fog:false so their lit side is NOT reached (per-material work, declined).</p>\n<p>The ribbons are hidden from the refraction pass (refrHide), so a bolt is not seen THROUGH</p>\n<p>the surface from below — the sheet covers it. Bolt amplitude carries <code>storm</code> at the fire</p>\n<p>frame (±1e-4 across reloads); position and time are exact.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-09-25 wip — shipped on ref-lightning (31a050a + follow-up). Verified in-browser:</li>\n</ul>\n<p>  (a) forced night storm, strike frame + 200 ms + 500 ms captured (deck lit from the</p>\n<p>  bolt&#x27;s side, afterimage fainter); (b) underwater hold light I=8 at 60 u out: Sal&#x27;s</p>\n<p>  mid-region +6.5 luma at 15 u, +1.4 at 35 u, 0 (within noise) at 60 u; (c) fire/hold from</p>\n<p>  +x/-x/+z — left/right deck readback follows the bearing (nx: L+39 R+33; px: L+10 R+17;</p>\n<p>  pz: symmetric); (d) day-5 hand, two reloads: first bolt (-120.776, 40.974, 124.422) at</p>\n<p>  t 3687.5635 both times; (e) lights 9 before/after in the same state; programs play 239</p>\n<p>  vs main 238 (+1 ribbon material), 245 after 6 P toggles on BOTH; 40 strikes + held</p>\n<p>  light: 351 -&gt; 351; GL errors 0 across 6 P toggles + 2 resizes; (f) __gpu.median()</p>\n<p>  uncapped, 20 s each: storm no bolts 13.3 ms vs held light + a strike every 500 ms</p>\n<p>  15.6 ms (worst case — a real strike is live ~1 s per 8-25 s); (g) sleeper fps</p>\n<p>  15ce888c/c938fe6e/652d0412 unchanged; (h) console clean.</p>"}, {"slug": "ref-gpu-profiler-quality", "t": "GPU timer profiler + median quality loop", "d": "From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: S.", "tags": ["perf", "reference"], "updated": "2026-09-25", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: S.</p>\n<h3>Detail</h3>\n<p>Study: core/GpuProfiler.js (EXT_disjoint_timer_query ring, EMA, gl.finish fallback) and core/Quality.js tick() (median window, wall-time cap, log2 tier shed, cooldowns, UPGRADE path).</p>\n<p>CHANGE: Replace samplePerf&#x27;s one-window fps bar: per-zone GPU timings, outlier-proof median, panic shed by log2(overshoot), and the missing half — climbing back up when headroom appears.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-09-25 — shipped on branch <code>ref-profiler</code> (not merged). GPU timer: an 8-query</li>\n</ul>\n<p>  EXT_disjoint_timer_query_webgl2 ring around refraction + composer, async readback,</p>\n<p>  EMA + 64-frame median, disjoint discard, <code>window.__gpu</code> (supported/ms/median/last/n);</p>\n<p>  wall-time-only where the extension is absent. Judge: 90-frame wall-time median vs</p>\n<p>  the governor&#x27;s budget (1000/cap ms; bar = 1.5x + 1 ms), 3 s sustained, log2(overshoot)</p>\n<p>  panic shed capped short of the terminal rung, 3 s cooldown; terminal rung also needs</p>\n<p>  the GPU median over half the budget where the timer exists. Upgrade: <code>restoreQuality()</code></p>\n<p>  climbs one rung after 10 s of headroom (keeps pace AND GPU median &lt; 65% budget), per-rung</p>\n<p>  wait doubles after a shed follows an upgrade. Measured (driven pane loop, ?lab hooks):</p>\n<p>  <code>__gpu.median()</code> 8.7-9.4 ms at 1536x1152, stable; 60-cap rest 65 s -&gt; stage 0 (median</p>\n<p>  16.3-17.1 ms); hidden drive 20 s -&gt; never sampled; 30 ms busy-wait -&gt; tier 1 at +4.5 s,</p>\n<p>  tier 2 at +10.6 s, load off -&gt; tier 1 at +13.6 s, tier 0 at +13.1 s; 70 ms busy-wait</p>\n<p>  (median 74 ms, 4.5x) -&gt; two rungs in one judge. Manual 3-rung round trip restores the</p>\n<p>  exact pass chain (N8AO, VolumetricLight, SkyRays back in place). Heap: usedJSHeapSize</p>\n<p>  is a GC sawtooth (78-104 MB, ~2 cycles/s from the game&#x27;s own churn); judge on vs off</p>\n<p>  deltas over 10 s were -19 / +21 MB, i.e. inside the noise — the judge&#x27;s per-frame path</p>\n<p>  is typed-array rings with no allocation by construction (median scratch sorted in</p>\n<p>  place, two subarray views per 0.5 s judge). Not verified with real visible-tab rAF</p>\n<p>  (pane and Chrome both reported document.hidden); per-pass timing not wired.</p>"}, {"slug": "ref-caustics-shadow", "t": "Wave-slope caustics + seabed sun shadow", "d": "From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.", "tags": ["water", "lighting", "reference"], "updated": "2026-09-25", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.</p>\n<h3>Detail</h3>\n<p>Study: UnderwaterMaterial.js caustic() with uCausticSlope displacing the uv; UnderwaterWorld.renderShadow (ortho map re-rendered on move/sun change, 9-tap PCF).</p>\n<p>CHANGE: Feed our Gerstner gradient into the caustic uv so caustics move with the actual waves; one 1024 ortho sun map over the zone-0 floor refreshed every ~18 frames so reef and wrecks cast shadows on sand.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-09-25 (branch ref-caustics, WIP e772ecb + follow-up): SHIPPED both halves. (1) Wave-slope caustics: water.js publishes <code>waveLow</code> (the two longest Gerstner components as resolved this frame, storm+wind folded in); terrain.js evaluates the surface gradient per fragment at each fragment&#x27;s sun crossing (uSunW) and displaces the caustic uv by 0.33 x slope x depth — measured on the zone-0 floor: gradient (0.021,0.002) -&gt; (0.005,-0.010) over 2 s, offset 1.7 u -&gt; 0.4 u, and under a 0.9 wind the height amplitudes rise 0.37 -&gt; 0.53 with the offset stretching to ~2.3 u. Depth/sunK gating untouched (storm: uSunK 0.15 as before; zones 1-2: fade 0). The lace is also shadowed (<code>seabedSh</code>). (2) Seabed sun shadow: lighting.js <code>floorShadow</code> re-aims the SAME DirectionalLight shadow camera (asymmetric ortho box, GLASS.seabed.shadowSize 180 u, texel-snapped, near/far +-120 u) at the diver below y=-26 in zone 0&#x27;s band, refreshed every 18 frames via per-shadow autoUpdate/needsUpdate; above -26 the raft box, bias, normalBias, radius and autoUpdate are written back (verified on deck: box [-9,9,-9,9,28,72], bias -0.0004, nb 0.045, radius 6.4 from the Flow lean, autoUpdate true). Casters: terrain (shadowSide FrontSide — three draws BACK faces into PCF maps and a heightfield has none, measured: map coverage 18% -&gt; 100% after the fix), boulders + hero rocks, wrecks, the Brooder (already cast). The floor&#x27;s indirect light is shaded by <code>shadowAmbient</code> (0.45) or the shadow was a 15% tint. Cost (EXT_disjoint_timer_query, 1279 samples each): GPU median 6.09 ms on vs 5.78 off = +0.30 ms (mean +0.38), CPU +0.1 ms. Lights 14 both sides; programs not increased (branch 399 vs main 443 at the same zone-0 path); site-0 terrainH hash bit-identical to main; console clean. Knobs: GLASS.seabed + lab group &#x27;seabed&#x27;; probe <code>__caust.state()/set()</code>. Not verified by eye at full quality: acne on steep sand at low sun (defaults bias -0.0003 / normalBias 0.35 looked clean at 32-58 deg).</li>\n</ul>"}, {"slug": "ref-auto-exposure", "t": "Auto-exposure (EV100)", "d": "From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.", "tags": ["postfx", "reference"], "updated": "2026-09-25", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.</p>\n<h3>Detail</h3>\n<p>Study: PostFX.js EXPOSURE_FRAG (log-luminance mip chain, asymmetric adaptation speed, -0.5 EV compensation). The single biggest reason their screenshots look composed.</p>\n<p>CHANGE: A 1x1 ping-pong float RT feeding renderer.toneMappingExposure; asymmetric speed; clamp range so the abyss stays dark by design (never brighten the deep past its authored stop). AdaptationPass history: do it as a tiny RT, not a Pass.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-09-25 — SHIPPED on branch ref-exposure (not merged; a4329f9): <code>src/postfx.exposure.js</code> (ExposurePass, a Pass shell round three tiny RTs: 32x32 -&gt; 4x4 -&gt; 1x1 RGBA32F, one program, no depth attachments), wired in <code>src/postfx.js</code> after DepthCopy (<code>__exposure.state/set/pass/profile/cost</code>), knobs <code>GLASS.exposure</code> in <code>src/config.js</code>, lab group &#x27;exposure&#x27; in <code>src/ui/lab.js</code>. The meter INVERTS the ACES fit per tap (the renderer&#x27;s exposure of the metered frame is known exactly at pass time) so it reads scene-referred log2 luminance — metered post-ACES the loop gain was ~0.1 on the deck and the exposure walked to the fence. Sky taps (depth 1.0: dome and far sea, both raw shaders) are taken as-is; the sea SURFACE over the seabed is raw too, so on the deck the loop gain read -0.65 and <code>airRaw: 0.65</code> corrects the reading by the lagged air blend. Readback: PBO ring of 4, mapped back 3 issues later, NO fence (a fence forced a mid-frame command-buffer commit). CPU adaptation on <code>ev = log2(multiplier on 1.32)</code>, asymmetric (tauBright 0.6 s falling, tauDark 3.0 s rising), per-stop key/lo/hi blended on lighting&#x27;s depth01. CLAMPS: deck/shallows [0.70, 1.40], zone-0 seabed (d 0.27) [0.85, 1.15], zone-1 seabed (d 0.60) [0.85, 1.12], zone-2 seabed (d 0.93) [0.90, 1.05]; keys (scene-referred mean log2 at multiplier 1): -2.7 / -4.3 / -5.4 / -5.1. MEASURED: deck noon settles at 0.82 (exposure 1.09), night on the 1.40 fence (1.82); day-&gt;night 63% in 3.3 s (the weather itself eases over 2.9 s), night-&gt;day 0.6 s; pure EV step in a static zone 0: 0.6 s down, 2.5 s up. Zone 0 by day 0.89. Furnace (zone 2, facing from 22 u): 1.017 cold -&gt; 0.900 lit, on the floor; the surround did not lift. Hoard (zone 1): 1.06 lit, peaks 1.107 as the lanterns go out, never past 1.117. P bypass snaps to 1.32 / ev 0 at once. Programs +1 (AutoExposureMeter); GL errors 0 across 6 P toggles + 3 resizes; sleeper fingerprints unchanged. COST: paired frame-level A/B on <code>__gpu.median()</code> (E.on alternated, median of pair deltas): +0.04 ms zone 2 (11 pairs), +0.23 ms deck (10 pairs, ±1 ms pair noise) — the per-pass timer query reads 1.9-2.5 ms because on this TBDR GPU it absorbs the scene pass closing; do not trust it. NOT VERIFIED: the user&#x27;s eye on the deck at noon (0.82x) and night (1.4x); a real-window feel pass; the residual sea-surface term underwater near the interface.</li>\n</ul>"}, {"slug": "flow-lean-style", "t": "The Flow lean (a style between NMS and Flow)", "d": "Michael: \"make a card that finds a style in the middle but leaning towards flow.\" Reference: Flow (2024, Zilbalodis) — real-time-rendered painting: matte, low-detail painted surfaces; naturalistic light + heavy atmosphere doing the work textures don't; colour authored per scene in the shaders (no compositing); documentary camera (long takes, layered handheld, shallow DoF). Our current bar (recent NMS underwater) sits at the glossy-PBR end. The target is the midpoint, leaning Flow: keep our physics (stratified column, real waves, real weather), soften how we PAINT them.", "tags": ["art-direction", "style", "postfx", "materials", "camera"], "updated": "2026-09-05", "body": "<p>Michael: &quot;make a card that finds a style in the middle but leaning towards flow.&quot; Reference: Flow (2024, Zilbalodis) — real-time-rendered painting: matte, low-detail painted surfaces; naturalistic light + heavy atmosphere doing the work textures don&#x27;t; colour authored per scene in the shaders (no compositing); documentary camera (long takes, layered handheld, shallow DoF). Our current bar (recent NMS underwater) sits at the glossy-PBR end. The target is the midpoint, leaning Flow: keep our physics (stratified column, real waves, real weather), soften how we PAINT them.</p>\n<h3>Detail</h3>\n<p>PRINCIPLES (the style in one paragraph): surfaces read as pigment, not plastic — matte first, specular only where it tells a story (wet brass, the glitter path, a jelly&#x27;s rim). Detail is suggested at the edge and dissolved in the middle. Light and haze carry depth; the eye reads form and distance, not micro-texture. Every zone commits to one strong mood colour authored by hand. The camera has a point of view. Never neon — Flow&#x27;s glow is halation on light, not emissive objects.</p>\n<p>THE PASS, in order of leverage (each an A/B behind a GLASS knob so the midpoint is dialable, not a cliff):</p>\n<p>1. MATERIAL RESPONSE — a global &quot;paint&quot; law: raise roughness floors across the generated PBR sets (rocks, terrain triplanar, flora, gardens, fauna, wrecks) so nothing but authored hero metal has a tight specular; clamp metalness on non-metals to 0; pull the new rock/deck normal-map strengths down so relief reads as brushwork not bump. Keep brass/copper/glitter as the exceptions.</p>\n<p>2. EDGE-NOT-MIDDLE DETAIL — the screen-derivative relief and detail normals already fade by footprint; add a mid-tone flattening term (detail contrast scaled by 1 - luminance-in-band) so texture lives in the shadow/edge transitions and dissolves on lit faces. Flow&#x27;s cat: strokes at the silhouette, nothing on the flank.</p>\n<p>3. ATMOSPHERE FORWARD — one stop more haze in every regime than physics says (airK, the nepheloid amps, the lid ring) with a matching lift in halation: bloom threshold lower + wider radius but LOWER intensity, so light blooms softly into haze instead of hot-spotting. Sun/lantern get a halo, objects never glow.</p>\n<p>4. AUTHORED SCENE COLOUR — one committed mood per zone and per weather stop, pushed further than now: gold/apricot on the deck at dusk, mossy teal reef, sulphur-amber boiler room, violet-black abyss. Extend the depth CDL grade (__grade) into a per-zone grade stack with hand-tuned lift/gamma/gain; saturation slightly UP in the mood hue, DOWN everywhere else.</p>\n<p>5. DEPTH OF FIELD WITH INTENT — DoF currently focuses on the diver; add a subject-aware focus (nearest fauna/ward/keepsake in the centre third pulls focus over ~0.6s) and a wider aperture underwater; deck stays sharp.</p>\n<p>6. CAMERA WITH A POINT OF VIEW — the FEEL channel becomes Flow&#x27;s layered handheld: separate standstill / walking / swimming noise layers (4-octave sine on position, look AND roll), mixed by state, plus a slow &quot;interest drift&quot; toward the nearest living thing. Sal&#x27;s gait fenced; this is the lens, not the legs.</p>\n<p>7. SILHOUETTE STROKES — an optional edge treatment on organic things (fur/fin/frond): a thin screen-space rim of darkened, slightly broken alpha (dither) so creatures and plants read as painted at the edge. Gate: must not read as an outline shader.</p>\n<p>8. WATER STAYS PHYSICAL BUT MATTE — keep the spectrum-filtering work; lower the mirror&#x27;s clarity (roughness floor on the reflection) so the sea reads as painted swell not glass, except in the glitter path.</p>\n<p>LIGHTING (Flow&#x27;s, and what to take from it): Zilbalodis lit every shot himself, and the lighting IS the style more than the shaders are. What the stills show — (a) BACKLIGHT FIRST: the key is usually behind or beside the subject, low and warm; characters read as silhouettes with a bright rim and a halo of scattered light (the capybara at sunset), fronts filled softly by haze, never by a hard fill. (b) SOFT, LARGE SOURCES: shadows are broad and feathered, no crisp contact shadows except where the sun is hard; ambient is a sky/haze gradient, not a flat term. (c) TEMPERATURE CONTRAST, not intensity contrast: warm key against cool fill/haze (apricot sun vs teal shadow) carries the depth; values stay compressed, hue does the separation. (d) LIGHT IS VISIBLE: god rays, halation, glow in fog — the medium is always lit, so light reads as a thing in the air/water, not just on surfaces. (e) PER-SHOT AUTHORSHIP: he adjusted material brightness per shot to serve the light — lighting is composition, not simulation.</p>\n<p>For ABYSSA: 9. RIM-LED THREE-POINT — rebalance Sal&#x27;s rig: rim/backlight up (sun above water, the sleeper&#x27;s wards and the lantern below as backlights when behind him), key softened and warmed, fill replaced by haze-scattered ambient so his front never flattens. Fauna and gardens get the same law via the shared vertex-colour/ambient path (rim from the brightest source direction). 10. SHADOW SOFTNESS — since PCFSoft radius is unavailable on our shadow type, widen the sun map&#x27;s PCF kernel (the raft map is tiny, cost is nothing) and lift shadow-side ambient so deck shadows feather like Flow&#x27;s. 11. TEMPERATURE SPLIT PER STOP — every palette stop and STOPS lighting entry gets an explicit warm-key/cool-fill pair; noon-clear included (Flow&#x27;s noon is still warm-vs-cool). 12. THE MEDIUM STAYS LIT — volumetrics + halation tuned as a unit so a low sun through the surface, a ward behind the leviathan, and Sal&#x27;s lantern in silt all read as light in the water first, illumination second.</p>\n<p>GATES: quiet, never neon; the hard rule holds (everything generated); A/B every step against main with GLASS.style.flowLean (0 = today, 1 = full lean) so Michael dials the midpoint by eye; storm walls, silt line, and the deck&#x27;s brass keep their reads. Reference shots to judge against: the cat on the bow (matte painted hull, soft island), the capybara sunset (halation, haze), the underwater cyan sequences.</p>\n<h3>Log</h3>\n<p>2026-09-05: All twelve items shipped in four parallel branches, merged 4d5eca5 / 52086bf / 41bdc8a / 415a9fa. ONE dial: GLASS.style.flowLean (default 0.6) + per-axis sub-knobs (paint/edge/strokes/haze/grade/dof/camera/light/matte, -1 = follow master); every term proven bit-identical at 0. Materials: paint law over 122 registered materials (roughness floor → 0.75, non-metal metalness → 0, normal maps → 0.5×; brass/copper/lantern/glass/wards stay sharp), edge-not-middle flattening on terrain + rocks, painted strokes on organics only (fade by ~70u; darken on opaque programs, fray on alpha-hash fauna). Atmosphere: air haze one stop, nepheloid ×1.25, lid ring +50%, halation (bloom threshold 0.28→0.18, smoothing up, intensity −32%, radius wider). Colour: per-zone + per-weather grade stack with hue-selective saturation (reef mossy teal / boiler sulphur-amber / abyss violet-black; deck reads the weather look). DoF: subject-aware focus (fauna/schools/predators/lit wards/keepsakes in the centre third, τ 0.6s, hysteresis), wider aperture underwater, deck sharp. Water: matte mirror from above (glitter + TIR sharp, gale untouched). Camera: three handheld layers (standstill/walking/swimming) on position, look and ROLL, heel-coupled, stroke-coupled, interest drift ≤3° toward the nearest living thing released on the first mouse tick, hits as a flinch; deck standstill-only, roll 0; RM ×0.3. Lighting: rim steers to the brightest source BEHIND Sal (sun / lit ward / vent throat / lantern-behind, 1.3× incumbent hold), fill → haze-coloured hemisphere, key warmed/softened, every stop has warm-key/cool-fill, shadow radius 1→7 at full lean (deck shadows feather), god-ray phase redistributed not added. Light count 14 constant, programs flat, GL clean through bypass/resize/ladder. NOT yet: terrain&#x27;s own tRough floor (one line, terrain.js); a __style lab tab. Awaiting Michael&#x27;s eye — the whole point is that he turns the dial.</p>\n<p>2026-09-05 (look-dev, branch fl-lookdev): Michael&#x27;s first glance -- &quot;no different, and the lighting is not right at all&quot; -- measured and answered. Measurer: __style.diff() (0 vs dial, 64x64 scene-linear readback inside the frame hook, noise floor reported). Attribution (each sub-knob alone at 1.0) found the real faults: the grade&#x27;s split-tone wash pulled EVERY dark pixel to the look&#x27;s cool, so Sal&#x27;s copper went navy-black in every zone (the &quot;muddy-dark&quot; read) and the dusk deck was one amber filter; the &quot;lit medium&quot; terms (volumetric phase floor 0.70 + intensity +45%, hemi +45%) lifted the reef&#x27;s mean luminance 60% into neon cyan while the rim itself (x3) was invisible under the wash. Fixes: HUE PROTECTION in the wash (a pixel whose chroma opposes the tint keeps its hue -- copper, lantern, timber survive the cool shadow wash, the sea survives the dusk wash), cool weight halved (coolK 1.0, max 0.5; x1.5 in air so deck shadows go cool against the apricot key), per-look shadow/mid bands so the boiler room and abyss have mids at all (boiler went navy -&gt; sulphur-amber, 130 deg hue turn), CDL push 1.15, washes 0.22-0.42 per look; rim x7.5 under water (was x3; a forced 10 read as the reference), fill floor 0.55 (was 0.40), hemi/ambient underwater lift 0.20/0.12 (was 0.45/0.25), volumetrics +15% with phase floor 0.58, sun -25% in air with hemi/ambient lifted for feathered deck shadows. diff() at 1.0 / 0.6: dusk deck 0.087 / 0.055, noon deck 0.039 / 0.025 (UNDER the 0.06/0.03 gate -- noon is the light-hand stop by design, marine blue kept; by eye the shadows are lifted, p25/p75 0.35 -&gt; 0.44), reef 30 m 0.086 / 0.049, up-sun 20 m 0.118 / 0.071, abyss 0.018 / 0.012 (relDiff 0.96 / 0.67 -- an 0.02-luminance frame cannot move 0.06 absolute), boiler 0.013 / 0.009 (relDiff 0.64 / 0.49). Default stays 0.6. Storm at full lean stays slate (measured by accident with a decaying gale under the dusk stop: no amber). Light count 14, programs flat. Open on Michael: the reef at 1.0 is still a bright cyan (0.6 is the mossy teal); dusk at 1.0 is a full apricot commit -- both are the far end of the dial.</p>\n<p>2026-09-05 (look-dev after Michael&#x27;s first glance — &quot;looks no different and the lighting is not right at all&quot;): Merged 2f4e836. He was right on both counts. Attribution with a new pixel-diff measurer (__style.diff, 0 vs dial, 64² scene-linear readback) showed the grade did ~all of the visible change and the lighting ~1%; the split-tone wash pulled EVERY dark pixel to the look&#x27;s cool tint, so Sal&#x27;s copper went navy-black in every zone and dusk became one amber filter; the &quot;lit medium&quot; lifts pushed the reef 60% brighter into neon cyan while the ×3 rim vanished under them; the boiler room sat entirely in the &quot;shadow&quot; band at 0.02 mean luminance and went navy instead of amber. FIXES: hue protection in the wash (a pixel whose own chroma opposes the tint keeps its hue — copper, lantern pool, warm timber, the sea survive), cool weight halved (×1.5 in air), per-look shadow/mid bands (boiler turned 130° to sulphur-amber), rim ×7.5 underwater (a forced 10 read exactly as the backlit reference), fill floor 0.55 so the camera side is haze-filled never black, hemi/ambient/volumetric lifts cut to compressed-values levels. Gate table at 0.6/1.0 (meanAbsDiff): dusk 0.055/0.087, reef 0.049/0.086, up-sun 0.071/0.118; abyss + boiler clear on relative diff (0.67/0.96, 0.49/0.64 — they cannot move 0.06 absolute without ceasing to be dark). Noon-clear misses its number by design (hue protection keeps the marine blue; shadows lift p25/p75 0.35→0.44). GL clean across 18 bypass toggles, resize, ladder. OPEN FOR THE EYE: reef at 1.0 is bright cyan (0.6 is the mossy teal); dusk at 1.0 is a full apricot commit — both are the far end of the dial.</p>"}, {"slug": "crepuscular-sky", "t": "Crepuscular rays (the sky pokes through)", "d": "Michael's photo (2026-09-05, a road under a broken overcast): a dark, layered cloud deck with a bright hole behind it, and a FAN of pale rays spreading down and outward from the hidden sun — silver-lined cloud edges where the light leaks around them, the rays reading as light IN the air, converging on a point behind the cloud. Our sky has no atmospheric rays; the volumetric pass is underwater-only.", "tags": ["sky", "clouds", "weather", "postfx", "reference"], "updated": "2026-09-05", "body": "<p>Michael&#x27;s photo (2026-09-05, a road under a broken overcast): a dark, layered cloud deck with a bright hole behind it, and a FAN of pale rays spreading down and outward from the hidden sun — silver-lined cloud edges where the light leaks around them, the rays reading as light IN the air, converging on a point behind the cloud. Our sky has no atmospheric rays; the volumetric pass is underwater-only.</p>\n<h3>Detail</h3>\n<p>What the frame is made of: (1) a sun BEHIND cloud, not visible — the rays start from a bright rift, not a disc; (2) TWO cloud layers: a dark, low, lumpy deck (values compressed, grey-blue) and a brighter, higher, torn layer catching the light; (3) silver lining — backlit cloud EDGES glow (forward-scatter transmittance thins at the edge); (4) the rays themselves: soft, wide, many, slightly warm, fading with distance from the hole, visible because the AIR is hazy (they need haze to exist — our Flow-lean haze is the medium).</p>\n<p>BUILD (all generated, WebGL, fits our puff clusters + painted dome):</p>\n<p>A. SKY OCCLUSION MASK: a cheap half-res pass rendering ONLY the cloud puffs + dome coverage as an occluder against the sun&#x27;s screen position (we already have the sun projection for the underwater shafts). The dome&#x27;s fbm coverage gives a soft mask; the puff billboards a hard one.</p>\n<p>B. RADIAL SHAFTS (Sousa-style): a screen-space radial blur of (1 − occlusion) × sun visibility from the sun&#x27;s screen point, 2 passes × ~24 taps, weighted by decay; composited ADDITIVELY into the sky and onto the sea&#x27;s air side, scaled by AIR HAZE (no haze → no rays, physically honest) and by the cloud-coverage window: rays are strongest when coverage is 0.55–0.85 (broken deck), zero at clear and at full lid. Warm tint from the sun disc palette. Works with the sun OFF-SCREEN too (rays fan in from the edge) by clamping the projected point and fading.</p>\n<p>C. SILVER LINING on the puff clusters: a backlit transmittance term on each puff — when the sun is behind a puff relative to the camera, its EDGE (alpha 0.1–0.5 band) gains a bright warm rim (forward scatter), its body stays dark. Ties to the existing per-puff self-shadow idea (ref-cloud-selfshadow) — do both in one round.</p>\n<p>D. TWO-LAYER DECK: the day hand gets a <code>layers</code> field: a low dark stratus deck (puffs flattened, larger, darker base, drifting slower) under a high torn cumulus layer (existing puffs, lit). The hole the rays come from is where the low deck&#x27;s coverage noise dips — bias the shaft mask to the low layer&#x27;s gaps.</p>\n<p>E. LAB: knobs for ray strength, decay, hole bias, lining strength; a &quot;MICHAEL&#x27;S ROAD&quot; preset (coverage 0.72, low deck 0.6, sun 25° behind the deck, haze 0.6).</p>\n<p>GATES: never neon (rays are haze-lit, values compressed like the photo — the brightest ray is dimmer than the hole); the storm lid stays a lid (rays die at cov &gt; 0.9); performance: the occlusion pass is half-res and skipped when the camera is below the surface or the sun is &gt; 40° off-screen; zero new programs at runtime. Judge against the photo: the fan should read as light in the air, converging behind the cloud, silver at the edges.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-09-05 — BUILT on branch <code>crepuscular</code> (agent round, not merged): <code>src/postfx.skyrays.js</code> (half-res sun-visibility mask = dome coverage chunk + puff occluders + depth gate, 2x radial blur toward the clamped sun point, additive composite read against the mask&#x27;s mean, haze-weighted by depth, soft-capped at 0.6x the hole); clouds.js two-layer deck off the new hand field <code>layers</code> (last draw of the hand, pool split, one draw call), silver-lining rim + CPU self-shadow; GLASS.rays knobs + MICHAEL&#x27;S ROAD preset in the lab. Measured: 1.1 ms GPU at 1788x1812, zero programs on first fan, gates (clear/lid/night/underwater/off-screen) verified. Orchestrator to review + merge.</li>\n</ul>"}, {"slug": "rocks-surface", "t": "Rocks read as stone", "d": "Michael: 'rocks have zero texture.' Boulders/pebbles/hero landmarks are vertexColor-only MeshStandardMaterial blobs.", "tags": ["flora", "textures", "quality"], "updated": "2026-09-04", "body": "<p>Michael: &#x27;rocks have zero texture.&#x27; Boulders/pebbles/hero landmarks are vertexColor-only MeshStandardMaterial blobs.</p>\n<h3>Detail</h3>\n<p>Generated rock map set (strata fbm + worley fissures + grit; a darker fissured deep variant), triplanar via onBeforeCompile (instanced rocks have no usable UVs), screen-derivative relief for walk-up read (reference surfaceNormal with the fwidth-resolved guard), cleavage faces/ledges in rockGeo, wet-sheen roughness. Zone palettes still multiply through. Placement stream untouched — site-0 rock fingerprint must match.</p>\n<h3>Log</h3>\n<p>2026-09-04: Shipped, merged 8af8bc5. Two generated 512² map sets (strata + fissures + grit; darker deep variant; 100 ms boot), triplanar via onBeforeCompile, screen-derivative relief resolved by fwidth, three cleavage planes + bedding terraces in rockGeo (tri counts unchanged), wet Fresnel sheen per zone (0.9/0.4/0.12). Rock placement fingerprint bit-identical; programs flat; fps unchanged. TASTE: zone-2 strata read as regular ribbing at 2u — BANDS/weight in textures.js are the levers. Awaiting Michael&#x27;s eye.</p>"}, {"slug": "procedural-gardens", "t": "Procedural gardens (plant vocabulary)", "d": "Michael: 'we need more procedural plants.' Flora has kelp, reef communities, brain coral, rocks — thin for an NMS-bar reef.", "tags": ["flora", "geometry", "quality"], "updated": "2026-09-04", "body": "<p>Michael: &#x27;we need more procedural plants.&#x27; Flora has kelp, reef communities, brain coral, rocks — thin for an NMS-bar reef.</p>\n<h3>Detail</h3>\n<p>New src/world/gardens.js: sea fans, seagrass beds, staghorn, barrel sponges, anemones (zone 0); tube-worm colonies with retracting plumes at chimney feet, bacterial mats, crinoids (zone 1); sea pens with dim bioluminescent tips, glass sponges, whip corals (zone 2). Instanced, vertex-shader sway on the current, zone-gated, own siteParams(&#x27;gardens&#x27;) stream so flora/rock layouts stay bit-identical, ≤12 draw calls. Reseed step after reseedFlora — ORDER IS CONTRACT.</p>\n<h3>Log</h3>\n<p>2026-09-04: Shipped, merged d9c379a. 12 types, 12 draw calls, ~143k submitted tris at the reef; flora/rock fingerprints proven identical wired vs unwired; layout deterministic across voyages. Reseed sits after reseedVentLife (needs activeVents), still after flora. TASTE: colours pulled toward brass after a first pass read as candy — judge against the reference. TODO: authored gardens seeds in site.js (currently a per-site fallback stream). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "procedural-fauna", "t": "Procedural fauna (animal vocabulary)", "d": "Michael: 'we need more procedural sea life.' The evaluation also asked for an indifferent giant — every large body in sight is the objective.", "tags": ["creatures", "geometry", "quality"], "updated": "2026-09-04", "body": "<p>Michael: &#x27;we need more procedural sea life.&#x27; The evaluation also asked for an indifferent giant — every large body in sight is the objective.</p>\n<h3>Detail</h3>\n<p>New src/world/fauna.js with the reference vocabulary (loft/blade/limb/gape/eyes/photophores, part-id vertex animation, 30Hz steering + interpolation, banking): ray, sea turtle, moray in a crevice, reef crabs, sea stars/urchins (zone 0); blind vent fish, flapjack octopus, giant isopods (zone 1); anglerfish with lure, gulper eel, lanternfish shoal with paired running lights (zone 2). Diver + rock avoidance, rest bouts, no new lights, own siteParams(&#x27;fauna&#x27;) stream, hidden during the rite.</p>\n<h3>Log</h3>\n<p>2026-09-04: Shipped, merged 19df564 (recovered from a rate-limit interruption — the first agent left 1361 uncommitted lines; a finisher secured, rebased, and completed verification). 11 animals on one shared vocabulary program (loft/blade/limb/gape/eyes/photophores; part-id vertex animation: tail wave, wing wave, leg shuffle, jaw hinge, lure sway, umbrella pulse, rigid flipper), 30 Hz steering + interpolation, banking, rock + diver avoidance, rest bouts. 12 draw calls, ~97k tris worst case, programs flat at 219 across zone cycles + voyages, own fauna seeds in site.js, hidden during the rite, __noFauna A/B. Esca dimmed 2.2→1.6. FPS unmeasured (pane hidden) — delta is +6 calls/+65k tris at the reef. Awaiting Michael&#x27;s eye.</p>"}, {"slug": "milky-sea", "t": "The snowfield sea (bright-day milk)", "d": "Michael's screenshot: on a bright overcast day from the deck, the sea read as a snowfield — pale cyan-white, glassy, BRIGHTER than the grey sky it reflected. \"Maybe it's the transparency of the water from the surface.\"", "tags": ["water", "bug", "quality"], "updated": "2026-09-04", "body": "<p>Michael&#x27;s screenshot: on a bright overcast day from the deck, the sea read as a snowfield — pale cyan-white, glassy, BRIGHTER than the grey sky it reflected. &quot;Maybe it&#x27;s the transparency of the water from the surface.&quot;</p>\n<h3>Detail</h3>\n<p>Reproduced (day-4 hand, storm ~0.5, sun 41°) and shown to predate the surface-filtering round (identical on the pre-round build). Elimination: detail normals, glitter, foam accumulator, refraction, SSS each off → still icy; opacity off → paler/see-through; not the storm stack (settled storm 0 also milky under a lid).</p>\n<p>ROOT CAUSE (decomposition with a new uDbg term isolator, __sky.dbg(n)): from deck height the sea mirrors only the lowest ~10° of sky, and that band was ALWAYS the clear-day horizon ring — every palette stop authors hor at 2.4-6x zenith, the cloud deck dissolves into that ring at the horizon (&quot;THE MILKY BAND&quot;), and the fog chunk&#x27;s airlight was the noon ring baked as a literal. Under an overcast the lid overhead was dark while the sea mirrored a bright ring the lid had hidden, then had the same ring stacked on as haze. Measured: horizon sky 0.36, sea just under it 0.41 (brighter than the sky). Fresnel, body, transmission, roughness, SSS were all ≤0.03 — innocent. (Also: &quot;clouds 0.86&quot; in my repro was the hand&#x27;s FOG; and weather.set eases over ~8s — an unsettled storm 0 fooled one toggle.)</p>\n<h3>Log</h3>\n<p>2026-09-04: Fixed, merged 4582be0. uSkyHor (what the dome draws AND the sea mirrors) is pulled toward the lid&#x27;s own underside by lidK = max(ms(cov, lidCov), ms(storm, lidStorm)); the fog chunk got its first uniform (abyssaAir — one shared Float32Array installed on every fogged ShaderLib entry; flag 0 = old bake bit-for-bit) so fog airlight, sea rim, and dome horizon are ONE number = the ring under the lid. Numbers (scene-linear, post bypassed): bright overcast horizon sky/sea-under-horizon 0.36/0.41 → 0.20/0.22 — sea ≤ sky everywhere but the 0-2° slit it mirrors. Calm-noon anchor bit-identical (lidCov starts above day-0 cover). Gale keeps walls/foam, reads darker at the horizon than the shipped bright gale — GLASS.cloud.lidRing (0.10) is Michael&#x27;s lever (0.15 restores more haze). Awaiting Michael&#x27;s eye on the SAME bright day.</p>"}, {"slug": "ref-surface-filtering", "t": "Surface filtering (footprint roughness, aniso detail, GGX glitter)", "d": "From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.", "tags": ["water", "quality", "reference"], "updated": "2026-09-01", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.</p>\n<h3>Detail</h3>\n<p>Study: abyssal-living-deep OceanMesh.js FRAG (fpMajor/fpMinor, mssTotal/lost/alpha, the 3-rotation uRippleTex block), ShadingGLSL ggxD/smithGGXCorrelated, ProceduralTextures RIPPLE_FRAG.</p>\n<p>CHANGE: Baked 1024 ripple normal (fbm+worley, mips+aniso) sampled with textureGrad at three rotated incommensurate scales, faded on pixel FOOTPRINT not distance; GGX roughness = Cox-Munk slope variance (0.003+0.00512U) minus the resolved share; sun glitter as disc-widened GGX with correlated Smith replacing pow(sd,uSunSize). Keeps every piece of our Gerstner/foam/SSS/refraction machinery.</p>\n<h3>Log</h3>\n<p>2026-09-01: Shipped, merged b32eaee. Baked 1024² ripple normal (fbm+worley, seeded, zero files); three rotated textureGrad detail layers faded by pixel FOOTPRINT (no distance term — texture now holds to the horizon); Cox-Munk roughness minus the resolved share → GGX α; sun glitter is a disc-widened GGX × correlated Smith × Fresnel behind GLASS.chop.glitterLegacy (0/1 live A/B) with a soft cap so noon never exceeds today. Finding: the literal reference lobe was invisible at our sun/disc ratio — glitterK 14 + the cap made it read. Verdict: GGX = soft path lengthening toward the horizon; legacy = tighter sparkle column. SKIPPED (honest): crosswind narrowing (needs anisotropic GGX); sky-reflection roughness (our sky is analytic, no env lobe to widen). Awaiting Michael&#x27;s eye — the glitterLegacy knob is his A/B.</p>"}, {"slug": "ref-foam-accumulator", "t": "Foam accumulator with windrows", "d": "From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.", "tags": ["water", "quality", "reference"], "updated": "2026-09-01", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.</p>\n<h3>Detail</h3>\n<p>Study: OceanFFT.js ASSEMBLE_FRAG (rate injection, decay, bubble channel) and the windFrame/stretch vec2(0.22,1) foam lookup in OceanMesh.js.</p>\n<p>CHANGE: A small world-tiled ping-pong RT (256²) fed by our existing Jacobian/lag fold source at a RATE with exponential decay (equilibrium coverage), advected by wind; mask stretched 0.22:1 along wind for Langmuir streaks; separate slow bubble channel. Ours persists ~4s via lags but never streaks.</p>\n<h3>Log</h3>\n<p>2026-09-01: Shipped inside the surface-filtering round (b32eaee). 2×256² HalfFloat ping-pong (own attachments), fed by our fold source at a RATE with exponential decay, wind-advected, bubble channel; surface sums it onto the instant lag foam, mask stretched 0.22:1 along wind. Measured: gale 12s → 11.6% cover; decays 0.48@3s → 0.02@21s after calm. Windrows read as faint pale streaks 3s after a gust — foamAccK is the lever if too subtle. Awaiting Michael&#x27;s eye.</p>"}, {"slug": "everything-better", "t": "Everything better (the campaign)", "d": "Michael: \"make every detail of this game better all of it.\" Run as a campaign: every actionable card on the board, plus fresh sweeps of the domains never audited. Decisions stay his.", "tags": ["campaign", "quality", "design"], "updated": "2026-09-01", "body": "<p>Michael: &quot;make every detail of this game better all of it.&quot; Run as a campaign: every actionable card on the board, plus fresh sweeps of the domains never audited. Decisions stay his.</p>\n<h3>Detail</h3>\n<p>WAVE 1 (five parallel branches, disjoint files):</p>\n<ul>\n<li>w1-design — the evaluation&#x27;s design/onboarding batch: settle the verb, bearing strip legible, HUD hierarchy, threaten the air (TORN DRESS leak state), shark-bite lantern flicker + light dip, force the rite to day, rift-shut message, hose gate announced at calm.</li>\n<li>w1-story — home mooring seeded with the mariner&#x27;s story (a keepsake at the skiff + three lines in his hand), tool-shaped reasons per zone (Orune&#x27;s wards answer the sonar; Mhor&#x27;s wards are squid-guarded), octopus lantern theft designed and shipped bounded.</li>\n<li>w1-audio — sailing soundscape (hull creak, canvas, water on the strakes), one bell no longer answers everything (a voice per event class), Web Audio engineering audit (node leaks, scheduling, ducking ramps, master compressor), deck bed, __audio dev surface. Levels conservative and knobbed — the ear pass is still Michael&#x27;s.</li>\n<li>w1-world — raft shadow on the sea (surface samples the sun map), marine snow thins in vent warm columns, ladder rung wear where the grip lands, rift bowl floor glow while it wakes.</li>\n<li>w1-audit (read-only) — the never-swept domains: input/interaction, UI/HUD/typography, survival economy on paper, performance/robustness (context loss, error boundaries, tab-hidden), accessibility/options. Feeds WAVE 2.</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: WAVE 1 merged (7d7771d / 5c36aa6 / 8e5726c / eec2480) — 15 cards closed: the seven design cards, both story cards, octopus theft, shark-bite flicker, sailing soundscape, raft shadow on the sea, vent-column snow, ladder wear. The audit of the unswept domains found first-ten-minutes bugs (Ctrl+W closes the tab while venting; keys stick on tab-out; Esc is not a pause; zone 2 is a fuel death by arithmetic; no context-loss handler; crafting never saves) → WAVE 2 (branch w2-integrate) applies wave-1 wiring patches + 15 audit fixes + the coherent economy set. Decision cut: hose-leash-decision. First wave-2 attempt died to a rate limit before starting; relaunched with per-task commits.</p>\n<p>2026-09-01 (wave 2): Merged e2de325 (+ chroma-off under reduced motion). Wiring patches applied (voyage passage, chime kinds, story messages, lantern hold, mark reads, shelf home slot). Audit fixes: C advertised as vent (Ctrl+W no longer closes the tab), keys clear on blur/unlock/transitions, Esc/blur is a real pause (&quot;CLICK TO TAKE THE HELM&quot;), camera probes the leviathan body + hull, pointer-lock hardened, chart swallows keys, key-repeat guard, keepsake/mark prompts, two-slot priority message queue (no more clobbered lines), HUD legible on the daylit deck + scales with the window, save validated + crafting persists, context-loss overlay, frame-loop failure card + safe() around ambient systems, compileAsync boot (world 268 ms, 88 programs 793 ms — measured for the first time), resize coalescing, reduced-motion + flash cap + threat tint + M mute, gamepad. Economy: FUEL_BURN 1/420, O2_REFILL 0.10, sputter cuts supply, HOSE 120/craft, REQ 640/920, respawn 240s, rescue fuel 0.5 — zone-2 floor now reached with 0.786 tank (~5.5 min of pump, was ~2.5). Campaign&#x27;s agent-doable scope COMPLETE. Remaining: Michael&#x27;s eye pass, ears (audio-audit), three decisions (props glTF, skyline fingerprint, hose leash).</p>"}, {"slug": "sal-breathing", "t": "Sal's breath (bubbles + rhythm)", "d": "Michael: \"sals air bubbles and breathing need more realism. Feel to standard.\" Period-correct Mark V breathing made visible.", "tags": ["quality", "sal", "fx"], "updated": "2026-08-26", "body": "<p>Michael: &quot;sals air bubbles and breathing need more realism. Feel to standard.&quot; Period-correct Mark V breathing made visible.</p>\n<h3>Detail</h3>\n<p>Round on branch sal-breath: exhaust BURSTS from the helmet&#x27;s actual valve position on a breath cycle (~4s at rest), not a stream — 1-2 lead bubbles + a small trail per exhale. Cycle rate driven by context: exertion shortens it, low air shallows it toward a panic read near drowning; phase exported for audio to hook later (no sounds added — audio audit is its own eared round). Bubble physics: size-dependent rise, helical wobble, visible expansion on long rises, death INTO the wave surface. More exhaust while ascending fast (expanding air); nothing in air. A subtle shoulder-rise breath motion on the same phase (rigid suit — it reads at the shoulders, not the chest). Budget: ≤1 new draw call, zero per-frame allocation, no new programs. Gait untouched.</p>\n<h3>Log</h3>\n<p>2026-08-26: Shipped, merged b4d465a, pushed. Scout found THREE unsynchronized breath clocks (shoulder oscillator, bubble timer, audio regulator setTimeout) — unified onto one phase driving shoulders, bubbles, AND the regulator sound. Bursts: 1-2 lead bubbles + 7-14 trail per exhale from the real valve anchor; stray leak rare. Cadence law measured live: rest 4.05-4.45s, sustained swim winds down to 2.25s and RECOVERS SLOWLY after (a sprint costs breaths after it ends); low air shortens toward 1.7s and shallows. Physics: size-dependent rise (leads outrun trail), 1/r helical corkscrew, 1.5x expansion over 30u, death into the actual swell. Fast ascents vent extra. Zero new draw calls (reused the instanced mesh, pool 60→96), zero per-frame alloc. window.__breath probe. Awaiting Michael&#x27;s feel check.</p>\n<p>2026-08-26 (feedback round): Michael: &quot;too subtle, no variability, dont disrupt the water surface.&quot; All three fixed, merged 98ddfe2. Presence: leads 2x+ bigger (r 0.11-0.17) with a silvery fresnel rim (emissive-injected — still fogs with depth), pool 200. Character: burst classes (1/4 thin sip, 1/5 heavy dump), ±60% lead size, gulp bubbles with hard wobble (1/8), valve-chatter double spits (1/5), head-yaw column drift, rest cadence 3.2-5.2s with held breaths (~6s then a big release, 1/10); variance collapses to metered under panic. Surface: new surfaceBoil(x,z,strength) hook — ripple rings folded into the wave normals + churning foam lace at the breach, both sides of the interface, ~1.5s decay; zero new draw calls. window.__boil probe. Note for the eye: in daylight air the white lace is partly eaten by near-field haze — the rings carry the read from the deck.</p>"}, {"slug": "aaa-postfx-pass", "t": "AAA postfx pass (HDR pipeline)", "d": "Fresh audit of the post-rework chain against the threejs-postprocessing pack. Engineering came back consistent (no primary/degrade drift, depth discipline upheld, effects merge as intended) — but the headline is structural: the whole chain runs in 8-bit.", "tags": ["quality", "postfx"], "updated": "2026-08-26", "body": "<p>Fresh audit of the post-rework chain against the threejs-postprocessing pack. Engineering came back consistent (no primary/degrade drift, depth discipline upheld, effects merge as intended) — but the headline is structural: the whole chain runs in 8-bit.</p>\n<h3>Detail</h3>\n<p>Findings: (1) composer never requests HalfFloat — bloom blooms tone-mapped 8-bit values instead of HDR energy, the depth grade double-quantizes (banding on the deep gradients), volumetrics hard-clip; (2) shafts added with no tone-map shoulder — clip to flat cyan-white, the &quot;milky&quot; failure the retune was fighting; (3) DoF air-blend breathes at wave frequency in swells; (4) no dither anywhere + grain dies above 0.75 luminance — mid-tone gradients borderline for banding; plus grain 1Hz re-roll tick, FiniteEffect false-safety comment, wrong auto-sort comment, per-frame string building, grade ramp saturating at −650 of −900, unused cheap-volumetrics degrade rung, screen-axis-locked chroma, vent-ember bloom shimmer watch.</p>\n<p>Fix round on branch aaa-postfx2: all twelve, HalfFloat + shaft shoulder judged together by eye, dither invisible-as-texture gate, DoF verified from the deck in a gale, full GL-error regression (P-bypass, resize, degrade ladder).</p>\n<h3>Log</h3>\n<p>2026-08-26: All twelve shipped, merged to main 3118d4a. Chain is HalfFloat end-to-end (no fps cost on this box — 120fps both sizes; marginal-hardware delta unmeasured); shafts get a Reinhard shoulder (intensity 0.85→1.0, lit-not-milky with internal falloff); DoF air-blend lagged — deck-in-gale horizon stable across bob cycles; zero-mean dither kills mid-tone banding (invisible as texture at −200); grain re-roll on golden ratio (no 1Hz tick); new degrade rung keeps cheap god rays alive before full removal; grade ramp extends −650→−900 with a quiet drift; chroma purely radial; comments honest (FiniteEffect scope, no auto-sort); zero-alloc updateGrade. GL regression clean: 6 bypass toggles, resize, all 4 degrade rungs. UNVERIFIED: vent-ember bloom shimmer at zone-1 range (agent could not stage it against hose physics) — check on a real dive; fix would be luminanceSmoothing up, not threshold. Awaiting Michael&#x27;s eye.</p>"}, {"slug": "aaa-geometry-pass", "t": "AAA geometry pass (go hard)", "d": "The deep one — every asset is generated, so geometry IS the art. Michael's call: \"the geometry pass is probably the one to spend most time on for aaa quality. go hard on this one.\" Three parallel domain audits (hero objects / world / life) with explicit license to spend triangles where the camera lives, then implementation branches.", "tags": ["quality", "geometry"], "updated": "2026-08-26", "body": "<p>The deep one — every asset is generated, so geometry IS the art. Michael&#x27;s call: &quot;the geometry pass is probably the one to spend most time on for aaa quality. go hard on this one.&quot; Three parallel domain audits (hero objects / world / life) with explicit license to spend triangles where the camera lives, then implementation branches.</p>\n<h3>Detail</h3>\n<p>Audit axes: engineering (indexing, segment counts vs viewing distance, tangent frames for the new normal maps, dispose/reseed, bounding volumes under deformation) and the AAA heart — silhouette quality: chamfers and castings on the raft&#x27;s hardware, plank edge relief, terrain ridges at the fog wall, wreck hull sheer/camber, anatomical read on every creature (fins, frills, asymmetry, per-instance variety). Budget deltas estimated per proposal and sanity-checked against 60fps.</p>\n<h3>Log</h3>\n<p>2026-08-26: Three audits complete. Headlines: (1) BUG — the trawler&#x27;s six portholes (including its &quot;one light still burning&quot; story beat) are built and never rendered, lost in an unbaked Part; (2) all three zones&#x27; terrain (~500k tris) renders every frame — zone gating saves ~330k/frame and pays for every uplift below several times over; (3) rock scatter culls at 175u while clear-band sightlines reach ~460u — the &quot;empty seabed&quot; feel is the LOD collapsing; (4) vent chimneys are 7-gons at walk-up; trawler plating authored but under-sampled; (5) the raft reads as primitive-assembly at 9u — no plank chamfers, 12-sided drums, strobing 18-seg flywheel; (6) creatures: fish tails are rigid 2-tri fans with no eyes, the shark is a painted body-of-revolution (no depressed snout, no caudal keel), leviathan cross-section aliases its own 7-lobe scallop, jelly frills are painted not shaped. Total plan ≈ +55k tris of detail, net −265k/frame, zero new draw calls/programs. Three implementation branches in flight (aaa-geo-hero / -world / -life).</p>\n<p>DECISION (Michael): terrain skyline redistribution — bending vertex density toward ridge crests fixes the polyline skyline at the fog wall at zero tri cost, but CHANGES the site-0 terrain fingerprint (the bit-identical regression anchor). Re-anchor deliberately, or keep the anchor and live with the faceted skyline?</p>\n<p>2026-08-26 (later): All three branches merged to main (c35c51b hero, 3b5c54f world, 1b15a44 life) and pushed; integrated build clean. Measured: raft 36k→56k tris at −6 draw calls (exhaust instanced); terrain gating −332k tris/frame with 0 visibility violations across the full ending ascent + voyages; site-0 fingerprint bit-identical (35acc2d0 both sides); program count stable. Shipped: chamfered planks + ovolo rail + hex bolts + deck nails, re-lathed drums, smooth flywheel, 44-seg helmet + Mark V hasp, the trawler&#x27;s lost lit porthole, 12-sided lobed chimneys, resolved hull plating, rock cull to real sightlines, wave-3 aliasing fix, shark spade snout/keel/curling tail/flexing pectorals, fish forked tails + eyes + per-fish proportions, leviathan 22-radial + billowing 4-row membranes + crescent gills + calm-fade perf guards, jelly scalloped lagging skirts (zone-distinct via rib counts), squid/octopus arm resolution, crab claw-lift. Awaiting Michael&#x27;s eye; skyline fingerprint decision still open.</p>"}, {"slug": "aaa-animation-pass", "t": "AAA animation pass", "d": "Last of the skill-pack sweeps. Audit verdict: the motion craft is far above baseline (dt-robustness fully clean, phase-integrated beats everywhere, springs stable, fish tails genuinely exploit the new geometry) — the findings are seams BETWEEN systems, not bad motion. Sal's approved gait fenced off throughout.", "tags": ["quality", "animation"], "updated": "2026-08-26", "body": "<p>Last of the skill-pack sweeps. Audit verdict: the motion craft is far above baseline (dt-robustness fully clean, phase-integrated beats everywhere, springs stable, fish tails genuinely exploit the new geometry) — the findings are seams BETWEEN systems, not bad motion. Sal&#x27;s approved gait fenced off throughout.</p>\n<h3>Detail</h3>\n<p>Fix round on branch aaa-anim: (1) the title screen&#x27;s raft is a dead prop — updateRaft never runs before the early return (frozen flywheel, no exhaust, hull ignoring the animated swell); (2) Sal frog-kicks up the ladder — onLadder is read by nothing → ladderF blend with alternating reach; (3) the calming beat snaps agitation 1→0 in one frame → the thrash now drains out over ~2s; (4) ending flythrough passes a dead boiler room and frozen predators; (5) leviathan half-rate rebuild jitters hide vs wards at close range; (6) lunge fires with zero anticipation → eased coil; (7) drowning = 2.5s half-frozen frame → dignified cut; (8) shark fades by shrinking over 63u → 8u band; (9) octopus flees without a jet — arms now answer; (10) jelly cull hysteresis; (11) raft ride ease → framerate-independent exp form; (12) knife sheath-return one frame early; (13) ending surf-beat eases framerate-independent.</p>\n<h3>Log</h3>\n<p>2026-08-26: All thirteen shipped, merged to main d900be6, pushed. Title raft rides the swell (verified two frames apart: hull attitude, lantern swing, exhaust all move); Sal climbs the ladder with alternating overhead reach + tucked knees (0.25s blend; note: onLadder only exists ascending — descent is a swim past, covered by the blend); calming thrash drains over ~2s (wave rate 3.7→1.15 measured); ending flythrough inhabited (vent life ticks, predators hidden at rite start); leviathan half-rate gated past 70u so the vigil never jitters; lunge coils in over 0.4s; drowning is a quiet pull-away instead of a frozen frame; shark fades in the fog wall&#x27;s last 8u at constant size; octopus jets with its arms; jelly cull hysteresis; raft/ending eases framerate-independent; knife sheath swap after the hand arrives. Integrated build console clean. Awaiting Michael&#x27;s eye. THE SKILL-PACK SWEEP IS COMPLETE: shaders, textures, lighting, geometry, postfx, animation.</p>"}, {"slug": "aaa-texture-pass", "t": "AAA texture pass", "d": "Full texture pass against the threejs-textures skill pack. Audit verdict: engineering is clean (all POT, colorSpace discipline correct, reseed dispose correct, ~15-20 MB budget) — the AAA gap is MISSING textures, not broken ones.", "tags": ["quality", "textures"], "updated": "2026-08-25", "body": "<p>Full texture pass against the threejs-textures skill pack. Audit verdict: engineering is clean (all POT, colorSpace discipline correct, reseed dispose correct, ~15-20 MB budget) — the AAA gap is MISSING textures, not broken ones.</p>\n<h3>Detail</h3>\n<p>Ranked gaps: (1) the raft deck — the game&#x27;s most-stared-at surface — has zero texture maps; 44 weathered boards read as painted plastic under the 58° sun. (2) Vent chimneys (zone 1&#x27;s heroes) untextured. (3) Wrecks lack roughness maps (no wet-metal/dry-scab corrosion contrast). (4) Sal&#x27;s brass is 256px at 2u close-up range. (5) No getMaxAnisotropy anywhere — planks/terrain/footprints blur at the grazing angles they&#x27;re always seen at. Plus: glow sprite duplicated in ending.js, leviathan hide non-deterministic per arrival.</p>\n<p>Fix round on branch aaa-tex: procedural grain/scratch map+rough+normal sets via lib/textures.js (diver.js pipeline; texture = structure, vertex weathering = hue, quiet), one shared 256 noise pair reused across chimneys/props/steel, max-aniso helper, 512 metal maps, roughness derived from existing height canvases.</p>\n<h3>Log</h3>\n<p>2026-08-25: Round shipped, merged to main 17ac658. Deck wood/brass/iron get procedural grain + micro-scratch map/rough/normal sets (grayscale multipliers — palette hues and vertex weathering stay authoritative; grain runs with the boards via BoxGeometry face-UV stretch); chimneys + props share one seeded 256 noise pair; wrecks derive roughness from their height canvases (wet-metal vs dry-scab); helmet brass/copper 256→512 with feature counts rescaled; steel/port share copper detail; getMaxAnisotropy wired everywhere (device 16); footfx prints anisotropic; ending glow dedup; leviathan hide now seeded (stable per site). Texture count +16, 6-voyage soak plateaus (no leak). Verified in-pane at all four hero ranges. Awaiting Michael&#x27;s eye.</p>"}, {"slug": "aaa-shader-pass", "t": "AAA shader pass (all shaders)", "d": "Full pass over every shader in the game against the threejs-skills packs, AAA bar. Three parallel audits (life / world / postfx), then three implementation branches. Absorbs the reversed-smoothstep sweep.", "tags": ["bug", "perf", "shaders", "quality"], "updated": "2026-08-25", "body": "<p>Full pass over every shader in the game against the threejs-skills packs, AAA bar. Three parallel audits (life / world / postfx), then three implementation branches. Absorbs the reversed-smoothstep sweep.</p>\n<h3>Detail</h3>\n<p>Audit headlines (2026-08-25):</p>\n<ul>\n<li><b>Eleven dead reversed-smoothsteps confirmed</b> (sweep card knew 10 of the sites; ventlife shrimp flick is new). Art that has NEVER rendered: the entire 48-billboard god-ray system, both marine-snow layers (6,600 points), every fish&#x27;s photophore rows (the whole zone-2 species identity), jelly crown glow + four-lobed inner core, the shark&#x27;s eye/gills/lateral sheen, all brain-coral grooves AND their bioluminescence, shrimp tail-flick.</li>\n<li>Volumetric shafts were tuned against the invisible billboards — joint re-balance owed on resurrection. All resurrected art is un-reviewed: first live render gets re-tuned to the quiet bar.</li>\n<li>Eight more transparent-DoubleSide double-draws (r163 class): jelly trails/drifters (additive = silently 2× brightness), leviathan membranes, boot prints, rift shaft/caustic/rim, sonar + thruster rings.</li>\n<li>Predator culling stale vs the stratified fog (shark pops at 205u while sightlines reach ~420); rift motes have no distance fade (neon points across the basin — house-law violation); spear metal has no envMap (black stick); chimney normal seams; grain applied before SMAA then smoothed away; COLOR_DODGE grain brightens the murk; DoF blurs the deck horizon; no NaN guard before mipmap bloom.</li>\n<li>Worth reviving from the benched cinematic pass: NaN scrub + depth-driven CDL grade (as merged Effects, not Passes).</li>\n</ul>\n<p>DECISION (Michael): props.js loads downloaded glTF models — violates the generated-only hard rule (predates it). Regenerate props procedurally, or exempt?</p>\n<h3>Log</h3>\n<p>2026-08-25: All three branches merged to main (e36295d postfx, 3166de7 world, f797037 life) and pushed. Combined verify on main: clean console, god rays + snow + jelly structure confirmed live at 52 m (first render ever). Retunes logged in-code old→new (fish glowI 7.5→1.5 etc., volumetrics 1.05→0.85, uRayFade 0.62→0.42, grain COLOR_DODGE→shadow-weighted, deck DoF air-blended). New knob: __grade.amount (depth CDL, default 0.15). Awaiting Michael&#x27;s eye; props.js glTF decision still open.</p>"}, {"slug": "aaa-lighting-pass", "t": "AAA lighting pass", "d": "Full lighting pass against the threejs-lighting skill pack. Audit verdict: the rig's architecture is genuinely strong (three-point on Sal, STOPS depth grading, disciplined per-frame writes) with ONE real contradiction: the leviathan's per-sigil PointLights break the light-count-stability law the vents module treats as sacred — every zone change recompiles every lit material mid-dive.", "tags": ["quality", "lighting", "perf"], "updated": "2026-08-25", "body": "<p>Full lighting pass against the threejs-lighting skill pack. Audit verdict: the rig&#x27;s architecture is genuinely strong (three-point on Sal, STOPS depth grading, disciplined per-frame writes) with ONE real contradiction: the leviathan&#x27;s per-sigil PointLights break the light-count-stability law the vents module treats as sacred — every zone change recompiles every lit material mid-dive.</p>\n<h3>Detail</h3>\n<p>Fix round on branch aaa-light: (1) boot-time pool of 5 sigil lights, borrowed/returned, light count constant forever; (2) calming-flash spike (+900 at decay 1.8) tamed to physical decay with same close-range read; (3) lantern cube shadow 1024→512 A/B; (4) N8AO radius 2.2→~1.0 A/B — contact grounding, gear seats onto planks; (5) procedural deep-water env for underwater metals (RoomEnvironment softboxes → oceanic gradient; raft keeps sky probe); (6) beacon lamp dims in air; (7) rim light clamped above terrain on vertical descent; (8) sun light.layers idea evaluated and DECLINED (per-render light gathering — layers can&#x27;t scope per-material without recompile risk), documented in-code.</p>\n<p>Backlog seed: LightProbe from the sky PMREM could replace the hand-tuned AIR_SKY/AIR_SEA ambient with sunset-correct SH for the deck at dusk (+1 permanent light, added at boot only).</p>\n<h3>Log</h3>\n<p>2026-08-25: Shipped, merged to main 3e4f12e. Sigil pool: light count probe-constant at 14 across two zone cycles AND a full voyage; program count flat after first visits (the mid-dive recompile hitch is gone). Flash 900→360 at decay 2.0 (close-up blaze intact, scene splash gone). Lantern shadow 512 won the A/B (no stair-stepping in murk at 34u). N8AO 2.2/2.6→1.0/3.0 — gear seats onto the planks. New envTexDeep (procedural teal-to-black PMREM) for wrecks/props/flora/tools/tether/leviathan; raft+diver keep the sky path. Beacon dims in air; rim clamped on descent; layers idea declined in-code. TASTE CALL for Michael: lit wards read slightly tighter at long range under physical decay — judge on next dive. Integrated build console clean.</p>"}, {"slug": "water-inkwell-ideas", "t": "Surface water bar (inkwell + poseidon)", "d": "Harvest the ideas (not the code) that make the inkwell WebGPU ocean read so well, as bounded passes on our own WebGL surface: physically-derived foam, wind-shaped glitter, capillary detail, backlit crests.", "tags": ["water", "reference"], "updated": "2026-08-16", "body": "<p>Harvest the ideas (not the code) that make the inkwell WebGPU ocean read so well, as bounded passes on our own WebGL surface: physically-derived foam, wind-shaped glitter, capillary detail, backlit crests.</p>\n<h3>Detail</h3>\n<p>Reference: https://github.com/siliconjungle/inkwell-webgpu-water (MIT). Michael&#x27;s read: &quot;the result was amazing&quot; — full adoption declined (raw WebGPU, no three.js, ~6.8ms GPU, standalone app; would require the WebGPU optics rewrite we ruled out at the r184 upgrade). What actually makes it look right, in rough order of payoff for us:</p>\n<ul>\n<li><b>Jacobian foam</b>: foam where the surface COMPRESSES (the Jacobian of the horizontal displacement), not where it is tall. Our <code>water.js</code> <code>waveSum</code> is analytic so its derivatives are too — true compression is a few extra ops in the fragment shader. Replaces/augments the height-led whitecap gate; foam would track breaking crests through their whole life instead of flashing on peaks.</li>\n<li><b>Cox-Munk glitter</b>: the sun/moon glitter path widens across-wind and tightens along-wind as wind rises (closed-form slope-distribution BRDF, small change in the existing glitter term). One more place the wind becomes visible.</li>\n<li><b>Capillary cascade</b>: a third, very high-frequency normal-only detail layer scaled by wind — the fine &quot;skin&quot; texture that sells their close-ups. Normal perturbation only, no displacement, so localSurfaceY/tether/refraction are untouched.</li>\n<li><b>Backlit crest translucency</b> (&quot;low-energy volume scattering&quot;): when the sun is low and behind a wave, thin crest tops glow green-through. A cheap view/sun/crest-height term; biggest payoff at dawn/dusk, which is where our new days live.</li>\n</ul>\n<p>Constraints as always: no new render targets, bloom discipline, calm-noon anchor, CPU height mirror agreement for anything that displaces.</p>\n<ul>\n<li>Acceptance: each idea lands as its own small verified pass; Michael judges against the inkwell demo&#x27;s feel, knowing ours is a different (quieter) sea.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-07 — evaluated the repo at Michael&#x27;s ask; adoption declined, ideas harvested (&quot;add to backlog... if you have some ideas to push closer to it&quot;)</li>\n<li>2026-08-07 — second reference: https://github.com/owenyuwono/poseidon (&quot;This is amazing&quot; — Michael, with a storm screenshot). Same wall: WebGPU-only Tessendorf FFT, TSL, no WebGL fallback. NEW harvest from his screenshot: (1) CHOPPY horizontal displacement — steep-fronted waves from crowding vertices toward crests (Gerstner-style term on our analytic field; the CPU height mirror in water.js surfaceHeightAt MUST mirror it or the raft/camera/refraction part ways with the mesh); (2) TEXTURED foam with build/decay off the Jacobian (fold-born, lingering, streaking — upgrades the flat whitecap term); (3) foam texture procedural per the all-generated rule. Plan when Michael returns to surface water: the WebGL &quot;poseidon look&quot; pass first (~70% of the screenshot), then, if his eye wants the true spectrum motion, the WebGPU migration becomes a named project-defining decision.</li>\n<li>2026-08-07 — round started (Michael: &quot;go ahead and start surface water bar while I test sal changes&quot;); agent in an isolated worktree so his live test tree stays stable</li>\n<li>2026-08-16 — WebGL &quot;poseidon look&quot; pass SHIPPED on branch <code>surface-water-bar</code> (1f8ab9b), all four pieces in <code>src/world/water.js</code> + a new <code>GLASS.chop</code> block in config.js. (1) Gerstner horizontal displacement per component, gated on <code>k * max(smoothstep(storm,0,0.9), wind)</code> so calm windless is bit-identical. The CPU mirror became an INVERSE problem and is solved by fixed point (up to 4 iterations, early out); measured residual at full chop max 0.032 u / RMS 0.0035 u against a 4.31 u horizontal displacement. New varying <code>vP0</code> carries the parameter point to the fragment shader; the world gradient is <code>(I+J)^-1 grad_p h</code>. (2) Jacobian foam with build/decay and NO render target — a Gerstner field is Lagrangian, so <code>sin(q - w*tau)</code> off the sin/cos already in hand answers &quot;did THIS parcel fold recently&quot; exactly, three lagged samples at one float each. (3) Three-octave procedural foam texture, wind-advected and wind-stretched, absorbing the wind round&#x27;s height-led whitecap; 0.26 clamp kept, foam never blooms. (4) Backlit crest scatter — dusk lights 3.4% of frame at +18 green, noon and night exactly zero pixels. Calm anchor: localSurfaceY maxAbsDiff 0 over 1600 points, frame max 1 code value. Perf +0.20 ms median at deck-in-gale (budget 0.5). 60 s soak flat.</li>\n<li>2026-08-16 — TWO THINGS NEED MICHAEL&#x27;S EYE. (a) <code>GLASS.chop.streakLegacy</code> (default 1.0 = shipped): the OLD wind-streak block paints straight unbroken bands along a fixed 20-degree bearing whether or not the water is folding, and from height in a gale it now reads as corduroy under the new fold-born lace. 0 hands the gale entirely to the Jacobian foam. (b) <code>GLASS.chop.k</code> (1.55): the steepness dial. Deck-wash was measured over 45 frames at k = 0/0.8/1.2/1.55/2.0 and does NOT rise with chop (1.5-1.9% of the deck region either way), so the open <code>gale-crests-deck</code> decision is not made worse — but the taste of how steep this sea should be is his.</li>\n</ul>\n<ul>\n<li>2026-08-08 — merged (c79feaf) + THE MISSING PIECE found by Michael&#x27;s &quot;still dont see the improved water&quot;: at storm 1 the new 2.5u waves rolled THROUGH the raft (its bob was a decorative ±0.32 sine) and buried the standing camera inside the wave. The raft now RIDES surfaceHeightAt (center/bow/beam average, 0.35s ease, pitch/roll from differentials) — deck stays above the sea and the storm is something you WATCH from it. Verified: noon gale from deck, camera dry, foam field visible to horizon</li>\n<li>2026-08-08 — reopened by Michael against the poseidon reference: &quot;not seeing the surface quality I was expecting.&quot; Gap re-diagnosed as LIGHT not mechanics: (1) broad-body SSS — the reference&#x27;s luminous teal lives across whole wave flanks (sun scattered through the upper mass), ours only rims backlit crests at dusk; (2) our storm STOP desaturates to slate by design, fighting the reference&#x27;s BRIGHT sunlit storm — desat must key off darkness, not storm, so a noon gale stays vivid and a night gale stays dread; (3) storm swell scale up now that the raft rides the field. Luminous-sea pass launched</li>\n<li>2026-08-08 — luminous-sea merged (with the orchestrator&#x27;s live-experiment correction: the grey wall was FOUR stacked dimmers — reflected slate storm sky, dark cloud lid, un-gated irradiance cut, un-gated lighting cut — not airFog, which measures 0 in a clear gale). Shipped: broad-body SSS (hue derived from the water&#x27;s own spectrum), a second authored stormDay stop cross-faded by solar height (night gale bit-identical BY CONSTRUCTION), the day gate on lighting&#x27;s storm cut (15.75% at noon, shipped 45% at night), gale swells 1.56x, bloom held to clear-noon levels (42.9%). HONEST REMAINING GAP vs the reference: ours is a bright overcast gale; the reference is a sunlit storm with a hole in the cloud — covStorm 0.30 closes the sky completely, so the sun never breaks through. That breakup is the next pass if Michael wants the last step</li>\n<li>2026-08-08 — Michael: &quot;closer&quot; + three notes: transparency throwing it off (reference sea is OPAQUE — churned storm water; ours stays a glass window), no BREAKING (whitewater must spill down the front faces), and Sal floats on the OLD flat swell while gale waves roll through him. Sal fix landed by the orchestrator (buoyancy equilibrium + ceiling now ride surfaceHeightAt at his position); storm-opacity + spilling breakers to the agent</li>\n<li>2026-08-08 — opaque-storm merged (7ba056c): THE FOAM WAS NEVER ALIVE on this driver (reversed smoothstep = undefined = 0) — fixed; gale seas now opaque-thick (calm window bit-identical, refraction render skipped at full gale — a storm is cheaper than a calm now), whitewater spills down leading faces. Below-side thickening authored at 0.35 (gameplay over physics — Michael may re-rule). Remaining vs reference: cloud breakup (covStorm) + close-range whitewater texture</li>\n</ul>"}, {"slug": "cloud-vibe-bar", "t": "Clouds to the photo bar", "d": "Michael set the cloud quality bar with a reference photo: dusk marine sky, ragged individual cloud clumps gathered low near the horizon with dark flat undersides, a milky haze band at the waterline, ruthlessly quiet grey-lavender palette.", "tags": ["sky", "taste"], "updated": "2026-08-06", "body": "<p>Michael set the cloud quality bar with a reference photo: dusk marine sky, ragged individual cloud clumps gathered low near the horizon with dark flat undersides, a milky haze band at the waterline, ruthlessly quiet grey-lavender palette.</p>\n<h3>Detail</h3>\n<p>The bar (&quot;the vibe of the clouds. this is the bar&quot;): a dock at dusk — sparse torn cumulus CLUMPS each with its own silhouette (not a modulated field), perspective-compressed into a band low in the sky, zenith nearly empty, bases darker than the sky behind them (backlit), merging into a hazy horizon band, calm mirror water. Measurable properties: clump isolation, horizon gathering, dark-base dominance at dawn/dusk ring stops, low chroma.</p>\n<p>Levers: <code>world/water.js</code> <code>skyRadiance</code> cloud block (fbm2 shaping, coverage threshold curve, uCloudDrift), <code>config.js</code> <code>GLASS.cloud</code>.</p>\n<ul>\n<li>Acceptance: side-by-side against the photo&#x27;s four properties at a fair-cumulus dusk; Michael says it hits the vibe.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-06 — bar set by photo; shaping pass launched</li>\n<li>2026-08-06 — shaping pass landed in <code>world/water.js</code> skyRadiance + <code>config.js</code> GLASS.cloud.</li>\n</ul>\n<p>  Four techniques, one per property. (1) CLUMPS: a second, much lower-frequency value-noise</p>\n<p>  blob field gates where cloud may exist, swinging the coverage threshold +/-<code>islAmp</code></p>\n<p>  two-sided (a one-sided penalty just empties the sky — measured 12.9% cover -&gt; 0.7%), plus a</p>\n<p>  high-frequency vn tearing the silhouette. At hand.clouds 0.4 the field went 30 components -&gt;</p>\n<p>  15, mean clump 0.45% -&gt; 0.93% of the sky, isoperimetric ratio 1.76 -&gt; 2.02, at the SAME total</p>\n<p>  cover. (2) HORIZON GATHERING: a view-elevation term on the threshold plus a lowered horizon</p>\n<p>  fade. Cover by band (2-10/10-25/25-45/45-90 deg) inverted from 0.1/8.4/13.1/23.3% to</p>\n<p>  9.1/13.3/17.1/7.7%; zenith cap 24.4% -&gt; 7.5%. The uv clamp became <code>up + 0.10</code> — the old</p>\n<p>  <code>max(up, 0.10)</code> froze the projection below 5.7 deg and stood pale curtains on the waterline.</p>\n<p>  (3) DARK BASES: <code>uCloudBak</code> rises as the sun sinks and pushes the lighting term through</p>\n<p>  pow(k, 2.2)*0.88. Mean cloud radiance / sky radiance at 20 deg: noon 1.07 (inert, lit tops</p>\n<p>  dominate), dusk 1.03 -&gt; 0.90, dawn 0.98 -&gt; 0.86. Bases sit at 0.74x the sky behind them.</p>\n<p>  (4) MILKY BAND: cloud AMOUNT (not colour) is attenuated over the lowest 10.4 deg, so it</p>\n<p>  cannot double-apply with the marine layer&#x27;s airFog. Rendered cloud/sky contrast falls 18.2</p>\n<p>  -&gt; 5.5 code values from the cloud band to the waterline, i.e. to the dither floor.</p>\n<p>  Storm is untouched by construction — every shaping term is storm-scaled to zero (verified</p>\n<p>  live: islAmp 0.20 -&gt; 0.010, rag -&gt; 0.008, zenBias -&gt; 0.013, bak 0) and the deck still</p>\n<p>  flattens dark (sky SD 13.8 at storm 0.91 vs 21.1 fair). Wind drift, ember undersides and</p>\n<p>  the bloom cap all intact. Cost: 2 extra value-noise samples per above-horizon fragment</p>\n<p>  against the 8 already there; below the measurement floor in the pane (28.66 vs 28.60 ms mean).</p>\n<p>  Still needs Michael&#x27;s eye against the photo — that is the acceptance test.</p>\n<ul>\n<li>2026-08-06 — shaping shipped: clump-isolating blob mask (30→15 components at equal cover, clumps 2x bigger, raggedness 1.76→2.02), horizon gathering (zenith 24.4%→7.5%, low band 0.1%→9.1%), dark bases at the day&#x27;s edges (0.86-0.90x the sky, exactly 0 at noon), 10.4° milky merge (contrast 18.2→5.5 into the glint floor). Storm deck and wind drift untouched; cost unresolvable above pane noise. AWAITING MICHAEL&#x27;S EYE vs the photo</li>\n<li>2026-08-06 — Michael: &quot;clouds seem really flat still, no dimension.&quot; Diagnosis: coverage-map shading — no lit/shadow flank per clump. Dimension pass launched: sun-offset density gradient (cheap volumetric illusion), per-clump vertical profile (dark flat base -&gt; domed lit top), sunward cauliflower detail</li>\n<li>2026-08-06 — dimension pass shipped: terminator flank shading off the existing sun gradient (zero added noise samples), threshold-relative height profile (dark base skirt -&gt; domed lit crown), cauliflower relief on lit faces only. Within-clump range 1.6-&gt;2.0 (control region unmoved), sun-side swing +26% and flips with the sun, dusk bases within -5% (no double-darkening), storm deck byte-equivalent on/off, +0.29ms. GLASS.cloud form* knobs. Still awaiting Michael&#x27;s eye vs the photo</li>\n<li>2026-08-07 — OPTION A shipped on r184: world/clouds.js — one InstancedMesh, 16 clusters x 30 soft puffs, dealt per dayIndex, per-puff sun form in the vertex shader (crown 0.96 vs base 0.39, flanks cross when the sun swings), depth-sorted per frame, drifting on the eased wind. PARALLAX IS REAL: near cluster shifts 20.95px vs far 6.24px for a 6-unit camera move — 3.4x differential, the thing no dome can do. Storm hands off to the flat painted deck (GLASS.cloud.dome), fog mornings dissolve clusters, visible refracted through Snell&#x27;s window. +1 draw call. Awaiting Michael&#x27;s eye vs the photo</li>\n</ul>"}]}, {"key": "decision", "title": "Needs Decision", "sub": "blocked on the user's call", "cards": [{"slug": "three-sleepers", "t": "The Three Sleepers (crab / octopus / squid)", "d": "Michael: the leviathan is boring, one serpent scaled three ways. Each zone gets its own colossus — crab, octopus and squid characteristics, not those anim
