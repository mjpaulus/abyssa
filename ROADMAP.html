als — monolithic next to Sal, different strengths and weaknesses. Something discoverable in each level triggers the creature (the trigger is also the reward), so the world gets bigger and more discoverable. Wards stay the verb; the payoff differs per zone.", "tags": ["leviathan", "design", "world", "geometry"], "updated": "2026-09-24", "body": "<p>Michael: the leviathan is boring, one serpent scaled three ways. Each zone gets its own colossus — crab, octopus and squid characteristics, not those animals — monolithic next to Sal, different strengths and weaknesses. Something discoverable in each level triggers the creature (the trigger is also the reward), so the world gets bigger and more discoverable. Wards stay the verb; the payoff differs per zone.</p>\n<h3>Detail</h3>\n<p>Full design: docs/superpowers/specs/2026-09-13-three-sleepers-design.md. Zone 0 VELKATH THE BROODER, buried as the ridge, woken by taking an egg from her nest; wards underneath, seen only when she stands; the last ward lights when the eggs go back. Zone 1 ORUNE THE HOARDER, lairing in the trawler&#x27;s hoard of drowned lights; woken by taking the ship&#x27;s lamp; takes the hose, hates light; you keep the lamp and she becomes a lit landmark. Zone 2 MHOR THE HUNTER, drawn up from below when you refuel the dead furnace; speed and reach, stunned by the flare; payoff is passage. Each zone gets a 3-4 point discoverable chain pencilled on the chart. Base/creature module split first, then one creature at a time, serpent stays until replaced. Folds in octopus-lantern-theft and resolves hose-leash-decision (clamp with give = her pull).</p>\n<h3>Log</h3>\n<p>2026-09-13: Design written from a short brainstorm; Michael asked to be surprised rather than consulted on payoffs. Awaiting his read of the spec before planning.</p>\n<p>2026-09-24: Plan written (docs/superpowers/plans/2026-09-24-brooder-body.md): module split, then the Brooder&#x27;s body posable in the lab, stop for Michael&#x27;s eye. Split regression anchor <code>__lev.fp(i)</code> recorded on the pre-split serpent: zone 0 15ce888c, zone 1 c938fe6e, zone 2 652d0412 (deterministic from the first call; the probe warms a lazy cache that draws Math.random once).</p>\n<p>2026-09-24: Checkpoint 1 shipped on branch sleepers-brooder. (1) leviathan.js split into facade + sleeper/common.js + sleeper/serpent.js: all three serpent fingerprints identical after the move. (2) VELKATH THE BROODER&#x27;s body, posable in the lab: scuted chalk carapace (26 mirrored scutes, growth lines, barnacle crust, weed), brood apron and pitted belly, eight legs on planted-foot IK with an alternating tetrapod gait, crusher and cutter claws, eye stalks that fold into the orbits asleep, underside wards buried and dark while she sleeps and touchable only when she stands. Measured: 117k tris, 120 Hz uncapped with her in view, lights 14, programs stable across swaps, zero geometry/texture growth. Look-dev passes fixed a spider-crab first cut, a rockpile of barnacles, halos glowing through the sand, pipe-like legs and a flat belly. Also fixed a pre-existing serpent leak (one texture per zone entry). HOW TO SEE HER: ?lab, start a dive, sleeper group, brooder, then stand / walk to me / rear. Zone 0 still ships the serpent until Michael rules. Known: asleep, the tucked eyes still peek at the front rim; the ridge/nest reveal is the next plan.</p>\n<p>2026-09-24 (feedback round): Michael: &quot;first pass at the crab is ok, I didnt want a literal crab though. Crab like creature. It should feel menacing.&quot; Redesigned on branch brooder-menace: hunched wedge-shield carapace heavier at the front with a brow visor over the face; wet near-black armour with bone-worn scute chamfers, scars and black seams; bone thorns (lateral spikes raking back, brow spikes, a dorsal ridge, crown thorns); a cluster of eight black eyes with no glow, only catchlights; three pairs of hooked mouthparts always working; a bone-pale crusher and a mantis scythe folded before the face at rest, raised and cocked in threat; tall spiked legs with pale soft joints, knees above her back; corpse-pale underbelly; she hunches over the diver standing and rears on her own inside ~37 u. Also a dev-only __power.drive(true) so probes and captures work while the browser pane is off screen (a hidden document gets no rAF), with a one-pending-rAF guard. Fingerprints unchanged, lights 14, no memory growth across swaps.</p>\n<p>2026-09-24 (reference round, WIP on branch brooder-reef, NOT merged): Michael sent a painted concept (&quot;this feels more menacing&quot;, saved as docs/superpowers/specs/brooder-reference-michael-2026-09-24.webp): low massive wedge body, V prow over a deep small face with pinpoint eyes, layered rust-edged shale plates down the flanks, huge forward-held knobbed grey-teal arms ending in long rust hooked pincers, short hidden legs, a reef growing on her back. Built toward it: V-prow slab shell, moss/rust/sponge-hole palette, 4 layers of curled shingle plates, reef growths (tube sponges, fan corals), knobbed hook-pincer arms with fang teeth, pinpoint eyes, 5 pairs of mouthparts, low stance with short spined legs. Honest state: proportions and plates closer, but in-game frames at 700 m are too dark to judge form against a lit painting, the threat pose still lifts the arms too high, and the plates still read soft. Next: a lit look-dev &quot;studio&quot; view (turntable, neutral light) so the form can be matched to the painting before judging it in the water.</p>\n<p>2026-09-24 (creative-liberty round): Michael: &quot;cant you just make a guess...take some creative liberty... create a menacing crab like creature.&quot; Committed to a design for how she is actually seen (dark water, lantern light), building on the reference round: coconut-crab asymmetry (major claw 1.35x vs minor 0.72x, nearly double), the threat is a LUNGE (front drops toward the diver, the great claw rises to head height and gapes; the minor stays low as a guard working across the mouth), EYESHINE (the eight eyes are dark until Sal&#x27;s lantern faces them, then throw it back as pale green-white pinpoints, scaled by facing, distance and lantern charge), crab-fashion STALKING (awake and not yet striking, she circles the diver sideways with her face locked on him, switching direction every 4-8 s), squat stance with short spined legs. Kept: V prow, shale shingles, reef back, knobbed hook pincers with rust fangs. Fingerprints unchanged, lights 14, zero memory growth across swaps, console clean. Merged to main; zone 0 still ships the serpent until Michael approves.</p>\n<p>2026-09-24 (the Brooder&#x27;s rite, zone 0 flipped to her): she sleeps as a ridge of shale shards on the rift&#x27;s LIP (seated in the rift bowl she sank ~60 m and read as a hole), legs folded under her shell, no name card and no bearing until she wakes; the dive-start line teaches the goal without describing her (&quot;SOMETHING SLEEPS BY THE RIFT...&quot;). Her nest lies in her lee (brood.js): a ring of silt and stones, three helmet-sized eggs with a slow warm pulse; a curving trail of many-legged tracks runs from the open seabed past the broken shells of an old clutch, each found once with a line. [E] takes an egg (held at Sal&#x27;s side, one at a time) — the first take wakes her: her name, a growl, silt pouring off her as she rises over ~6 s. Awake she stalks sideways and lunges; the great claw&#x27;s hammer cycle (2.6 s) knocks Sal away and drains his light at the bottom of the swing. The BROOD RULE: her last ward will not light while any egg is out (&quot;THE LAST WARD IS COLD...&quot;); set them back and it lights on its own. Calmed, she walks home and settles over her brood. Verified live end to end (take, wake, two wards, refusal, return, auto-light, calm, walk home, settle). Serpent fingerprint 15ce888c kept via __lev.fp (forces kind serpent). Console clean.</p>\n<p>2026-09-24 (ORUNE THE HOARDER, zone 1 flipped to her): hoarder.js + hoarderGeo.js + hoard.js. An octopus-like colossus: a warty chromatophore mantle-sac (generated pigment-cell skin, faint violet photophore freckles that breathe asleep and run hot roused) behind raised eye turrets (gold irises, horizontal slit pupils, lids shut to slits asleep, eyeshine when the lantern finds them), eight ~37 u arms rebuilt per frame as world-space tubes with pale sucker faces and 112 instanced suckers. Asleep she lies wrapped round the broken trawler, arms draped over it and across the silt (&quot;THE CARGO CHAIN IS WARM. IT IS NOT CHAIN.&quot;). THE HOARD: drowned lanterns ring the lair (fog-off sprite glows with a distance curve — zone 1&#x27;s far beacon), a trail of them leads in, and the ship&#x27;s lamp stands on a crate at the heart. [E] TAKE THE SHIP&#x27;S LAMP wakes her: her name, the arms rise staggered, and the hoard&#x27;s lights go out one by one (13 -&gt; 3). Awake she turns to the diver and pours toward him; arms LASH, a hit GRABS and drags him toward her beak (&quot;IT HAS YOU. CUT IT.&quot;) until the knife cuts (game.js calls lev.onSlash) or 5 s pass; an arm the lit lantern comes near flinches and rolls, baring its sucker face. Her four wards ride the sucker faces, dark until the sonar rings them (zone-1 rule kept). Calmed, she coils round the wreck and her wards STAY burning: a lighthouse. She lets Sal keep the lamp: lantern regen x2.2 (player.hasLamp). Verified live end to end; hose leash (open decision card) held Sal at 380 u during testing, so tests extended the hose. Fingerprints unchanged, lights 14, zero memory growth across swaps.</p>\n<p>2026-09-24 (MHOR THE HUNTER, zone 2 flipped to him — all three sleepers now ship): hunter.js. A squid-like colossus ~36 u: lathed torpedo mantle with a head bulb and tail fins, generated red chromatophore hide with rows of photophores (emissive map) that pulse when he hunts, great black eyes that throw back the lantern, 8 arms + 2 tentacles with clubs as per-frame tubes. He is NOT in the zone: the zone is cold, THE LAST FURNACE (a 28 u black smoker) is dead with scorched stumps round it (&quot;A DEAD CHIMNEY. SCORCHED...&quot; / &quot;THE LAST FURNACE. COLD. IT WANTS FEEDING.&quot;). [E] FEED THE FURNACE costs 2 bitumen: the throat goes red-hot (emissive + fog-off glow sprites), and a WARM POCKET within 28 u refills air (the depth reward; measured 0.40 -&gt; 1.00). ~14 s after the fire takes he comes up out of the black (his name, a growl). He circles the diver out in the dark, closing, then STRIKES head-first with tentacles shooting out; a hit throws Sal and tears the dress; ink (Q) in his line breaks the strike (&quot;THE INK BREAKS HIS LINE.&quot;). The weakness: a strike that runs through the furnace flare blinds him — the fire also scatters his squid keepers (the zone-2 rule rides him otherwise); he hangs stunned 10 s, sinking, his wards burning hot across his hide (borrowed pool lights), and only then can they be lit. Calmed, he sinks back into the deep; the furnace burns on. Verified live: prompt/feed, pocket, arrival, circle, strike, stun by bait over the fire, wards, calm, leave. Fingerprints unchanged, lights 14, memory flat across rebuilds.</p>\n<p>2026-09-24 (the ending matches): ending.js&#x27;s three silhouette passes are the new animals, not three eels — Mhor streams through tail-first with arms trailing and orange photophores; Orune jets past, sac leading, arms pulsing behind, her wards burning; Velkath walks home along the zone-0 floor, her pass timed to the moment the diver rises past it so she crosses at eye level. Verified by playing the ending through and capturing each pass.</p>\n<p>2026-09-24: Moved to Needs Decision — all three sleepers and their rites ship; Michael&#x27;s play-through is the judge (feel, difficulty, legibility of each trigger). The hose leash (its own open decision) currently stops a diver at 380 u of line in testing; the zone-2 furnace and Orune&#x27;s lair are reachable with normal hose progression.</p>"}, {"slug": "hose-leash-decision", "t": "The hard hose leash — keep or cut?", "d": "The audit found a hard leash: tether.js clamps player.pos at survival.hose. CLAUDE.md records that you REJECTED leash-clamping (\"never leash-clamp the player\"). Either the doc is stale or the clamp regressed in.", "tags": ["design", "survival", "decision"], "updated": "2026-09-01", "body": "<p>The audit found a hard leash: tether.js clamps player.pos at survival.hose. CLAUDE.md records that you REJECTED leash-clamping (&quot;never leash-clamp the player&quot;). Either the doc is stale or the clamp regressed in.</p>\n<h3>Detail</h3>\n<p>As shipped: at full hose the diver is HELD and (tautness 1 → unsupplied) DRAINS at the same moment. Options: (a) keep the clamp — physical, but contradicts the recorded ruling; (b) soft leash — no clamp, taut line just cuts supply and the drag pulls back (the rejected-clamp version); (c) clamp with give — a 4-6u elastic band then hold. The new HOSE_REQ set (640/920) was chosen to equal floor-diagonal reach so the leash never fires against a sleeper&#x27;s wander regardless. Your ruling; the code is untouched until then.</p>"}, {"slug": "warm-near-field", "t": "Warm near field, zone 0", "d": "Red 2% reach 84 -> 105 units in zone 0. Is the warmth right?", "tags": ["water", "taste"], "updated": "2026-08-05", "body": "<p>Red 2% reach 84 -&gt; 105 units in zone 0. Is the warmth right?</p>\n<h3>Detail</h3>\n<p>Kill switch is three adjacent constants in <code>src/world/water.js</code>: set <code>K_PART</code> equal to <code>K_EXT</code> and <code>SILT_MIX</code>/<code>SILT_GAIN</code> to 0.00/1.00 to revert the warm near field entirely.</p>\n<p>Worth judging NOW: until the samplePerf fix the game silently ran with volumetrics/AO/shadows off — you had never seen full quality.</p>\n<ul>\n<li>Acceptance: Michael rules keep / revert / tune, after seeing zone 0 at full quality; his words go in the log.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried from the silt-line round; still awaiting the call</li>\n</ul>"}, {"slug": "voyage-fade-timing", "t": "Voyage fade timing", "d": "2s fade out, 2.3s at black (reseed), 1.6s return. Judged only by feel, in real time.", "tags": ["chart"], "updated": "2026-08-05", "body": "<p>2s fade out, 2.3s at black (reseed), 1.6s return. Judged only by feel, in real time.</p>\n<h3>Detail</h3>\n<p>Constants live in game.js voyage block (<code>voyageT</code> thresholds 2 / 2.3 / 4.6 / 6.2).</p>\n<p>Sound is currently chain slam at weigh-anchor + bell on arrival.</p>\n<ul>\n<li>Acceptance: Michael sails once at real speed and rules on the three thresholds; retune is minutes.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at phase 4 ship (de2aacc)</li>\n</ul>"}, {"slug": "vent-ember-strength", "t": "Vent ember strength", "d": "The ember halo reads to 90 units — zone 1's wayfinding. Too shy or too loud on a real monitor?", "tags": ["zone 1"], "updated": "2026-08-05", "body": "<p>The ember halo reads to 90 units — zone 1&#x27;s wayfinding. Too shy or too loud on a real monitor?</p>\n<h3>Detail</h3>\n<p><code>src/world/vents.js</code> update loop: far term <code>far * 0.22</code>, near bore-fire <code>near^2 * 0.30</code>, halo swell <code>0.9 + dist * 0.075</code>.</p>\n<p>The vent light gate is linear over 34 units (camera trails the diver by ~10).</p>\n<ul>\n<li>Acceptance: Michael approaches a hot vent from 90 units out at night and rules on the far and near coefficients.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at boiler-room ship (cf0b51e)</li>\n</ul>"}, {"slug": "sleepers-persist-decision", "t": "Sleepers-persist decision", "d": "V1: the chart records history but sleepers re-wake per visit. Keep as ritual, or persist the calm per site?", "tags": ["chart", "design"], "updated": "2026-08-05", "body": "<p>V1: the chart records history but sleepers re-wake per visit. Keep as ritual, or persist the calm per site?</p>\n<h3>Detail</h3>\n<p>Design question, then small build. Persisting needs makeLeviathan to boot calmed (sigils lit, <code>calmed=true</code>) — modest leviathan surgery.</p>\n<p>The ritual reading: the sleepers stir again when you leave; the chart remembers that you HAVE calmed them, the water does not.</p>\n<ul>\n<li>Acceptance: Michael rules ritual (re-wake) or persistence; if persistence, a follow-up card scopes the leviathan boot-calmed work.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — deferred deliberately at phase 4; user call pending</li>\n<li>2026-08-05 — moved next -&gt; decision; the generic columns made it obvious this is blocked on the user, not queued work</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: Evaluation&#x27;s recommended ruling — &quot;ritual, remembered&quot;: sleepers re-wake per visit, but a previously calmed one carries its wards already dim-lit and needs N-1 touches; the water half-remembers. Keeps the ritual, shortens revisits; cost is a calmedBefore bool into the makeLeviathan override. Michael&#x27;s call.</p>"}, {"slug": "pump-audio-level", "t": "Pump audio level", "d": "The synth engine thump is deliberately shy. Does it carry on your speakers?", "tags": ["audio"], "updated": "2026-08-05", "body": "<p>The synth engine thump is deliberately shy. Does it carry on your speakers?</p>\n<h3>Detail</h3>\n<p><code>src/audio.js</code> setPump: ceiling ~0.08 dry-equivalent at point-blank. Raise the 0.30 in pumpBus&#x27;s ramp if it hides.</p>\n<p>The fuel-out die-down is the load-bearing moment: rate stretches naturally, no linear fade.</p>\n<ul>\n<li>Acceptance: Michael stands by the pump and dives once with sound on; the pumpBus ceiling moves or stays.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at pump-audio ship; never heard by anyone yet</li>\n</ul>"}, {"slug": "gale-crests-deck", "t": "Gale crests over the deck", "d": "In a full gale, wave crests overlapping the raft show refracted water, not the deck behind them.", "tags": ["water", "storm"], "updated": "2026-08-05", "body": "<p>In a full gale, wave crests overlapping the raft show refracted water, not the deck behind them.</p>\n<h3>Detail</h3>\n<p>Inherent screen-space refraction limit: geometry above water is not in the underwater target.</p>\n<p>Reads as sea washing the deck — defensible in a storm, but judge in motion.</p>\n<p>Distortion already hard-clamped at 0.035 NDC (unbounded it ghosted a phantom davit leg).</p>\n<p>If unacceptable: fade <code>uRefrK</code> by fragment-to-raft proximity on the air side, at the cost of transparency right at the hull.</p>\n<ul>\n<li>Acceptance: Michael watches a full gale from the deck and rules acceptable-as-sea-washing or fix-by-proximity-fade.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at refraction ship (53376e8)</li>\n</ul>"}, {"slug": "fly-remote-sites", "t": "Fly Pallid Bank + Burned Ground", "d": "Phase 5 of THE CHART: judge both remote skylines, vent clusters, wreck placement with your own eye.", "tags": ["chart", "phase 5"], "updated": "2026-08-05", "body": "<p>Phase 5 of THE CHART: judge both remote skylines, vent clusters, wreck placement with your own eye.</p>\n<h3>Detail</h3>\n<p>Sail via the chart table, or console: <code>__chart.arrive(1)</code> (Pallid) / <code>__chart.arrive(2)</code> (Burned).</p>\n<p>Tuning is one row per site in <code>src/world/site.js</code>: <code>terra.off</code> moves skylines, <code>scarcity</code> moves the economy, <code>sleepers</code> rows carry sigils/hue/epithets.</p>\n<p>Terrain fingerprints if a probe is needed: home 5e6cfe45, Pallid ef14da09 (32x32x3 grid).</p>\n<ul>\n<li>Acceptance: both sites feel like different water, not palette swaps; sleeper rows read harder without being unfair.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at THE CHART v1 ship (de2aacc); awaiting flyover</li>\n</ul>"}, {"slug": "far-ridgeline-read", "t": "Far ridgeline read", "d": "Does the W2 rampart read against the rim? 4.5% vs 13.1% transmittance — measured 2.9x separation, but subtle.", "tags": ["terrain"], "updated": "2026-08-05", "body": "<p>Does the W2 rampart read against the rim? 4.5% vs 13.1% transmittance — measured 2.9x separation, but subtle.</p>\n<h3>Detail</h3>\n<p><code>RAM_H</code> in <code>src/world/terrain.js</code> (currently 66) is the lever if too faint on a real monitor.</p>\n<p>Also of note: the rampart breaches the surface in places — distant &#x27;islands&#x27; on the horizon from the deck. Looks intentional; confirm you like it.</p>\n<ul>\n<li>Acceptance: Michael judges the horizon from mid-water and from the deck; RAM_H moves or stays; islands blessed or cut.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried from W2; islands observation added during the raft round</li>\n</ul>"}, {"slug": "deck-camera-pullin", "t": "Deck camera pull-in", "d": "Camera sits 9 back; the raft is 9.4 wide — deck detail is only ever read from range.", "tags": ["camera"], "updated": "2026-08-05", "body": "<p>Camera sits 9 back; the raft is 9.4 wide — deck detail is only ever read from range.</p>\n<h3>Detail</h3>\n<p>The levers are <code>CAM_BACK</code> and <code>CAM_UP</code> in <code>game.js</code>. Pulling the camera in while <code>player.onDeck</code> is true would change movement feel — explicitly the user&#x27;s call.</p>\n<p>All raft detail work to date was judged at the 9-unit distance.</p>\n<ul>\n<li>Acceptance: A ruling: keep the 9-unit boom everywhere, or a chosen closer distance on deck; then implement and judge live.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried from the raft round (bb6e78a)</li>\n</ul>"}, {"slug": "chart-parchment-look", "t": "Chart parchment on your monitor", "d": "The in-game paper chart: warmth, size, drop shadow, and the one authored margin line.", "tags": ["chart", "ui"], "updated": "2026-08-05", "body": "<p>The in-game paper chart: warmth, size, drop shadow, and the one authored margin line.</p>\n<h3>Detail</h3>\n<p><code>src/ui/chartOverlay.js</code>. Judged fine in the pane; only a real monitor settles it.</p>\n<ul>\n<li>The drop-shadow filter is the first thing to cut if it reads as a floating UI card.</li>\n<li>The margin line WHAT SLEEPS WILL WAKE FOR NOISE is the only authored copy beyond YOU RIDE HERE — delete if it oversteps.</li>\n<li>Check the two conditions lines clear each other at narrow widths.</li>\n</ul>\n<ul>\n<li>Acceptance: Michael judges warmth/size/shadow/margin-line on his monitor; each keeps or changes by his word.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created; overlay verified structurally + visually in pane</li>\n</ul>"}]}, {"key": "done", "title": "Done", "sub": "shipped and verified", "cards": [{"slug": "polish-props", "t": "Props polish — resource nodes, the Brooder's nest, the umbilical, generated log + barrel", "d": "Michael: \"lots of things just look like primitives no polish. AAA is the bar.\" After the seven polish passes the zone-0 after-shots still had primitives beside a now-AAA Sal: stacked-sphere polymer nodules and half-sphere bitumen pools, 14 raw dodecahedron nest stones in flat sand, smooth eggs, a flat corrugated tether that clashed with Sal's braided feed hose at his inlet, and two downloaded Kenney glTFs (log, barrel) in props.js, which broke the generated-only rule.", "tags": ["quality", "props", "resources", "brooder", "tether", "textures"], "updated": "2026-09-26", "body": "<p>Michael: &quot;lots of things just look like primitives no polish. AAA is the bar.&quot; After the seven polish passes the zone-0 after-shots still had primitives beside a now-AAA Sal: stacked-sphere polymer nodules and half-sphere bitumen pools, 14 raw dodecahedron nest stones in flat sand, smooth eggs, a flat corrugated tether that clashed with Sal&#x27;s braided feed hose at his inlet, and two downloaded Kenney glTFs (log, barrel) in props.js, which broke the generated-only rule.</p>\n<h3>Detail</h3>\n<p>Branch <code>polish-props</code> (not merged). Files: src/world/resources.js, src/world/props.js, src/entities/sleeper/brood.js (geometry and materials only), src/systems/tether.js (mesh material and a fitting only), assets/props/, and a marked block appended to the end of src/lib/textures.js (<code>eggSkinSet</code>, <code>barkSet</code>, <code>staveSet</code>).</p>\n<p><b>Resource nodes.</b> Each node&#x27;s form is built from exactly the draws the shipped spheres spent (polymer 16, bitumen 12, same order), so the stream, positions and phases are unchanged. Each node is one mesh plus the glow sprite (still the last child), draped on the seabed. There are two materials, each created once.</p>\n<ul>\n<li>Polymer: a smooth union (log-sum-exp) of the four shipped lobes plus 2–3 buds, solved along rays on a welded icosphere. Crevice depth goes into a vertex attribute for silt. Waxy jade flesh with patchy crazed rind, blisters, a view-depth inner glow and a translucent rim.</li>\n<li>Bitumen: one polar height field. A glossy near-black pool with the three shipped blobs as frozen gas blisters, a lifted crust lip, cracked crust plates with silt on their tops, and a sulphur and iron-orange bloom at the rim.</li>\n</ul>\n<p><b>The nest.</b> The rite contract is untouched: every <code>rnd()</code> draw, egg home, take/return radius and <code>B.*</code> member.</p>\n<ul>\n<li>Eggs: <code>eggSkinSet</code> has grown vessels (tapering, forking random walks) with a blurred subsurface halo over pebbled leather. It is projected triplanar in the egg&#x27;s own space, because eggs are carried. The clutch&#x27;s pulsing warmth shows through the skin, with the vessels as deep red shadows, plus a warm wrap of the key light. No light was added.</li>\n<li>Shards: a jagged broken outline with real thickness, a pale membrane inside and a bone rim.</li>\n<li>Stones: 14 noise-displaced, water-rounded cobbles merged into one mesh and half-buried, using <code>rockMapSet(0)</code> triplanar in flora&#x27;s rock grammar (one program).</li>\n<li>Nest ring: the torus is now a berm drawn with the terrain&#x27;s own material at the exact rendered height (the wrecks&#x27; drift-skirt idiom), so it is seabed. It is removed before <code>disposeSleeper</code> can dispose the terrain material.</li>\n</ul>\n<p><b>Tether.</b> The material samples the very <code>braidSet</code> textures diver.js binds, through its own uniforms (no second bake, and diver.js&#x27;s repeat is untouched), at Sal&#x27;s braid pitch. Along the hose it uses world arc length. Around it uses a view-locked azimuth, because the instance roll swims; the atan seam sits on the unseen far side. The corrugation remains as a soft normal ripple. The hose is wet under the sea and damp above the waterline.</p>\n<ul>\n<li>A lathed brass hose-tail ferrule and hex union nut sit 0.22 m down from node 0, under the davit sheave. The fitting is a child of chunk 0, so ending.js&#x27;s shape-match hide takes it too. Its matrix is written in place: zero allocation.</li>\n<li>Unchanged: vertex count, CylinderGeometry type, 63-instance chunks, verlet, anchors, leash clamp, tautness.</li>\n</ul>\n<p><b>Log and barrel (generated).</b> The MANIFEST rows, counts, gap, slope, stand, tint and placement code are the same, and so are the stream draws: prop XZ signature 08efee94 equals main. Shapes are authored to loadProp&#x27;s old normalisation contract. One program serves both (&#x27;prop|gen|0&#x27;), and per-zone materials are cached forever, so a reseed compiles nothing.</p>\n<ul>\n<li>Log: a bent, tapering, knobbled trunk. <code>barkSet</code> gives furrowed plates over sloughed bare wood, with an algal film. One end is an old weathered cut with procedural end-grain rings and checks. The other is snapped: splinter teeth round a torn crater. There is a branch stub and three swaying weed tufts.</li>\n<li>Barrel: 16 bulged staves (<code>staveSet</code>), a recessed head in a chime, and three rusted hoops. On the burst side two staves are stove in and snapped low, the top hoop is broken and sprung, and the inside is dark and silted.</li>\n<li><b>Found bug:</b> <code>sink</code> 0.45 buried every shipped log about 1 u under the silt, because the log is only 0.24 of its height thick (measured: top of log 0 at −1.0 u). It is now 0, so the logs lie half-buried.</li>\n</ul>\n<p><b>assets/props cleanup.</b> Deleted, since no code path references them: <code>log.glb</code>, <code>barrel.glb</code>, <code>rock_largeC.glb</code>, <code>rock_smallC.glb</code>, <code>rock_tallE.glb</code>, <code>stump_old.glb</code> and <code>Textures/colormap.png</code>. CREDITS.md now records that every prop is generated. Left for the orchestrator (not this branch&#x27;s files): <code>src/lib/assets.js</code> (loadProp) now has no caller; README.md line 67 still credits Kenney prop models.</p>\n<h3>Log</h3>\n<p>2026-09-26: Built and verified on branch polish-props. Commits: dad03ce (resources), d7aa713 (nest + textures block), 3a5ede6 (tether), e65c76c (log/barrel), 702eb7b (budget pass + assets cleanup). Paired against d35ceec (the branch point, served side by side), same probes:</p>\n<ul>\n<li>Triangles: +58.7k, counting all three zones&#x27; instance buffers.</li>\n</ul>\n<p>  - Props: 24.3k → 64.4k. Log 200 → 460 per instance, barrel 148 → 448.</p>\n<p>  - Resources: 29.8k → 36.7k.</p>\n<p>  - Nest (stones, eggs, shards, berm): 5.5k → 16.6k.</p>\n<p>  - Ferrule: +580.</p>\n<ul>\n<li>Draw calls at fixed poses: nest view 357 → 358, bitumen view 331 → 327, barrel view 349 → 343. Structurally: +1 (ferrule), and 3 fewer per resource node in view (5 draws per node became 2).</li>\n<li>Programs after a full visit: 486 → 474 (−12). New sources: res|POLY, res|TAR, brood|egg, brood|stone, abyssa-tether2 (replaces abyssa-tether), prop|gen|0 (replaces five prop|z|… keys).</li>\n<li>Textures: 172/173 → 175/176 (+3: egg, bark and stave pairs in, the Kenney colormap and prop roughness out). Geometries: 556–590 → 378–391, per-node spheres gone.</li>\n<li>Bakes:</li>\n</ul>\n<p>  - At boot: barkSet 25 ms, staveSet 12 ms, eggSkinSet 13 ms, prop shapes 1 ms.</p>\n<p>  - reseedResources: +43 ms per build (45 vs 2 ms).</p>\n<p>  - makeBrood: about +10 ms per zone-0 entry.</p>\n<p>  - Total under 110 ms.</p>\n<ul>\n<li>Reseed soak, boot plus 6× <code>__chart.arrive</code> (1,2,0,1,2,0), every zone visited each time: programs 462 → 474 flat from the first cycle; geometries 391/386/380/378 per site, flat; textures 175/176 flat.</li>\n<li>Signatures (this session&#x27;s FNV probe, identical to d35ceec): rock colliders 597:008c8aef, vents 17:08f511dc:9dc7dd72, resources 60:f648e791, prop XZ 08efee94. The polish-vents card&#x27;s 597:88033c49 came from a different hash method; the collider data is unchanged.</li>\n<li>Fingerprints: <code>__lev.fp</code> = 15ce888c / c938fe6e / 652d0412.</li>\n<li>Rite: taking an egg with <code>lev.brood.interact</code> wakes her (dormant true → false); setting it back gives &quot;THE CLUTCH IS WHOLE.&quot;</li>\n<li>Pickups: walking onto a polymer node gives polymer 1 → 2, a bitumen node gives 0 → 1.</li>\n<li>Console clean on a fresh tab. terrain.js, diver.js and game.js are untouched.</li>\n</ul>\n<p>Captures are in the session scratchpad, pp/caps/:</p>\n<ul>\n<li>Resources: final_polymer_1p5u.jpg, final_polymer_game9u.jpg, final_bitumen_1p5u.jpg, final_bitumen_game9u.jpg.</li>\n<li>Nest: final_nest_3u.jpg, final_nest_egg_1u.jpg, final_nest_game9u.jpg, final_shards_2u.jpg.</li>\n<li>Tether: final_tether_inlet_1u.jpg, final_tether_run_9u.jpg, final_tether_game9u.jpg, final_tether_raftend_1u.jpg.</li>\n<li>Props: final_log_2u.jpg, final_barrel_2u.jpg (burst side), plus 35_barrel_game9u.jpg and 34_barrel_back_2u.jpg.</li>\n<li>Before shots: 00_base_polymer_1p5u.jpg, 00_base_bitumen_1p5u.jpg, 00_base_nest_3u.jpg, 00_base_log_2u.jpg (the log is invisible, buried), 00_base_barrel_2u.jpg, 00_base_tether_inlet_1u.jpg, 00_base_tether_game9u.jpg.</li>\n</ul>\n<p>Open items and taste calls:</p>\n<ul>\n<li>The log&#x27;s bark reads as longitudinal furrows at 2 u and still leans a little toward &quot;contour lines&quot;. The weed tufts are thin and sparse.</li>\n<li>Under Sal&#x27;s lantern the barrel&#x27;s oak reads grey-teal (the zone&#x27;s &#x27;wreck&#x27; tint carries into the staves). The burst is clean-edged rather than splintered.</li>\n<li>The bitumen crack net is a fairly even cell pattern from straight above.</li>\n<li>The tether braid&#x27;s roll is view-locked: correct on screen, but it will not &quot;rotate&quot; if the camera orbits a stationary hose (invisible at hose scale in every capture).</li>\n<li>The raft-end ferrule is small next to the davit sheave and mostly seen in silhouette against the sky.</li>\n</ul>\n<p>Awaiting Michael&#x27;s eye.</p>"}, {"slug": "polish-world", "t": "World polish — wrecks, rocks, gardens", "d": "Michael after the quality audit: \"lots of things just look like primitives no polish. AAA is the bar and we are far from it.\" Zone-0 seabed audit: the skiff a flat dark slab under a floating net lattice, a boulder an untextured dark hexagon, kelp single-colour flat cards, anemones/sponges flat-shaded.", "tags": ["quality", "wrecks", "flora", "gardens", "textures"], "updated": "2026-09-25", "body": "<p>Michael after the quality audit: &quot;lots of things just look like primitives no polish. AAA is the bar and we are far from it.&quot; Zone-0 seabed audit: the skiff a flat dark slab under a floating net lattice, a boulder an untextured dark hexagon, kelp single-colour flat cards, anemones/sponges flat-shaded.</p>\n<h3>Detail</h3>\n<p>Branch <code>polish-world</code> (not merged). Files: src/world/wrecks.js, src/world/flora.js, src/world/gardens.js, and an appended, marked block at the end of src/lib/textures.js.</p>\n<p><b>Wrecks.</b> New generated iron plate set, <code>ironPlateSet()</code>: 512² riveted plating with lap seams, staggered butts, rivet rows, dents, rust bloom, and a rust SOURCE alpha. Rust streaks run down the hull along real world gravity: a derivative cotangent frame finds &quot;down&quot; in the map&#x27;s uv after the wreck&#x27;s roll and settle tilt, then textureGrad gathers the source mask up-slope in six taps. A growth mask covers up-facing surfaces, plus a per-vertex old-waterline band (aGrow). Barnacle shells are scattered by the same terms, merged into one draw per wreck from their own stream. Skiff: a stove-in plank run on the up-facing bilge (a staircase of broken plank ends with splinter fans), clinker nails down every lap, per-plank tone and lap cavity. Net: diamond mesh with knots, lead sinkers, and a tear with frayed bars. Trawler: torn plates peel as curled petals. Portholes: grimy panes (on the lit one the grime dims the emission), glass domes, and a lit spill cone plus halo. Submersible: Yoshimura crush creases. A drift skirt around every hull is banked on the lee and drawn with the TERRAIN&#x27;s own material, using the terrain mesh&#x27;s exact height and colour (it IS seabed: same program, caustics and ripples). Wreck program keys are now per kind, not per zone. Colliders, relic, keepsake and mark positions are identical to main.</p>\n<p><b>Rocks.</b> The audited &quot;dark hexagon&quot; is not a flora rock. It is props.js <code>rock_smallC.glb</code>, a downloaded Kenney CC0 prop: 16 tris, flatShading, no maps, 110 per zone. Fixing it needs props.js (not this branch). The recommendation is to drop that manifest row, since flora&#x27;s pebble tier covers the role. This row sits inside Michael&#x27;s open &quot;props glTF&quot; decision. Flora rocks gained a fresh-break albedo on cleavage faces (vertex colour, no stream draws), matte coralline/lichen crust on up-faces (geometric slope × bake height), fissure moss in zone 0 only, and sand fillets for hero rocks and boulders with S ≥ 4 (one merged terrain-material mesh per zone).</p>\n<p><b>Gardens.</b> A thin-blade material serves kelp, flora/gardens seagrass, fans and sea-pen pinnae, with one program per plant type. It uses the generated <code>bladeMapSet()</code> (midrib + herringbone veins + bullate lamina) as a derivative-frame normal, with a paler/yellower rib and tip, a per-blade hue on the blade&#x27;s phase, and a ruffled/tattered margin (discard). A vertex edge ripple runs on a per-blade phase. The back-light transmission term is injected after the light loop and rides the key light (no new light). Kelp gets curled, twisted tips and a two-hapteron holdfast. Anemones get a tube-tentacle crown and an oral lip/mouth. Sponges get cellular pores and pale osculum rims. Sea pens get pinnule combs. The flora placement stream is untouched: rock colliders are bit-identical.</p>\n<h3>Log</h3>\n<p>2026-09-25: Built and verified on branch polish-world (5b53978 wrecks; second commit rocks+gardens). Numbers vs main f7a1c9c, same probe sequence:</p>\n<ul>\n<li>Wreck geometry: skiff 15.4k→51.8k tris (+36.4k), trawler 12.0k→47.8k (+35.8k), sub 10.2k→23.4k (+13.2k).</li>\n<li>Plants: +106k scene-wide, counting every zone&#x27;s instance buffers (kelp +48.3k, flora anemone +44.5k, gardens anemone +13.2k). Rock fillets: 24.2k.</li>\n<li>Draw calls in view: +5 skiff, +5 trawler, +5..8 sub. Structural additions: shells + skirt per wreck, spill + halo on the lit portholes, 1 fillet mesh per zone.</li>\n<li>Programs: at or below main (wreck keys per kind saved 8+).</li>\n<li>Boot bake: ~+90 ms (iron plate set 67 ms, blade set 4 ms, wreck geometry +22 ms). Flora/gardens reseed unchanged (41 ms / 3 ms).</li>\n<li>Reseed soak: 6× __chart.arrive(1,2,0,1,2,0) with every zone visited each time. Programs 245 flat, textures 116 flat, geometries 176/180 by site.</li>\n<li>Fingerprints: __lev.fp = 15ce888c / c938fe6e / 652d0412; wreck/relic/keepsake/mark/rock-collider contracts identical. terrain.js untouched (paired terrain probe equal to main). Console clean on a fresh tab.</li>\n</ul>\n<p>Captures in the session scratchpad, wa/caps/: final_skiff_8u_a.jpg, final_skiff_hole.jpg, final_skiff_net.jpg, final_trawler_lantern.jpg, final_trawler_porthole.jpg, final_hero_rock_3u.jpg, final_kelp_backlit_6u.jpg, final_anemone_flora_2u.jpg, final_anemone_gardens_2u.jpg. Before shots: 00_skiff_before.jpg, 03_proprock_before.jpg.</p>\n<p>Open items and taste calls:</p>\n<ul>\n<li>The skiff still reads low-contrast in the teal murk at 8 u.</li>\n<li>Plate rust can read as camo at range.</li>\n<li>Flora staghorn and brain coral are still primitive: not in this brief, and the next obvious pass.</li>\n</ul>\n<p>Awaiting Michael&#x27;s eye.</p>"}, {"slug": "polish-vents", "t": "Vents + corals polish — chimneys, staghorn, brain, table coral, prop rocks", "d": "Michael after the quality audit: \"lots of things just look like primitives no polish. AAA is the bar and we are far from it.\" The world pass left three primitives: flora staghorn and brain coral (4-sided sticks, a lumpy sphere), the zone-1 black smokers (lathed lumps with a flat crust), and the downloaded 16-tri Kenney rock in props.js (the audit's \"dark hexagon\", and a generated-only rule violation).", "tags": ["quality", "vents", "flora", "props", "textures"], "updated": "2026-09-25", "body": "<p>Michael after the quality audit: &quot;lots of things just look like primitives no polish. AAA is the bar and we are far from it.&quot; The world pass left three primitives: flora staghorn and brain coral (4-sided sticks, a lumpy sphere), the zone-1 black smokers (lathed lumps with a flat crust), and the downloaded 16-tri Kenney rock in props.js (the audit&#x27;s &quot;dark hexagon&quot;, and a generated-only rule violation).</p>\n<h3>Detail</h3>\n<p>Branch <code>polish-vents</code> (not merged). Files: src/world/props.js, src/world/flora.js (coral builders + their shader blocks only), src/world/vents.js, and a marked block appended to the end of src/lib/textures.js (<code>coralMazeSet</code>, <code>sulphideSet</code>).</p>\n<p><b>Props.</b> The <code>rock_smallC.glb</code> MANIFEST row is cut. Flora&#x27;s pebble and boulder tiers fill the role. <code>propColliders</code> was empty and stays empty. The shorter props stream re-rolls log and barrel placement, which is still a pure function of <code>siteParams(&#x27;props&#x27;)</code>. Downloaded models still in props.js: <code>log.glb</code> and <code>barrel.glb</code> (Kenney CC0). Those two are Michael&#x27;s open props-glTF decision. <code>rock_largeC.glb</code>, <code>rock_tallE.glb</code>, <code>rock_smallC.glb</code> and <code>stump_old.glb</code> are still on disk and in CREDITS.md, but nothing references them now.</p>\n<p><b>Corals.</b></p>\n<ul>\n<li>Staghorn: grown as recursive, knobbled, tapered tubes on an encrusting base plate: four antler primaries, forking secondaries and some tertiaries, with rounded bleached tips (per-vertex tip mask in aBU.x). Corallite cups are a fragment normal feature (an F2-F1 cell field) and fade out before they can alias.</li>\n<li>Brain coral: a generated Turing labyrinth (activator/inhibitor iteration on a torus, 256^2) wrapped over the dome with an azimuthal-equidistant map about its pole, so there is no seam and no UVs are needed. Normal and albedo, a dark valley-floor line and a pale crest furrow.</li>\n<li>New table coral: a stalk, a lobed dish and a pale growing rim, with radial branch rows and growth bands. It shares the staghorn material and program.</li>\n<li>Hues are muted per instance: ochre, rose, bone, olive, mauve and sand, leaning 20% toward the zone mood.</li>\n<li>Stream contract: the new builders burn exactly the draws the old ones spent (36 and 1), and every placement slot makes its old draws. <code>rockColliders</code> stays bit-identical (597:88033c49). Staghorn now uses every 4th reef slot and table coral every 8th: fewer colonies, far better ones.</li>\n</ul>\n<p><b>Vent chimneys.</b></p>\n<ul>\n<li>Each stem is ONE continuous knobbled tube along the shipped spine. The site-stream draws and the spine arithmetic are replayed exactly, so throats, colliders, marine-snow columns, plumes, shimmer and ventlife anchors are identical to main (signature e72f7950, plume hash equal).</li>\n<li>Structure: shelf flanges with drooping undersides (dense rings round each), lobed nodular walls, and a flared foot. The throat is fluted and its lip turns in and drops into a bore. Active bores carry a dim ember emissive (vertex heat, not a light). Dead stacks have jagged snapped tops.</li>\n<li>Around each stack: secondary beehive spires, a talus apron draped on the seabed, and fallen rubble (snapped sections plus lumpy crust blocks, strewn mostly down one fall side). Fumaroles are now little beehives and crust patches are draped plates.</li>\n<li>All new detail comes from a local per-chimney mulberry32.</li>\n<li>Zoning (baked vertex colour + aVent): a sooty grey-black body with iron-oxide drip streaks and rust patches only where the wall has cooled, faint growth rings and anhydrite flecks, blackening with heat toward the throat. Bacterial mats sit on lee faces and flange undersides. Dead stacks rust through.</li>\n<li>Material: generated sulphide crust set (crystal grain, pores, cooling cracks), triplanar at two scales. Mats swallow the relief. Brassy near-mirror glitter facets near the throat are sparse, from map A, and fade with range.</li>\n<li>Still ONE merged draw. No light added: the shared PointLight and the fog:false ember rules are untouched.</li>\n</ul>\n<p><b>Water-line props:</b> props.js has nothing that floats (only seabed logs and barrels), and no buoy or floats exist anywhere in src. The raft&#x27;s mooring chain (hull.js) is already weathered by the raft pass. Nothing to do here.</p>\n<h3>Log</h3>\n<p>2026-09-25: Built and verified on branch polish-vents. Commits: abbcdcc (props), ffa2884 (corals), 125290d (vents). Numbers against main 026203f, same probe sequence in fresh tabs:</p>\n<ul>\n<li>Coral tris: 190.1k → 254.2k (+64.1k), counting all three zones&#x27; instance buffers. Per colony: staghorn 160 → 798 (55 per zone, was 220), brain 256 → 270 (110 per zone), table 398 (28 per zone, new).</li>\n<li>Vent field: 9,444 → 40,858 tris (+31.4k).</li>\n<li>Draw calls: zone-0 reef view 134 → 134 (table +1 per zone, prop rock −1). Zone-1 vent view 80 → 77.</li>\n<li>Programs: +1 program source (<code>vents|chimney</code>; the chimney no longer shares the stock standard program), compiled in about 3 light-state variants like every lit material. The table coral shares <code>flora|stag</code>, so +0. Totals are 283 vs 285 after one full visit.</li>\n<li>Textures: +2 (maze pack/nrm and sulphide pack/nrm added; surfacePair&#x27;s pair is no longer bound by vents).</li>\n<li>Bakes: coralMazeSet 42 ms and sulphideSet 12 ms at boot. Vent build 21 ms vs 3 ms, flora reseed about 37 ms vs 53 ms (fewer staghorn instances). Total added under 80 ms.</li>\n<li>Reseed soak: boot plus 6× <code>__chart.arrive</code> (1,2,0,1,2,0), visiting every zone each time. Textures flat at 160 after the first cycle. Programs stay flat once warm (435 → 433 → 428 → 429; main does the same, 392 → 405 → 403 → 403). Geometry is per-site stable within the same ±10 main shows. Site 0 returns to identical rock-collider and vent signatures.</li>\n<li>Fingerprints: <code>__lev.fp</code> = 15ce888c / c938fe6e / 652d0412. terrain.js is untouched. Console clean on a fresh tab.</li>\n</ul>\n<p>Captures are in the session scratchpad, pv/caps/:</p>\n<ul>\n<li>Corals: final_stag_2u.jpg, final_stag_5u.jpg, final_brain_2u.jpg, final_table_4u.jpg.</li>\n<li>Vents: final_chimney_6u_lantern.jpg (throat, ember, shrimp swarm), final_chimney_6u_flank.jpg (Sal&#x27;s lantern on the flank), final_rubble_apron_3u.jpg.</li>\n<li>Seabed: final_z0_seabed_rocks_gone.jpg.</li>\n<li>Before shots: 00_base_z0_proprock.jpg, 00_base_stag.jpg, 00_base_brain.jpg, 00_base_chimney_6u.jpg.</li>\n<li>Form under an evaluation-only white light, never shipped: evallight_chimney_full.jpg, evallight_throat_close.jpg, evallight_dead_chimney.jpg. These predate the final albedo and mat retune.</li>\n</ul>\n<p>Open items and taste calls:</p>\n<ul>\n<li>Zone 1 is lightless by design, so in play the chimneys read mostly as silhouettes with the ember throat. Their crust only shows within the lantern&#x27;s few metres. The sulphide albedos were raised to about 0.02–0.1 linear so the lantern finds them at all.</li>\n<li>The dark plume is invisible against the dark water in every capture. Plumes were out of scope.</li>\n<li>Rubble crust blocks are still slightly faceted at 3 u (icosahedron detail 1).</li>\n<li>Staghorn corallites read as a rasp at 2 u but can look scaly on the brightest lit faces.</li>\n<li>The table coral&#x27;s upper face is subtle beyond about 6 u.</li>\n</ul>\n<p>Awaiting Michael&#x27;s eye.</p>"}, {"slug": "polish-sleepers2", "t": "Polish Orune and Mhor (AAA materials and geometry)", "d": "Michael, after the quality audit: \"lots of things just look like primitives no polish. AAA is the bar and we are far from it.\" The audit found ORUNE a silhouette at 22 u (smooth sac, flat mottle, flat-disc suckers, clean tube arms, plain eyes, 5-primitive lanterns) and MHOR a faint orange blob at 74 u and a smooth hex-sectioned torpedo at 26 u (tube arms, sphere clubs, plain fins and eyes). The bar is Subnautica's leviathans and real cephalopod photography. Only geometry, materials and per-frame vertex placement changed. Behaviour, rites, timings, ward placement, collision (L.spine / L.collR), the dormant/wake contract and arm counts are untouched. Branch polish-sleepers2, not merged.", "tags": ["quality"], "updated": "2026-09-25", "body": "<p>Michael, after the quality audit: &quot;lots of things just look like primitives no polish. AAA is the bar and we are far from it.&quot; The audit found ORUNE a silhouette at 22 u (smooth sac, flat mottle, flat-disc suckers, clean tube arms, plain eyes, 5-primitive lanterns) and MHOR a faint orange blob at 74 u and a smooth hex-sectioned torpedo at 26 u (tube arms, sphere clubs, plain fins and eyes). The bar is Subnautica&#x27;s leviathans and real cephalopod photography. Only geometry, materials and per-frame vertex placement changed. Behaviour, rites, timings, ward placement, collision (L.spine / L.collR), the dormant/wake contract and arm counts are untouched. Branch polish-sleepers2, not merged.</p>\n<h3>Detail</h3>\n<p>Files: src/entities/sleeper/hoarder.js, hoarderGeo.js, hoard.js, hunter.js. common.js, brooder*, game.js and lib/textures.js are unchanged.</p>\n<ul>\n<li>BAKE KIT (hoarderGeo.js, exported for hunter.js): tileable fbm tables, a jittered-grid voronoi that tiles, and own-cell point features. Heights stay float until the normal is taken, and textures are mipmapped DataTextures (the Brooder idiom).</li>\n<li>ORUNE SKIN (1024², ~6 mm/texel): a 96x96 chromatophore field of small pigment sacs in brown-black, rust and ochre, expanded by the mottle and a coarse reticulate net. It adds polygonal relief grooves, papillae with paler tips, wrinkles in the dark patches, lensed photophores (a clear dome, a dark rim, a bright core and a halo in the emissive map) and iridophore flecks packed into roughness R. wetSkin() is one program that adds a lit Fresnel sheen and a teal-to-violet iridophore term, which shows only at grazing angles and scales with the light received. The skin is BIPLANAR by attribute: the mantle carries a second spherical UV about X plus a weight that hands the two Y-pole caps to it, which kills the sphere pinch. Arms and lids set that weight to 0, so the whole body stays one program.</li>\n<li>ORUNE MANTLE: 128x96. 260 seeded warts are real bumps displaced along the normal. Slack creases (sharp valleys, soft ridges) turn round the sac, which sags along its spine. Wrinkles ring the eye turrets. A lipped SIPHON with a dark mouth sits under the left eye, merged into the mantle geometry.</li>\n<li>ORUNE ARMS: the 41-point logic spine (pts/U/B, read by lash, grab, the knife, wards and the flinch) is unchanged. The RENDER tube is 129 rings x 28 sides, Catmull-Rom&#x27;d off that spine, with frames lerped from the rolled logic frames. The cross-section has a softly flattened oral face with a central furrow, a dorsal ridge, and longitudinal folds. Transverse wrinkles bunch only on the inside of each bend, with depth = curvature x radius. Normals come from the grid. Zero allocation, 0.58 ms per updateHoarder (200-call bench).</li>\n<li>ORUNE SUCKERS: stalked cups (stalk, outer wall, a pale rolled rim, a pink infundibulum, a dark acetabulum), 36 per arm in two staggered rows, spaced by the local radius so they crowd and shrink toward the tip. They are seated on the render tube&#x27;s face, and any sucker whose seat is inside the mantle is hidden.</li>\n<li>ORUNE EYES: the ball has a cornea dome and a planar-mapped gold iris (radial fibrils, a collarette, a limbal ring, the octopus bar pupil) with a wetEye Fresnel rim. The lathed lids have folds parallel to the edge and a fleshy rolled lip, and the lathe seam is at the back.</li>\n<li>THE HOARD: each lantern is built from a stepped foot, four chamfered posts, guard hoops, a hinged door frame (knuckles and a latch), a burner and wick, a vented cap with a chimney and a bail, and a bellied glass chimney. Brass carries patina (verdigris low, tarnish) in vertex colour. On the glass, grime dims its own glow (grimeGlow) and the flame is its core. The 17 lanterns are 2 instanced draws where they were 34 meshes. The crate is planked on every face with gaps, battens, iron angle corners and nail heads over a generated wood map, all in 1 draw. The ship&#x27;s lamp is the hero piece: a riveted drum, a stacked-prism Fresnel lens band, stays, a crown and cowl, vents, a bail, a gimbal yoke and a porthole door. It is a 1-instance InstancedMesh so it shares the lanterns&#x27; programs. lampPos is numerically unchanged.</li>\n<li>MHOR BODY: a 160x72 lathe (round at any range) with eye-orbit rims. The hide is baked at 1024² on an anisotropic grid so cells come out square on the body. It has chromatophore sacs, relief grooves, a LATERAL LINE with its pores, and LENSED photophores in two staggered rows down each flank plus a ventral scatter (core, halo, dome, dark rim). wetSkin has no iridophores here.</li>\n<li>MHOR GLOW: 24 fog-off additive POINTS in the body frame (two rows per flank plus the belly), with an over-unity colour, driven from the existing pulse. They follow their own distance curve that swells with range and is gone past 200 u. This is 1 draw and 2 float writes per frame, with no lights.</li>\n<li>MHOR FINS: a membrane grid over the old outline. A vein map has radiating ribs that sweep back and taper, finer branches past mid-fin, a darker muscular root and a paler edge. The membrane() shader scatters received light through the thin outer fin and passes the photophore pulse through the edge. DoubleSide with forceSinglePass. The existing edge ripple is kept.</li>\n<li>MHOR ARMS AND CLUBS: tubes are 57 rings x 20 sides, and each frame is aimed so the oral face looks in at the crown&#x27;s axis. That face is flattened and pale. 28 suckers per arm sit in two rows (instanced, 1 draw). The clubs are spindles with a ring of ten curved horn HOOKS and a palm of 14 suckers.</li>\n<li>MHOR EYES: huge wet domes with a black pupil, a thin gold ring and a silvered iris. They face sideways, and the eyeshine emissive is masked to the pupil and ring. The existing driver is kept.</li>\n<li>THE FURNACE: a 44x43 lathe with nodular lumps and three flanges. It uses vents.js&#x27;s palette in vertex colour (olive low, sulfide dark, rust streaks, pale crust near the throat) and has a recessed bore. A crust normal map is shared with the cold stumps. The fire is an emissive MASK (the throat, plus cracks webbed through the top third) where it used to light the whole chimney. A heat-shimmer sprite above the throat scrolls rising streaks.</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-25: Built and verified on branch polish-sleepers2 (commits 10a3cfc, a1d5cb9, 16e1337). Numbers are from a fresh tab, 1600x900 viewport (2400x1350 buffer), hidden pane, driven frames. Base is the branch point 72c5caa, served from its own worktree and measured the same way.</p>\n<p><b>Triangles.</b> Orune (with the hoard) went 59,228 → 228,188 (budget 240k). Mhor (with the furnace, stunned, all visible) went 17,266 → 144,446 (budget 200k).</p>\n<p><b>Draw objects.</b> Orune went from 69 meshes to 37, because the lanterns went from 34 meshes to 2 instanced draws. Measured calls per 2 frames with her in view: 1068 base vs 743 now, so about −160 calls per frame counting every pass. Mhor went from 43 meshes + 4 sprites to 44 meshes + 1 points + 5 sprites (+3).</p>\n<p><b>Programs.</b> Scene totals in zone 1 went 317 → 321. Programs exclusive to the sleeper: Orune 11 → 15, Mhor 7 → 11. Most variants are doubled across the shadow-on/off switch, which is not ours.</p>\n<p><b>Lights.</b> None added.</p>\n<p><b>Bakes.</b> Orune skin 203 ms, eye 37 ms and wood 7 ms replace the old canvas skin (247 ms) and eye (5 ms). Mhor&#x27;s hide, fin and eye together take 196 ms, replacing the old hide (271 ms). Net added bake time is about −70 ms, i.e. faster than before.</p>\n<p><b>GPU median</b> (__gpu.median, with the sleeper in view vs hidden, noisy on this shared machine): Orune 8.26 vs 7.42 ms (base 9.60 vs 9.55); Mhor 13.81 vs 13.90 ms (base 13.38 vs 12.82).</p>\n<p><b>Regression checks.</b></p>\n<ul>\n<li>Fingerprints [__lev.fp(0),(1),(2)] = 15ce888c, c938fe6e, 652d0412.</li>\n<li>Orune rite: the prompt reads &quot;[E] TAKE THE SHIP&#x27;S LAMP&quot;. lev.hoard.interact takes the lamp and she wakes (dormant false, rise 1 at 6 s, lamp parts hidden, hoard lights going out 17 → 5).</li>\n<li>Mhor rite: the real [E] feed with 2 bitumen lights the furnace. He arrives and reaches circle, lev.cmd(&#x27;stun&#x27;) gives stunned, and standing on a ward lights it (wards 0 and 4 lit).</li>\n<li>Memory is flat across 6 swaps each: hoarder 223 geometries / 131 textures / 309 programs; hunter 210 / 131 / 304.</li>\n<li>Console clean in a fresh tab.</li>\n</ul>\n<p><b>Captures</b> are in scratchpad/sleepers2/caps/. In-game: f1_asleep.png (Orune asleep at the wreck by lantern, 20 u), f1_awake.png (awake, 25 u), f1_arm.png / f1_armside.png (arm and suckers at 4 u), f1_eye_a.png (eye at 3 u), f1_lamp.png (ship&#x27;s lamp at 2.6 u), final2_circle60.png (Mhor circling at ~60 u, the photophore rows read), final2_stun.png (stunned, 20 u), final2_fin.png (fin at 6 u), final2_eye.png (eye at 4 u), f2_throat.png / f2_furnace.png. Studio look-dev set: s5w_*.png and m3_s*.png. Before: base1_*.png and base2_*.png.</p>\n<p><b>Not verified.</b></p>\n<ul>\n<li>The real-window frame rate, because the pane was hidden throughout.</li>\n<li>Per-frame heap allocation was checked by code inspection only (the new paths allocate nothing; the pre-existing ev object and the .filter in the ward loop were left alone as behaviour).</li>\n<li>The studio renders before 2026-09-25 late (s2 and s3) were drawn to a canvas with no depth buffer, so their lids and eye overlaps are artefacts; the studio now renders into a depth render target.</li>\n</ul>\n<p><b>Open.</b></p>\n<ul>\n<li>Orune&#x27;s raised arms arch up through her face, so from the front the eyes sit in a well of arm roots. That is the arm pose, which is behaviour.</li>\n<li>Mhor at 60 u is still a body-less row of lights in the murk, which is by design (brightness cannot buy distance).</li>\n<li>The in-game shots are dark by the zone&#x27;s design; the studio set is where the materials can be judged.</li>\n</ul>"}, {"slug": "polish-sal", "t": "Polish Sal — AAA dress, hardware, helmet", "d": "Michael's audit: \"lots of things just look like primitives no polish. AAA is the bar.\" Sal read as a smooth balloon.\nThis pass turns him into a photographed Mark V rig, with every asset still generated in code.", "tags": ["quality", "diver"], "updated": "2026-09-25", "body": "<p>Michael&#x27;s audit: &quot;lots of things just look like primitives no polish. AAA is the bar.&quot; Sal read as a smooth balloon.</p>\n<p>This pass turns him into a photographed Mark V rig, with every asset still generated in code.</p>\n<h3>Detail</h3>\n<p>Files: <code>src/entities/diver.js</code>. <code>src/lib/textures.js</code> gets a new block at the END (<code>twillSet</code>, <code>castSet</code>, <code>dropletSet</code>, <code>braidSet</code>).</p>\n<ul>\n<li><b>Dress shader</b> (<code>suitify</code>, one program): generated 2/1 twill sampled triplanar in bone space (the same thread pitch on every part); baked <code>salAux</code> per vertex = wear (knees, elbows, seat, shoulders), taped seams with stitch rows, reinforcing patches; <code>uSalWet</code> soaks him under water and he dries top-down on deck over about 75 s.</li>\n<li><b>Metal shader</b> (<code>metalize</code>, one program for copper, brass, steel and lead): triplanar maps; baked <code>salCav</code> crevice tarnish and verdigris; screen-space concave tarnish and convex edge polish; spun rings on the bonnet.</li>\n<li><b>Hardware</b>: brass corselet (skirt, 4 brails, 12 chamfered wing nuts), a cast-lead front weight on brass hooks with a webbing strap, a belt with frame buckle, prong, keeper and back lacing, and boots with brass toe caps, a lead sole cast to the foot outline at SOLE_Y, a welt with nails, and instep and ankle straps.</li>\n<li><b>Helmet</b>: transparent Fresnel port glass with beads while in air, a dark recess in the same draw, seated bezels with hex bolts, an exhaust valve with a knurled cap and spitcock, a gooseneck air inlet with couplings, and 12 neck-ring bolts.</li>\n<li><b>Hose and lantern</b>: braided feed hose that gets wet, with brass ferrules. The lantern has posts and guard wires, a vented crown, fount and wick, and a blown globe (flame, core and halo unchanged).</li>\n<li>Acceptance: macro captures at 1 u, the 9 u game view on deck and in zones 0 and 2, gait/breath/knife bit-identical, Sal ≤ 70k tris, draw calls not above baseline, zero per-frame allocation.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-09-25 — started on branch <code>polish-sal</code>. Baseline: 87 meshes, 47,954 tris, 9 diver programs.</li>\n<li>2026-09-25 — step 1 dress shader (f8b90d1), step 2 hardware (df85f1b), step 3 helmet (a5f2615), step 4 hose and lantern (494a459). Result: <b>78 meshes (−9 draw calls), 65,156 tris, 12 diver programs (+3: suit, metal, hose; the glass program is replaced)</b>, 241 programs total (base 234). Generated textures: twill 9.8 ms, cast 8.7, droplets 1.8, braid 4.9 (25 ms). Diver module evaluation measures faster than base (~100 ms vs ~680 ms), because the metals no longer build 512² canvas sets for steel/port. Only uniform writes per frame (uSalWet, uSalRootY, uSalDrop).</li>\n<li>2026-09-25 — motion unchanged: a deterministic 2400-frame harness (idle, walk, slash at frame 1000, swim, ladder) hashes 14 joints and gives identical segment hashes on base and branch (idle f1832004, walk 652a3446, slash 25560f80, swim 7c3d4012, ladder 509d6ce5; 35 steps, 10 breaths, breathPhase 3.708314). Sleeper fingerprints unchanged (15ce888c / c938fe6e / 652d0412). Console clean.</li>\n<li>2026-09-25 — captures in <code>/private/tmp/claude-501/-Users-michaelpaulus-sc/1337e504-cb3f-480c-af71-61059fe1df61/scratchpad/caps</code>: baseline b0_*, then s1*/s2*/s3*/s4*, finals f_game9u_deck_noon, f_helmet1u, f_chest1u, f_game9u_z0, f_z0_3u, f_z0_boots1u, f_game9u_z2, f_z2_3u.</li>\n<li>Open for Michael&#x27;s eye: the blue underlayer still shows as flat panels between corselet and belt; the arm gathers and white trim bands still read as primitives at 3 u; the tether (tether.js, not mine) is still the old corrugated look beside the braided feed hose; no back weight (the backpack takes that space); no dangling strap spring.</li>\n<li>2026-09-25 — follow-ups on branch <code>polish-followups</code> (a11ad17). The blue underlayer is now HEAVY DUCK: <code>canvasSet</code> (2/2 basket of doubled slub yarns, felted), appended as a marked block at the END of textures.js. It goes through the same dress program as a uniform. The torso blouses over the belt in real horizontal creases, and the crests are rubbed pale. The trim is a lathed WOVEN TAPE with thickness and rolled selvedges. A new tape mode in the dress shader draws herringbone ribs with a stitch row down each side, and it replaces the arm bands, the wrist lace torus and the ankle band. Wrists and ankles get PLEATED CANVAS CUFFS: real knife-pleat geometry gathered by a tarred drawstring with a knot and two whipped tails, with the tape binding the edge and the brass eyelets now rings. The sleeve and leg gathers are irregular folds instead of uniform tori. Numbers: 71,900 tris (was 65,156), 78 meshes (unchanged), programs 245 on deck on both main and branch. Gait bit-identical (fresh tab, title state, det harness): idle f1832004, walk 652a3446, slash 25560f80, swim 7c3d4012, ladder 509d6ce5; 35 steps, 10 breaths, breathPhase 3.708314. Sleeper fp 15ce888c/c938fe6e/652d0412. Console clean. Captures in scratchpad/followups/caps: main_sal_* (before), f_sal_3u_deck, f_sal_waist1u, f_sal_ankle1u, f_sal_wrist1u, f_sal_armtape1u. Still open: the blousing creases are subtle under the front weight at 3 u; the wrist cuff sits partly under the sleeve&#x27;s bunching. Not checked under water or in zone 2.</li>\n</ul>"}, {"slug": "polish-raft", "t": "Raft to AAA — generated surfaces, wear, silhouettes", "d": "Every raft surface is now a generated PBR set laid on in metres, with baked wear (rust, tarnish, wet, foot polish, contact grime) and eased/flanged/welded silhouettes. Branch polish-raft, not merged.", "tags": ["quality"], "updated": "2026-09-25", "body": "<p>Every raft surface is now a generated PBR set laid on in metres, with baked wear (rust, tarnish, wet, foot polish, contact grime) and eased/flanged/welded silhouettes. Branch polish-raft, not merged.</p>\n<h3>Detail</h3>\n<p>Audit verdict: &quot;lots of things just look like primitives no polish&quot;, raft the worst offender. Seven seeded, exactly tileable generated sets (lib/textures.js RAFT SURFACE SETS, appended block): plain-sawn deck timber (cathedral rings, eroded earlywood / proud latewood relief, knots, checks), cast iron (pitting, rust blooms), brass (tarnish, polish hairlines, fingerprints), clear-coated engine enamel (primer rings, chips), laid rope (3 strands per lay), duck canvas (plain weave), oiled leather (creases). kit.js rewrites every baked piece&#x27;s UVs to metres along its own grain with a per-piece offset (no two boards repeat); vertex colour is RGBA and A is a SURFACE STATE (wet/polished &lt;-&gt; rust/dry) that one shared onBeforeCompile patch turns into roughness + metalness, plus rain wetness (upward faces first). A deck map (256^2, CPU-rasterised top-down height field of the finished raft at build) carries contact grime, iron stain round every nail/bolt, dive-gap/scupper wet, and boot-polished trails between the stations. Silhouettes: bulwark laid up in strakes with an outboard splash band + salt line, chamfered castings with foot flanges and studs, girth welds, cast tapered spokes, staved barrels with crozed heads, a draped cloth tarp, horn cleats, a real davit block, beaded lantern. Grime baked up the foot of everything standing on the deck. Needs Michael&#x27;s eye: the enamel colour (engine green), brass tarnish density, and whether the deck wants more sun-bleach at noon.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-09-25 — wip on polish-raft (f6d9547..0f1f6fa, 6 commits). Raft 57.2k -&gt; 79.3k tris (budget 80k); raft direct meshes 11 -&gt; 11 (consolidate still merges); scene draw calls +1 (the enamel material: 156 -&gt; 157 at title, 157 -&gt; 158 in play); programs 234 -&gt; 241 at title, 238 -&gt; 245 in play (raft now 4 programs per light state, was 2: deck-map wood and clear-coat enamel are the new combos); GPU geometries 168 = 168, textures 109 -&gt; 125; raft build 74 -&gt; ~172 ms (__raftBoot), world build median ~560 -&gt; ~673 ms on a loaded shared machine (~+100-115 ms, budget 250). No lights added; sleeper fps 15ce888c/c938fe6e/652d0412 unchanged; lane walk identical to baseline on real KeyW input. Captures: scratchpad/caps/raft/final_noon_{fore,aft,macro,bolt,lane,wide,wideSun}.png, final_dusk_{fore,wide}.png, final_rain_{fore,lane}.png; baseline base_{fore,aft,macro,wide}.png.</li>\n</ul>"}, {"slug": "polish-fauna", "t": "Polish fauna — skins, eyes, fins, anatomy", "d": "Michael's verdict: \"lots of things just look like primitives no polish. AAA is the bar.\" The sea life below the jellies was flat-shaded: untextured wedge fish, smooth-loft ray and turtle, single-colour crabs/stars/urchins, a painted shark, a blob octopus, cone squid. This pass gives every animal a generated skin, real eyes, and anatomy where the silhouette was a primitive. Materials, geometry detail and shader surface terms only — no behaviour, FSM, steering, spawn counts, events or reseed contracts touched.", "tags": ["quality"], "updated": "2026-09-25", "body": "<p>Michael&#x27;s verdict: &quot;lots of things just look like primitives no polish. AAA is the bar.&quot; The sea life below the jellies was flat-shaded: untextured wedge fish, smooth-loft ray and turtle, single-colour crabs/stars/urchins, a painted shark, a blob octopus, cone squid. This pass gives every animal a generated skin, real eyes, and anatomy where the silhouette was a primitive. Materials, geometry detail and shader surface terms only — no behaviour, FSM, steering, spawn counts, events or reseed contracts touched.</p>\n<h3>Detail</h3>\n<p>Files: <code>src/world/fauna.js</code>, <code>creatures.js</code>, <code>predators.js</code>, <code>ventlife.js</code>. No textures are baked: every map is procedural in-shader.</p>\n<ul>\n<li><b>Skin kit</b> (fauna.js <code>SKIN_COMMON</code> / <code>SKIN_LIGHTS</code>, imported by the other three): hashes, value noise, Worley, roof-tile fish scales, relief by screen derivatives (perturbNormalArb maths fed a procedural height, so no tangents and no texture reads), fwidth anti-aliasing, a thin-sheet <b>transmission</b> term and a wet-dome <b>catchlight</b> that read the lights already in the scene (no lights added), and a hemisphere environment for silver flanks.</li>\n<li><b>School fish</b> (one program, <code>abyssa-fish-skin</code>): profiled bodies (2.3x rings, +4 sides, seam column), roof-tiled scales with countershading, saddles, operculum groove, lateral-line pores, iridescence (fresnel-weighted hue walk), a mirror flank term, wet eyes (iris ring, pupil, catchlight), fins with jointed rays, a scalloped free edge and backlit translucency. Zone-0 photophore rows cut to a faint stripe (sunlit reef fish carry none). New <code>aSurf</code> attribute; the undulation still keys off <code>uv</code>.</li>\n<li><b>Fauna</b> (still one program, <code>abyssa-fauna-skin</code>): per-vertex surface kind (<code>aKind</code>: skin, cornea, iris, fin, mouth, tooth, belly, leg, spine, shell) + a per-material skin id. Ray: dorsal spots, cream belly, mottled spec, dermal grain. Turtle: 13 scutes with seam grooves, growth rings, tortoiseshell streaks, marginals; scaled head and flippers. Moray: reticulation and mottle, slick; a wet blood-red mouth with ivory teeth. Crab: granular carapace, pale underside, jointed legs with arthrodial cuffs and dark dactyls, a fixed finger on the chela. Star: ossicle net, two tube-foot rows per arm. Urchin: tubercle bosses in socket rings, banded glossy spines. Vent fish/lanternfish scales, flapjack papillae, isopod pitted chitin, angler/gulper velvet with pores. Every eye is an iris bead + a wet cornea with catchlight.</li>\n<li><b>Shark</b>: 110 rings x 36 sides with the rings spent on the head and gill field; a Catmull-Rom profile; five gill slits cut as real grooves with standing flaps; an underslung crescent mouth groove with two serrated tooth rows (52 teeth); a domed wet eye; fins rebuilt as thick falcate solids. Skin: ragged countershade line, fbm mottle, denticle ridges + a Kajiya-Kay anisotropic sheen along the bent body axis, healed rake scars sunk and pale.</li>\n<li><b>Octopus</b>: mantle 28x28, arms 30x12 with a flattened oral face; papillae that rise with arousal, chromatophores that open as it flushes, two staggered sucker rows (pale raised rim, dark acetabulum) shrinking to the tip, brass-iris eyes with a horizontal slit pupil. At rest the arms lie out across the silt (vertex shader only).</li>\n<li><b>Squid</b>: mantle continues into a head with two big silvered eyes; rhomboid 6x4 fins lit through from behind; 7-sided arms and clubbed tentacles; pulsing chromatophores; photophores as discrete lamps in four ventral rows under the existing strobe; the existing pooled glow sprites (5 per squid, 20 across the shoal, fog-faded) moved to the ventral line and shrunk.</li>\n<li><b>Vent life</b>: shrimp (~60 tris) with rostrum, eyes, antennae, tail fan, a glassy carapace (segment overlaps, gut, chromatophores) and the vent fire transmitted through the body; vent crabs (~550 tris) carry the reef crab&#x27;s skin on the sulfide palette.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-09-25 — Built on branch <code>polish-fauna</code> (not merged). Commits e6d4477 (kit, fish, fauna), 21483f3 (shark), 86f1d52 (octopus), d18ba05 (squid + NaN-normal guards), 265fd86 (vent life), plus the fish-profile retune.</li>\n<li>2026-09-25 — Numbers, measured against main 72c5caa with the same three pinned views: <b>programs 357 -&gt; 357 (+0)</b>; every changed material keeps one program under its own key. <b>Textures 138 -&gt; 138 (+0)</b>; no bakes, so bake time added is 0 ms. <b>Draw calls +0 meshes</b>; measured deltas are +5 / 0 / -19 at reef / vent / shoal, which is school-culling noise. <b>Scene tris: reef +115k (2.600M -&gt; 2.715M), vent +135k (2.166M -&gt; 2.301M), shoal +55k (1.122M -&gt; 1.177M)</b>. All three are under +150k. Fauna total 143k -&gt; 235k across all zones. No per-frame JavaScript was added.</li>\n<li>2026-09-25 — Checks: sleeper fingerprints unchanged (15ce888c / c938fe6e / 652d0412). The shark still hunts: a forced windup ran windup -&gt; strike -&gt; flee with a bite. Venting ink mid-windup sent it windup -&gt; flee. Reseed soak (6 zone tours plus 6 voyages via <code>__chart.arrive</code>): textures stayed at 139, and programs/geometries settled at 524 / 462 and stayed there. Console clean in a fresh tab across all three zones. Caught along the way: a vertex that only sits in collapsed triangles got a zero normal, which is NaN on the GPU, and one NaN pixel blacked the whole frame through bloom/exposure. Every generator now fixes such normals.</li>\n<li>2026-09-25 — Captures are in <code>/private/tmp/claude-501/-Users-michaelpaulus-sc/1337e504-cb3f-480c-af71-61059fe1df61/scratchpad/fauna-caps</code>: final_school_5u_z0, final_school_1u6_z0, final_school3_5u_z0, final_ray_6u, final_crab_1u5, final_turtle_4u, s3_shark_8u_e / s3_shark_scar_e / s3_shark_head_c, s4_octo_4u_e / s4_octo_eye_e / s4_octo_roused_e, s5_squid_10u_c / s5_squid_3u_c, s6_shrimp_2u_a / s6_shrimp_1u_a / s6_ventcrab_0u6_a, plus the baseline b0_school_5u.</li>\n<li>Open for Michael&#x27;s eye: at 5 u the school fish show scales and fins, but the silver flank flash is subtle in zone-0 light. The shark mouth is only readable from below. The octopus eye is a wide lozenge, not a round dome. The squid eye is small at 10 u. Crab leg cuffs read on the chelae, and on the walking legs only up close. The turtle, moray, star and urchin were checked at close range in the first capture round but have no final re-capture.</li>\n</ul>"}, {"slug": "polish-brooder", "t": "Polish the Brooder (AAA materials and geometry)", "d": "Michael: \"lots of things just look like primitives no polish, even the crab beast. AAA is the bar.\" The audit at 30 u in daylight found the shell plates reading as a stack of smooth grey pebbles, carapace and arms one flat clay material, thorns plain cones, reef growths flat cylinders, legs tubes, eyes dots. Bar: a Monster Hunter / Shadow of the Colossus creature at close range. Geometry and materials only: behaviour, rite, timings, wards, collision (L.spine / L.collR) and the dormant/wake contract are untouched. Branch polish-brooder, not merged.", "tags": ["quality"], "updated": "2026-09-25", "body": "<p>Michael: &quot;lots of things just look like primitives no polish, even the crab beast. AAA is the bar.&quot; The audit at 30 u in daylight found the shell plates reading as a stack of smooth grey pebbles, carapace and arms one flat clay material, thorns plain cones, reef growths flat cylinders, legs tubes, eyes dots. Bar: a Monster Hunter / Shadow of the Colossus creature at close range. Geometry and materials only: behaviour, rite, timings, wards, collision (L.spine / L.collR) and the dormant/wake contract are untouched. Branch polish-brooder, not merged.</p>\n<h3>Detail</h3>\n<p>Files: src/entities/sleeper/brooder.js, brooderGeo.js (brood.js and lib/textures.js unchanged).</p>\n<ul>\n<li>SHELL PLATES: bladeGeo(variant) is a real plate. The section is a flat top that breaks over a chamfer into a thin rim, with a flat underside. The root is thick and the tip thin. The outline is an angular shard (a broad shoulder to a long point). Each of 4 variants has its own broken-edge profile: V notches on either margin, a fine serration, and on some a snapped jagged tip. Vertex-colour AO marks the root cavity and the underside. There are 4 InstancedMeshes with a per-plate tint. bladeMaps() is a 512x512 atlas, one 512x128 strip per variant, holding growth shelves (a sawtooth of steps), growth rings, ribs, pitting, edge chips, rust rims and wet-ridge/matte-groove roughness. castShadow and receiveShadow are on.</li>\n<li>CARAPACE MAPS: carapaceMaps() now bakes into typed arrays and DataTextures, with no canvas round trip. Heights stay float until the normal is taken, which avoids 8-bit terracing. Analytic fields (h, seam distance, corner f3-f1, scute id and a rust-run field) are computed at 320^2 and sampled bilinearly. Detail noise comes from 128^2 tileable fbm tables. Features: a V seam with real depth; a bevel and crown on each scute; growth lines parallel to the margin; ragged chips that expose a paler under-layer, most at triple corners; lichen crust with height; stamped sponge bores with raised bleached rims; rust pooling in the seams and streaking downhill from them; moss only where the cavity mask (blur(h) - h) is high; per-scute tint; wet crowns (0.24) against matte crust (0.9). Resolution is 1024 because 2048 would not fit the bake budget.</li>\n<li>ARMS / LEGS / MOUTH: chitinMaps() is a 1024x512 atlas with this UV contract: u in [0, 0.5) is a limb segment, running from a pale wrinkled membrane through grey-teal stippled chitin with teal and pale flecks and scratches to a sutured, rust-stained cuff; u in [0.5, 1) is a finger, running from chitin through rust pooling in pits to dark glossy horn. The pincer rust is now a map, not vertex colour. chitinSheen() adds a lit Fresnel rim (scaled by the diffuse light received, so it is never a glow in the dark). It uses one customProgramCacheKey, shared by arms, legs (charcoal tint) and mouthparts. Tubercles are lathed bosses with a rim and a cratered cap. Spikes and teeth are fluted chitin spikes with a flared base and a bone-to-horn gradient. Segments are articulated: the membrane neck starts inside the previous cuff, the cuff swells with a lipped rim, and the ends are domed knuckles with smoothed cap UVs. Arm roots are buried under the lip, and fingers have knob rows.</li>\n<li>REEF: reefGeo() is ONE merged mesh with vertex colours, where there used to be 4 meshes. It holds lathed tube sponges (flared foot, lumpy pitted wall, lipped osculum, dark throat), gorgonian fans (forking branches fused into a lattice by nearest-node bridges) and encrusting sponge mats moulded to the shell with dark pores. Pigments are muted.</li>\n<li>FACE: a dark brow plate, merged into the carapace geometry, carries the eight eyes in carved sockets with raised rims. Each eye is a wet black dome with a thin gold ring (eyeGeo). The eye shader masks the eyeshine emissive and mirror-wetness to the dome by vertex colour. The front visor now stops above the eye cluster. Mouthparts carry a comb of fine setae (fringe).</li>\n<li>WEED: tapered, folded fronds instead of flat strips.</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-25: Built and verified on branch polish-brooder (commits 2bd888e, 9d7bb5d). Numbers, fresh tab: her tris 159,844 -&gt; 257,570 (budget 260k). Draw calls for her body are unchanged at 31 meshes: blades went 1 -&gt; 4 and reef 4 -&gt; 1, and the face plate is merged into the shell. Her materials use 14 unique programs (the before count was not measured live). No lights added. Brooder bake (carapace + chitin + blade) is 275-340 ms typical on a busy machine (e.g. 199+50+26, 214+62+24, 239+72+31 ms); one run under heavy contention hit 421+98+41. The old carapace bake alone measured ~1200 ms. GPU median with her in view, uncapped, hidden pane at 1920x1080: 18.3 ms with her vs 15.5 without; an earlier run was 15.6 vs 13.4. __lev.fp(0) = 15ce888c. Rite: egg take -&gt; woke, stand 0.58 at 4 s and 1.0 at 9 s, wards rising (-2.8/2.0/2.2 -&gt; 7.3/5.8/5.2 above terrain). Memory flat across 6 serpent/brooder swaps: geometries 491, textures 136, programs 300. Console clean in a fresh tab. Captures in scratchpad/brooder-polish/caps/: final_34_25u_standing.png, final_34_25u_awake_home.png, final_macro_6u_flank.png, final_face_8u.png, final_asleep_ridge_30u_from_nest.png; look-dev studio set s1..s8_*.png; before: base_34/base_face/base_macro.png. Not verified: the real-window 120 fps check (the pane was hidden throughout, so frames were timer-driven) and a before-GPU baseline (the reload of main for a baseline was refused). Open: from the nest, asleep, she still reads as a crab with knees raised rather than a ridge. That is the leg rest pose, which is behaviour and was left alone.</p>\n<p>
