2026-09-25 (branch polish-followups, cd5fb7e): the asleep-as-crab item is fixed. Asleep she is a ridge. The legs rest pulled in under the shell (restWorld reach less 0.76k), and the IK knee plane lies flat (knee sideways, not up), so every knee sits inside the footprint at local y -0.10. The claws fold back under the prow on searched per-joint targets. The shell drops 0.035R. A generated silt drift closes the gap under her rim: on the lip the floor fell away by up to 0.4R under her flanks and tail, and that gap was the crab read. The drift uses the seabed&#x27;s own material and vertex channels, resampled from the terrain mesh, and darkens where silt meets shell. It sinks as she rises and is hidden once she stands. It adds 2,048 tris in one extra draw and no new program (the shared seabed material is lifted out before dispose). Every dormant term is scaled by (1 - standE), so standing is bit-identical: a deterministic rig hash (legs, claws, body matrix, spine, ward positions) gives legs 6a956f9 / all 250ba058 on both main and branch. Wake via interact(egg 0): woke, stand ran to 1.0, wards rose to 2.9/7.7/7.6 above the terrain, drift hidden. RISE_T, L.spine/L.collR, the sockets and the wake contract are untouched. Captures are in scratchpad/followups/caps/: base_asleep_nest30/60 (main), t2_asleep_nest30, t1_asleep_nest60, t2_flat_front30/side30 (placed on open ground), t3_rising_nest45, t3_standing_front40 vs main_standing_front40. Not verified: the walk home and the re-settle at the nest after calming (no drift there, by design).</p>"}, {"slug": "battery-governor", "t": "Battery governor (frame cap)", "d": "Michael: sessions are eating CPU and battery; \"need to be able to work on stuff without being plugged in.\" Measured: the Claude/agent processes themselves are negligible (~5 CPU-minutes over 12 h). The cost is the GAME — an uncapped requestAnimationFrame loop rendering the full HalfFloat chain at the display's 120 Hz, including on the title screen, in every agent's verification tab and in the lab. Several live WebGL surfaces at once during parallel rounds is what pins WindowServer and the GPU.", "tags": ["perf", "engine"], "updated": "2026-09-06", "body": "<p>Michael: sessions are eating CPU and battery; &quot;need to be able to work on stuff without being plugged in.&quot; Measured: the Claude/agent processes themselves are negligible (~5 CPU-minutes over 12 h). The cost is the GAME — an uncapped requestAnimationFrame loop rendering the full HalfFloat chain at the display&#x27;s 120 Hz, including on the title screen, in every agent&#x27;s verification tab and in the lab. Several live WebGL surfaces at once during parallel rounds is what pins WindowServer and the GPU.</p>\n<h3>Detail</h3>\n<p>A frame governor in game.js frame(): <code>GLASS.power.cap</code> fps (60) while the sea has the helm; <code>GLASS.power.idle</code> (30) on the title, when the window is unfocused, or paused-unlocked; no frame at all while document.hidden. Skipped frames don&#x27;t call clock.getDelta, so the skipped time accumulates into the next dt (still clamped 50 ms) — physics and weather see the same seconds. Phase carried so a 60 cap on 120 Hz is a steady every-other frame. The perf judge (34 fps bar, degrade ladder) is only fed when the loop runs ≥45 fps or uncapped, so a low cap can never shed volumetrics/AO. Lab group &quot;power&quot;; <code>__power.state()/set(cap, idle)</code>. 0 = uncapped for profiling. Agent workflow rule alongside it: close verification tabs when idle; fewer parallel browser rounds on battery.</p>\n<h3>Log</h3>\n<p>2026-09-06: Shipped. Measured live (rendered frames, not rAF ticks): title 30 fps, play unfocused 30, play focused 60, hidden 0, <code>__power.set(0,0)</code> restores the old 120. Perf judge untouched (stage 0), console clean. Note for agents: the in-app browser pane never reports document.hasFocus(), so a verification tab runs at the idle rate — set <code>__power.set(0,0)</code> before any GPU timing, and close tabs when done. Awaiting Michael&#x27;s feel on battery.</p>"}, {"slug": "vent-warm-column-snow-thin", "t": "Thin Marine Snow In Vent Warm Columns", "d": "Marine snow should thin out inside the hydrothermal vents' warm water columns, since rising heated water would carry fewer sinking particles through those columns than the surrounding cold water.", "tags": ["water", "vents", "marine-snow"], "updated": "2026-09-01", "body": "<p>Marine snow should thin out inside the hydrothermal vents&#x27; warm water columns, since rising heated water would carry fewer sinking particles through those columns than the surrounding cold water.</p>\n<h3>Detail</h3>\n<p>Currently the marine snow layers are built without regard to vent shimmer columns, so snow density looks uniform whether or not a column of warm water is passing through it.</p>\n<ul>\n<li>Marine snow layers: <code>src/world/water.js</code> — the <code>snowLayers</code> uniform holders and the snow build inside <code>buildWater</code> (the <code>snow</code> group); per-layer density already driven by <code>uDepth</code> writes in <code>updateWater</code> via <code>murkFrac</code>.</li>\n<li>Vent shimmer columns: <code>src/world/vents.js</code> <code>buildShimmer</code> — the hot-vent positions live in <code>hotVents</code>.</li>\n<li>Likely approach: sample each vent&#x27;s shimmer column position/radius when generating or updating snow particles, and reduce local snow density/opacity within that radius (falloff toward the column&#x27;s edge, not a hard cutoff).</li>\n<li>Acceptance criteria: marine snow visibly and smoothly thins inside each vent&#x27;s warm water column compared to ambient water; no regression to snow density/behavior outside vent fields; no new perf hit large enough to disqualify (spot-check frame time near a vent field).</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "shark-bite-lantern-flicker", "t": "Shark Bite Lantern Flicker + HUD Dip", "d": "When the shark bites Sal, the lantern should flicker and the HUD light meter should visibly dip, so a hit reads as a hit beyond the oxygen loss and camera shake.", "tags": ["predators", "lantern", "hud"], "updated": "2026-09-01", "body": "<p>When the shark bites Sal, the lantern should flicker and the HUD light meter should visibly dip, so a hit reads as a hit beyond the oxygen loss and camera shake.</p>\n<h3>Detail</h3>\n<p>Currently a bite only drains oxygen and shakes the camera — see <code>src/world/predators.js</code> where the strike FSM raises <code>ev.bite</code>, consumed in <code>src/game.js</code>&#x27;s <code>updatePredators</code> event block (<code>pev.bite</code>), which currently only reduces <code>survival.oxygen</code>. There is no lantern or HUD reaction to a bite specifically.</p>\n<p>Levers in <code>src/game.js</code>:</p>\n<ul>\n<li><code>player.light</code> is the light meter value (0–1), read by <code>setLight(player.light)</code> and by <code>$lightfill.style.transform = scaleX(...)</code> for the HUD bar.</li>\n<li><code>lanternLight.intensity</code> is already flicker-driven each frame from <code>player.light</code> and sine terms — a bite could add a transient extra dip/flicker term keyed off a timestamp or a decaying multiplier.</li>\n<li><code>pev.lightSteal</code> already shows the precedent for a predator event draining <code>player.light</code> over time (<code>player.light = Math.max(0, player.light - pev.lightSteal * dt)</code>), so a bite-triggered dip can follow the same pattern: on <code>pev.bite</code>, apply an immediate partial drop to <code>player.light</code> (and/or a short flicker envelope on <code>lanternLight.intensity</code>) that decays back over ~0.5-1s.</li>\n</ul>\n<p>Rejected/undecided: exact magnitude and decay curve not yet designed — needs a quick pass to avoid it reading as a second oxygen penalty rather than a lighting effect.</p>\n<p>Acceptance criteria: on <code>ev.bite</code>/<code>pev.bite</code>, the lantern visibly flickers (extra intensity dip beyond the ambient sine flicker) and <code>$lightfill</code> HUD bar visibly dips and recovers, distinct from and in addition to the existing oxygen-loss and camera-shake feedback.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "sailing-soundscape", "t": "Sailing soundscape", "d": "The voyage has a chain slam and a bell. Wants hull creak, canvas, water on the strakes.", "tags": ["audio", "chart"], "updated": "2026-09-01", "body": "<p>The voyage has a chain slam and a bell. Wants hull creak, canvas, water on the strakes.</p>\n<h3>Detail</h3>\n<p>audio.js one-shots + a 6-second wash keyed to the voyage timeline. All synthesised, house style.</p>\n<ul>\n<li>Acceptance: The voyage carries hull/canvas/water sound end to end with nothing neon; judged by ear.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — noted at phase 4 ship</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "raft-shadow-on-sea", "t": "Raft shadow on the sea", "d": "No dark patch marks the hull from below; wants the surface to receive the sun map.", "tags": ["water"], "updated": "2026-09-01", "body": "<p>No dark patch marks the hull from below; wants the surface to receive the sun map.</p>\n<h3>Detail</h3>\n<p>The sea surface material would need to sample the sun&#x27;s shadow map — receiveShadow on a custom ShaderMaterial means wiring shadow chunks in. Modest but fiddly.</p>\n<ul>\n<li>Acceptance: The hull reads as a dark patch on the water from below in daylight, gone at night and depth.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — noted at the raft round</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "octopus-lantern-theft", "t": "Octopus Steals Sal's Lantern", "d": "The octopus should sometimes snatch Sal's hand lantern during a grab and drag it back to its den, forcing the player to go retrieve it.", "tags": ["octopus", "predators", "light"], "updated": "2026-09-01", "body": "<p>The octopus should sometimes snatch Sal&#x27;s hand lantern during a grab and drag it back to its den, forcing the player to go retrieve it.</p>\n<h3>Detail</h3>\n<p>Idea only, not yet designed or scheduled. There is already a <code>lightSteal</code> event emitted from the octopus grab logic in <code>src/world/predators.js</code>&#x27;s octopus grab handling, and <code>game.js</code> already consumes <code>pev.lightSteal</code> to drain <code>player.light</code>. That existing hookup drains light on steal but does not model the octopus carrying the lantern into its den or give the player a way to get it back — this card is about extending that into a real steal-and-retrieve mechanic.</p>\n<p>Open questions / acceptance criteria (still needs design pass before moving to next):</p>\n<ul>\n<li>What triggers the steal vs. a normal grab (chance? proximity? already-provoked state?)</li>\n<li>Where the octopus&#x27;s den is and how the player locates/reaches it</li>\n<li>What &quot;retrieval&quot; looks like — is the lantern lootable at the den, does the octopus need to be fought/scared off, is there a timer</li>\n<li>How this interacts with the existing light-drain-on-steal behavior — does draining still happen, or does losing the lantern outright override it</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — captured as backlog idea</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "ladder-rung-wear", "t": "Boarding Ladder Rungs Should Show Wear Where Sal Grabs", "d": "The boarding ladder's rungs are bare iron cylinders with only waterline grime. Add\nworn, hand-polished patches where Sal's grip actually lands each climb, so the\nladder reads as used rather than freshly built.", "tags": ["raft", "davit", "detail"], "updated": "2026-09-01", "body": "<p>The boarding ladder&#x27;s rungs are bare iron cylinders with only waterline grime. Add</p>\n<p>worn, hand-polished patches where Sal&#x27;s grip actually lands each climb, so the</p>\n<p>ladder reads as used rather than freshly built.</p>\n<h3>Detail</h3>\n<p>The ladder is built by hand in <code>davit.js</code> <code>buildDavit</code>, in the boarding-ladder block: two side rails plus <code>RUNGS = 9</code> rungs, each placed with</p>\n<p><code>P.put(cyl(...), iron, 0, ry, LZ, 0, 0, Math.PI / 2)</code> and finished with <code>wetGrime()</code></p>\n<p>for the waterline slime band. There is currently no separate &quot;hand wear&quot; treatment —</p>\n<p>only the uniform grime pass.</p>\n<p>The climb itself is <code>player.js</code> <code>updatePlayer</code>, in the <code>player.onLadder</code> block: holding W in the bulwark-gap zone rises Sal up the rung line at</p>\n<p><code>CLIMB_RATE</code> from ladder-foot depth to the deck catch. That logic already knows the</p>\n<p>Y range Sal&#x27;s hands travel through, which is the natural source of &quot;where he grabs.&quot;</p>\n<p>Open questions for whoever picks this up:</p>\n<ul>\n<li>Wear as authored dulled/polished vertex-color patches at fixed rung heights (cheap,</li>\n</ul>\n<p>  static, matches the &quot;weather as boards not as noise&quot; precedent used elsewhere on</p>\n<p>  the raft), vs. wear keyed dynamically off climb usage (more true to the prompt but</p>\n<p>  adds state to track and persist — likely overkill for a cosmetic detail).</p>\n<ul>\n<li>Recommend starting with the static approach: bake brighter/worn iron patches into</li>\n</ul>\n<p>  the rung material in <code>davit.js</code>&#x27;s per-rung loop, roughly where a climbing hand</p>\n<p>  would land relative to rung spacing, using the same <code>Part</code>/<code>weather()</code> idiom</p>\n<p>  (<code>raft/kit.js</code>) rather than inventing a new vertex-paint path.</p>\n<p>Acceptance criteria: rungs show visible burnished/worn patches distinct from the</p>\n<p>grime band, concentrated where a climbing hand would naturally grip; raft draw-call</p>\n<p>count budget (~10 static calls) is not increased; verified in-browser at the ladder</p>\n<p>in daylight and matched against the &quot;recent No Man&#x27;s Sky underwater&quot; quality bar.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created; captured from user request, not yet scheduled.</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "ladder-climb-anim", "t": "Sal climbs hand-over-hand", "d": "Boarding works; the climb is a smooth rise without a rung-grab pose.", "tags": ["animation"], "updated": "2026-09-01", "body": "<p>Boarding works; the climb is a smooth rise without a rung-grab pose.</p>\n<h3>Detail</h3>\n<p>diver.js pose overlay while <code>player.onLadder</code> (already published): arms alternating reach, boots on rungs. Same overlay pattern as the knife slash.</p>\n<ul>\n<li>Acceptance: Climbing reads as hand-over-hand on the rungs from the default camera; no pose pop at grab or dismount.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — noted at the boarding ship (ed915f4)</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: Shipped inside the AAA animation pass (d900be6) — ladderF blend, alternating overhead reach, tucked knees. Closed.</p>"}, {"slug": "eval-zone-tool-reasons", "t": "A tool-shaped reason per zone", "d": "From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: M.", "tags": ["design", "tools", "progression", "eval"], "updated": "2026-09-01", "body": "<p>From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: M.</p>\n<h3>Detail</h3>\n<p>PROBLEM: The progression curve is flat: nothing in zone 1 needs sonar, nothing in zone 2 needs the spear, and every sleeper is the same touch-N-wards fight with a bigger N. No new verb is added between minute five and the ending.</p>\n<p>CHANGE: Zone 1: Orune&#x27;s wards sit dark until a sonar ping rings them for ~8s through the murk (sonar already staggers echoes — a sonarReveal flag on sigils). Zone 2: Mhor&#x27;s wards are guarded by squid that must be speared/slashed off before touch (squid already nibble light — a proximity gate). No new mechanic; the flat curve becomes a curve.</p>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "eval-threaten-the-air", "t": "Threaten the air, not the light", "d": "From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: S-M.", "tags": ["design", "survival", "predators", "eval"], "updated": "2026-09-01", "body": "<p>From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: S-M.</p>\n<h3>Detail</h3>\n<p>PROBLEM: The one lethal resource is almost never the thing threatened. O2 refills at 0.28/s while supplied, so a 10% bite is erased in 0.4s — a camera shake, not a stake. Leviathan contact drains LIGHT, which regenerates. The air bar is decorative; fuel is the real bar and it has no hierarchy.</p>\n<p>CHANGE: Bite → TORN DRESS state: O2 refill halved for ~20s so &#x27;AIR IS LEAKING&#x27; is true and the tenders can&#x27;t out-pump the hole. Leviathan contact does the same. Turns predators and the sleeper into decisions about retreating toward the line. Pairs with shark-bite-lantern-flicker.</p>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "eval-settle-the-verb", "t": "Settle the verb (wards lit, sleeper stills)", "d": "From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: S.", "tags": ["design", "copy", "onboarding", "eval"], "updated": "2026-09-01", "body": "<p>From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: S.</p>\n<h3>Detail</h3>\n<p>PROBLEM: Three different verbs for one action: you LIGHT sigils, the counter says &#x27;2 SIGILS SLEEP&#x27;, the creature STILLS — and the fiction says &#x27;wake nothing else&#x27;. A new player cannot tell whether lighting a ward calms or wakes it. The only real confusion in the first five minutes.</p>\n<p>CHANGE: Wards are LIT; the sleeper STILLS. Replace &#x27;2 SIGILS SLEEP&#x27; with &#x27;TWO WARDS DARK&#x27; / &#x27;ONE WARD DARK&#x27;. Rewrite the opener so it says what a ward is and where it rides: &#x27;THREE IRON WARDS RIDE ITS HIDE. LIGHT THEM AND IT STILLS.&#x27; Sweep showMsg strings in game.js + leviathan.js for the verb set.</p>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "eval-rift-shut-beat", "t": "The rift is shut while it wakes", "d": "From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: S.", "tags": ["design", "onboarding", "rifts", "eval"], "updated": "2026-09-01", "body": "<p>From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: S.</p>\n<h3>Detail</h3>\n<p>PROBLEM: Descending into a rift bowl with the sleeper uncalmed drops the player into total darkness at -318 with no message — an unmarked hole in the seabed.</p>\n<p>CHANGE: One-shot showMsg when the player descends &gt;20u into a bowl with the sleeper awake: &#x27;THE RIFT IS SHUT WHILE IT WAKES.&#x27; Plus a faint floor glow in the bowl so the hole reads as a place, not a fall-through.</p>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "eval-hud-hierarchy", "t": "HUD hierarchy for five bars", "d": "From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: S.", "tags": ["ui", "hud", "eval"], "updated": "2026-09-01", "body": "<p>From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: S.</p>\n<h3>Detail</h3>\n<p>PROBLEM: Five stacked bars with identical geometry (dress / bottle / lantern / air / pump) and no visual hierarchy for the one that kills you. The HUD is also visible behind the title screen.</p>\n<p>CHANGE: Group: survival pair (AIR widest, pump) bottom-centre; control pair (dress, bottle) bottom-left; lantern beside the bearing strip. #ui opacity 0 while state === &#x27;title&#x27;.</p>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "eval-hose-gate-at-calm", "t": "Announce the hose gate at calm time", "d": "From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: S.", "tags": ["design", "onboarding", "survival", "eval"], "updated": "2026-09-01", "body": "<p>From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: S.</p>\n<h3>Detail</h3>\n<p>PROBLEM: &#x27;THE LINE IS TOO SHORT — 1440 M NEEDED&#x27; fires only when the player is already ~55% into the rift after calming. With HOSE_START 380 and zone 1 needing 480, the player must find 4 polymer AND return to the raft before the second zone — a long, unannounced backtrack.</p>\n<p>CHANGE: At calm time, when !canDescendTo(zone+1): &#x27;IT STILLS. YOU HAVE 1140 M OF LINE. THE RIFT NEEDS 1440.&#x27; That is the one moment the player is looking at the message.</p>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "eval-home-mooring-story", "t": "Seed the home mooring with its story", "d": "From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: M.", "tags": ["story", "wrecks", "keepsakes", "eval"], "updated": "2026-09-01", "body": "<p>From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: M.</p>\n<h3>Detail</h3>\n<p>PROBLEM: The mariner&#x27;s arc — the empty helmet stand, the chart in a dead man&#x27;s hand, &#x27;THE OWNER NEVER CAME. SOMETHING ELSE DID.&#x27; — is delivered only to players who sail to remote sites and hunt keepsakes. The home mooring, which every player completes, contains zero of it. The ending&#x27;s &#x27;one light returns&#x27; pays off nothing that was set up.</p>\n<p>CHANGE: One keepsake at home (the skiff is his boat; his empty helmet stand is on the raft) and one authored line at each home wreck in his hand. Keepsake placement in wrecks.js has no site-0 case — that is the only code; the rest is copy in his voice.</p>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "eval-force-rite-to-day", "t": "Force the rite to day", "d": "From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: S.", "tags": ["ending", "weather", "eval"], "updated": "2026-09-01", "body": "<p>From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: S.</p>\n<h3>Detail</h3>\n<p>PROBLEM: Observed: the rite triggered at night → the 75s ascent is a dark screen with a lantern for ~50s. &#x27;One light returns&#x27; needs the light to exist. The ending is weather-dependent and startEnding does not force day.</p>\n<p>CHANGE: In startEnding, scrub weather toward late morning during the 6.5s STILL beat (it exists precisely to hide a cut). Keep the sky&#x27;s own drama — a clearing storm is fine, night is not.</p>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "eval-bearing-strip-legible", "t": "Bearing strip legible", "d": "From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: S.", "tags": ["ui", "wayfinding", "eval"], "updated": "2026-09-01", "body": "<p>From the 2026-09-01 design evaluation (ABYSSA Soundings). Effort: S.</p>\n<h3>Detail</h3>\n<p>PROBLEM: The RAFT / SLEEPER / RIFT bearing strip is the game&#x27;s only map, and at rendered size it is near-illegible: tiny grey caps on a hairline. Sight lines are 40-100u and three zones are stacked 90u apart in unlit water.</p>\n<p>CHANGE: Raise it ~1.6x, give the active target (SLEEPER until calmed, then RIFT) a brighter tick, keep the off-screen pin. Judge at 1080p on Michael&#x27;s monitor, not in the pane.</p>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "smoothstep-sweep", "t": "Reversed-smoothstep sweep", "d": "A reversed-edge smoothstep is undefined GLSL and returns 0 on this driver — it silently killed the entire Jacobian foam for a whole round. Twelve more suspect call sites remain across the codebase.", "tags": ["bug", "shaders"], "updated": "2026-08-25", "body": "<p>A reversed-edge smoothstep is undefined GLSL and returns 0 on this driver — it silently killed the entire Jacobian foam for a whole round. Twelve more suspect call sites remain across the codebase.</p>\n<h3>Detail</h3>\n<p>The landmine (found during the opaque-storm round, fixed in water.js waveField with the defined-everywhere form <code>1.0 - smoothstep(lo, hi, x)</code>): GLSL smoothstep(edge0, edge1, x) with edge0 &gt;= edge1 is UB; this driver returns exactly 0, no warning, so any term multiplied by it vanishes.</p>\n<p>Flagged, unfixed: <code>water.js</code> god-ray billboard fade (~line 1079) and marine-snow fade (~line 1157) — both currently ×0 on this driver, meaning those fades never applied here. Elsewhere: <code>creatures.js</code> ×4, <code>predators.js</code> ×3, <code>flora.js</code> ×1 — GLSL, same risk; <code>weather.js</code> ×2 are THREE.MathUtils (CPU, x-first signature — verify they&#x27;re actually correct, not reversed).</p>\n<p>Approach: grep every smoothstep, classify GLSL vs CPU, fix GLSL reversed forms with the 1-minus pattern, then LOOK at each affected visual (god rays, snow, creature fades, predator fades, flora) — fixing these will CHANGE the look where the broken form was load-bearing-by-accident. A/B screenshot each before/after; anything that reads worse fixed-than-broken is a Michael call.</p>\n<ul>\n<li>Acceptance: zero reversed-edge GLSL smoothstep calls in src/; every visual change from the fixes screenshotted and either kept or re-tuned.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-08 — cut from the opaque-storm agent&#x27;s discovery</li>\n</ul>\n<h3>Log</h3>\n<p>2026-08-25: Absorbed into the AAA shader pass and CLOSED. All 12 card sites confirmed + one new site found (ventlife shrimp flick) = 11 GLSL fixes shipped across water/creatures/predators/flora/ventlife (weather.js&#x27;s 2 were CPU MathUtils, verified correct, no change). Every resurrected visual was re-judged live and retuned to the quiet bar; see aaa-shader-pass card.</p>"}, {"slug": "weather-audit", "t": "Weather audit round (threejs-skills)", "d": "Audited the whole weather/sky/water stack against the in-repo threejs-skills packs, then fixed everything real. Merged `7519bf5`.", "tags": ["bug", "perf", "weather"], "updated": "2026-08-23", "body": "<p>Audited the whole weather/sky/water stack against the in-repo threejs-skills packs, then fixed everything real. Merged <code>7519bf5</code>.</p>\n<h3>Detail</h3>\n<p>Audit verdict: the system already beats the packs&#x27; bar on allocation, uniforms, instancing, sorting, shadow scoping. Four defects + cheap wins found and shipped:</p>\n<ul>\n<li><b>Sea-surface lightning was dead</b> — game.js passed only 2 args to setWeatherWater, so uFlash stayed 0 forever and the derived day value used a stale surfK inversion (skewed moon/ember/fog gates in mid-day gales). Now passes day + flash explicitly.</li>\n<li><b>Three billboards drew twice</b> (r163+ transparent DoubleSide = per-face passes): puff clouds (480 quads doubled), storm rain plane, god-ray billboards — <code>forceSinglePass: true</code> on each (ocean surface untouched, genuinely two-sided).</li>\n<li><b>sun.castShadow hysteresis</b> — was a raw per-frame boolean; each flip = full-scene shader program switch. Now flips only after the condition holds &gt;1s.</li>\n<li><b>Fog fast path</b> — heavy fog now crushes uCloudCov under the shader gate, skipping the dome&#x27;s fbm cloud block on pea-soup mornings; clear days bit-identical (ramp starts at fog 0.60).</li>\n<li><b>De-latticed storm splashes</b> — rainCells ported splash()&#x27;s jitter/dead-cells/per-cell-beat, cost-identical.</li>\n<li><b>Sky probe for the raft (M3)</b> — 64px CubeCamera renders the dome alone, PMREM&#x27;d, refreshed only on palette drift (&gt;0.03, ≥2.5s). Scoped to raft materials via envMap swap, NOT scene.environment — deep zones structurally cannot show sky glints. Brass-age intensity kept.</li>\n<li>Rain-plane <code>discard</code> → output-zero (early-z kept). PCFSoftShadowMap radius skipped: renderer deliberately on PCFShadowMap (r182 deprecation), radius is ignored there.</li>\n</ul>\n<p>Verified in-pane: flash reaches the sea (held <code>weather.flash(0.9,5)</code> in a night gale lifts the sea band silver), clear day unchanged, fog morning crushes coverage 0.70→0.07 cleanly, deck brass shows subtle sky response at noon/dusk, −500 m shows zero glints.</p>"}, {"slug": "sal-quality", "t": "SAL — the diver deserves better", "d": "Sal's limbs read as tubes and his movement is stiff. A two-pass quality round: sculpt the suit like canvas over a man, then make the man move like one — all generated, per the hard rule.", "tags": ["sal", "character", "animation"], "updated": "2026-08-15", "body": "<p>Sal&#x27;s limbs read as tubes and his movement is stiff. A two-pass quality round: sculpt the suit like canvas over a man, then make the man move like one — all generated, per the hard rule.</p>\n<h3>Detail</h3>\n<p>Michael&#x27;s verdict: &quot;Limbs feel very tubular not very human like, movements are stiff.&quot; Bar: as high as possible, all procedural (<code>entities/diver.js</code>, ~40k tris, Part/bake merged, curve-keyed gait).</p>\n<p>Key insight for the sculpt: a Mark V diver is a man inside BAGGY CANVAS — human-ness comes from suit behavior, not bare anatomy: girth that swells and tapers (shoulder&gt;elbow&gt;wrist, thigh&gt;knee&gt;calf&gt;ankle), fold/bunch rings at elbows/knees/groin, the twill pulling taut across shoulders and ballooning at the torso, laced gauntlet cuffs, weighted boots with real toe/heel form. Lathe profiles per limb segment, not cylinders.</p>\n<p>Motion pass: overlapping action (hips lead, shoulders counter, wrists/ankles trail), weight — heel-strike compression and hip drop in the gait, breathing at idle, drag-lagged arms in the swim, eased starts/stops instead of velocity-keyed poses. The suit&#x27;s spring secondary motion exists; the skeleton&#x27;s timing is what is stiff.</p>\n<p>Includes the GENERATED Mark V helmet upgrade (bonnet, faceplates with real bezels, wing nuts) replacing the external-glb plan.</p>\n<ul>\n<li>Acceptance: Michael judges Sal at the dressing station and in motion (walk, swim, ladder, knife) — &quot;human in a suit,&quot; not &quot;tubes.&quot; Perf: stays ~40-55k tris, same draw calls, gait/stepCount/slash timing contracts unbroken (game.js pendingSlash at t=0.22s, footsteps on heel strike).</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-07 — cut from Michael&#x27;s verdict + the all-generated hard rule; sculpt pass first</li>\n<li>2026-08-14 — SCULPT PASS SHIPPED (diver.js; motion pass still open). Limbs are lathe profiles per segment (<code>segGeo</code> + <code>profOf</code>), not capsules: deltoid&gt;elbow, forearm belly&gt;wrist, thigh&gt;knee, calf&gt;ankle. Gather rings at elbows/knees/groin, seam piping on the outer limbs, ballooned torso + seat sag, laced gauntlet cuffs with mitten hands (knuckle ridge + opposed thumb), weighted boots with toe box/heel block/ankle flare/lead sole. Helmet upgraded in place: five spun bonnet rings, four neck-ring wing-nut dogs, corselet brailles. <code>helmetSwap.js</code> no longer loads the glb (external-glb plan retired per the hard rule) — the <code>helmet.glb 404</code> is gone. 32.6k-&gt;45.6k tris, draw calls 88-&gt;88 unchanged. Joint pivots, stepCount heel strikes, slash timing (held 0.10-0.48s, arc 0.15-0.32s), lantern and tether dock all verified live. Root-caused a long-standing artifact on the way: <code>fold()</code> displaced coincident lathe/capsule POLE vertices along their differing normals, tearing a white starburst at the crotch and every limb joint — fold() now welds the displacement direction across coincident positions.</li>\n<li>2026-08-07 — Michael: &quot;when he is standing on the raft he is bobbing up and down like he is in the water.&quot; Diagnosed for the motion pass: (1) idle pose is the AQUATIC sway/bob sine set even on planks — deck idle must be terrestrial (planted, weight-shifts, shoulder breathing); (2) pos.y eases toward the live deckY at 10/s and the camera at 8/s — out-of-phase with the swell; on deck the follow should be RIGID (you move with the boat); (3) swim-&gt;walk blend (gb, 4.5/s) leaks swim bob just after boarding. Probes: player.pos.y vs raft.position.y phase, gb settle time</li>\n<li>2026-08-07 — motion pass shipped: deck idle is TERRESTRIAL (bob removed — body-Y sd 0.00000 over 32 storm seconds; 30s-period weight shifts, shoulder breathing at 8.6 breaths/min, sparse deterministic head turns), rigid deck-follow (pos.y vs raft corr 1.0000 — orchestrator&#x27;s player.js snap), boarding settle 123ms (was ~500), shoulders answer hips 73ms late (r=-0.999), arms on an eased pendulum with wrist/ankle SPRINGS, knees soften 5° under heel strikes, gait attack 0.12s/release 0.25s, swim arms drag-lag 284ms. Slash window and cadence intact. AWAITING MICHAEL&#x27;S EYE — sculpt + motion together</li>\n<li>2026-08-07 — Michael, third verdict: &quot;none of his movements feel realistic.&quot; Parameter tuning declared FAILED; structural rebuild launched — IK foot planting (stance feet nailed to world/raft-local anchors, two-bone solver, the measured 0.5x-speed stance slip is the acceptance test at &lt;0.02u), seeded per-step variation (nothing clockwork), physical transitions (catch-step stops, anticipation starts, banked turns). Visual frame-sequence verification mandated — numbers alone have lied twice</li>\n<li>2026-08-15 — STRUCTURAL REBUILD SHIPPED (diver.js). Three laws. (1) IK FOOT PLANTING: a stance foot claims a world anchor (raft-local on deck so it rides the swell, world + frozen height on the seabed) and a two-bone analytic solver holds it there while the root passes over; the sole rolls heel -&gt; flat -&gt; ball on an authored pitch curve. <b>Intra-stance slip 1.3 u -&gt; 0.0003 u mean / 0.0025 u max</b> (acceptance was &lt; 0.02), stance reach-clamping 0%. (2) NOTHING IS CLOCKWORK: stateless mulberry32 keyed on step index — stride +/-6%, stance +/-8%, lateral placement +/-0.05, per-kick swim asymmetry (max 9.5 deg knee difference between the two legs of one frog kick), drifting breath. Measured cadence SD 3.7%, lateral spread 0.101 u. (3) TRANSITIONS ARE EVENTS: 150 ms lean before the first push-off; a catch step on stopping that drives the swinging foot to a plant ahead of the COM on its own clock and pitches the body 4.3 deg into it before rocking back; banked turns; a shuffle that creeps the anchors round when he turns on the spot. PLUS a spring-driven skeleton (Michael: &quot;a little robotic&quot;) — all 27 pose channels through per-joint springs keyed to limb mass, under-damped at the extremities, softened 30% underwater; the planted leg and the slashing arm are the two exemptions. THE PRICE, stated plainly: the rig cannot walk 2.6 u/s on 1.027 u legs without either sliding or bending, so STRIDE_U 2.27 -&gt; 1.95 (cadence +16%), the pelvis now vaults on a real inverted pendulum (0.20 u rise and fall per step), and Sal stands 58 mm lower — which also fixed a shipped bug nobody had noticed: his boots hung 37 mm ABOVE the deck at full leg extension, because player.js&#x27;s collision floor is 1.35 and the rig only reaches 1.313. Contracts all held: 45,634 tris / 88 draw calls unchanged, stepCount cadence, slash held 0.100-0.517 with contact peak velocity at exactly 0.217, lantern/inlet/helmet/pack mounts, walkP/swimP publishing, sculls. 60 s mixed soak: zero errors, zero heap growth, zero geometry/program growth, 12.1 us/frame. AWAITING MICHAEL&#x27;S EYE — the numbers have lied twice, so this one is his call</li>\n<li>2026-08-07 — Michael on the rebuild: &quot;oh now its just odd... maybe we just hit our limits.&quot; Read as uncanny valley, not ceiling: correct mechanics at cartoon amplitude (the agent&#x27;s own flag — vault 2.5x human). Vault scaled to 0.45 of the rigid pendulum (IK knees absorb the flattened arc for free, the way real knees do); window.__gait.vault is the live A/B (0 flat, 0.45 default, 1 full pendulum). If it still reads odd at every setting, the stylized-vs-realism conversation is honest to have</li>\n<li>2026-08-08 — closed by Michael: &quot;good with Sal&#x27;s walking for now.&quot; Vault knob stays live for later taste passes</li>\n</ul>"}, {"slug": "threejs-upgrade", "t": "three.js upgrade (r160 → current)", "d": "We ship on r160 (Dec 2023); three.js is at r184+ with production WebGPU since r171 and a node-based post pipeline since r183. An upgrade is its own careful round, not a version bump.", "tags": ["infra", "risk"], "updated": "2026-08-07", "body": "<p>We ship on r160 (Dec 2023); three.js is at r184+ with production WebGPU since r171 and a node-based post pipeline since r183. An upgrade is its own careful round, not a version bump.</p>\n<h3>Detail</h3>\n<p>Why it&#x27;s risky here: the per-channel Beer-Lambert fog is patched into <code>THREE.ShaderChunk</code> globally (<code>world/water.js</code>), and most materials do <code>onBeforeCompile</code> surgery keyed to r160&#x27;s exact chunk names — routine upstream chunk renames break the game&#x27;s look silently. The CDN <code>postprocessing</code> + <code>n8ao</code> libs must stay compatible with the chosen core.</p>\n<p>Approach when taken: bump one importmap entry on a branch, run the existing anchors (terrain fingerprints, calm-noon ambient probe, program-count soak, refraction A/B via P key), grep three&#x27;s migration guide r160→target for every chunk name we patch.</p>\n<p>WebGPU is a separate decision from the version bump — do not conflate.</p>\n<ul>\n<li>Acceptance: game visually identical on the new core (anchors green), or a written list of what changed and Michael&#x27;s sign-off on each.</li>\n</ul>\n<h3>What r184 actually cost us</h3>\n<p>The feared break did NOT happen: every chunk name we patch (<code>common</code>, <code>begin_vertex</code>,</p>\n<p><code>beginnormal_vertex</code>, <code>color_fragment</code>, <code>emissivemap_fragment</code>, <code>roughnessmap_fragment</code>,</p>\n<p><code>normal_fragment_begin</code>, <code>normal_fragment_maps</code>, <code>project_vertex</code>, <code>worldpos_vertex</code>,</p>\n<p><code>tonemapping_fragment</code>, <code>colorspace_fragment</code>) and all four fog chunks survive r161→r184</p>\n<p>unrenamed. A boot-time assertion pass (temporary <code>String.prototype.replace</code> wrapper that</p>\n<p>logs any <code>#include &lt;...&gt;</code> search string absent from its subject) reported <b>zero misses</b></p>\n<p>across every material in the game. That wrapper is dev scaffolding and was removed before</p>\n<p>commit — recreate it in one paste for the next bump; it is the only way to see a failed</p>\n<p><code>.replace</code>, which is otherwise silent.</p>\n<p>Three forced changes, all mechanical:</p>\n<ul>\n<li><code>PCFSoftShadowMap</code> was deprecated for <code>WebGLRenderer</code> in r182 and three now silently</li>\n</ul>\n<p>  substitutes <code>PCFShadowMap</code>. <code>core.js</code> names the real one. **This is the one thing that</p>\n<p>  is not bit-identical** — the raft&#x27;s sun shadow (the only shadow in the game, an 18-unit</p>\n<p>  ortho box at the origin) has a harder edge. Nothing else in the frame casts.</p>\n<ul>\n<li><code>postprocessing</code> 6.35.3 → 6.39.4 (its peer range excluded three ≥ 0.181 until 6.39.1).</li>\n</ul>\n<p>  <code>n8ao</code> stays at 1.9.4 — its peer range is <code>three &gt;= 0.137</code> and it loaded clean.</p>\n<ul>\n<li>The DRACO decoder URLs in <code>lib/assets.js</code> and <code>entities/helmetSwap.js</code> were hard-pinned</li>\n</ul>\n<p>  to <code>three@0.160.0</code> outside the importmap. Bumped to match.</p>\n<p>Watch-items that are noise so far but should meet Michael&#x27;s eye:</p>\n<ul>\n<li>r183 moved <code>RoomEnvironment</code>&#x27;s geometry, so the IBL baked in <code>core.js</code> differs. It only</li>\n</ul>\n<p>  feeds specular reflection on brass/metal; nothing measurable showed, but it is the one</p>\n<p>  path where &quot;identical numbers&quot; cannot prove &quot;identical look&quot;.</p>\n<ul>\n<li><code>THREE.Clock</code> is deprecated in favour of <code>Timer</code> (warning only; <code>Timer</code> has different</li>\n</ul>\n<p>  page-visibility semantics, and <code>samplePerf</code> already distrusts the clamped delta — leave</p>\n<p>  it alone until it actually breaks).</p>\n<ul>\n<li><code>DRACOLoader.setDecoderConfig({type:&#x27;js&#x27;})</code> is deprecated; three will be WASM-only.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-06 — captured from Michael&#x27;s note that a new version exists; parked while SKY &amp; WIND is in flight</li>\n<li>2026-08-06 — Michael: &quot;upgrade threejs first then tackle A&quot; (puff-cluster clouds wait on this). Upgrade agent launched on a branch</li>\n<li>2026-08-07 — branch <code>three-upgrade</code>: r160 → r184 done and anchored. Terrain fingerprints</li>\n</ul>\n<p>  bit-identical (home <code>8a5688da</code>, Pallid <code>64d9c4a5</code> on this session&#x27;s probe), calm-noon fog</p>\n<p>  <code>[0.055,0.135,0.112]</code> / density <code>0.00764925</code> and every light intensity+colour identical to</p>\n<p>  4 decimals, boot programs 191 / geometries 146 identical, reseed soak FLATTER than main</p>\n<p>  (353/164 constant vs main&#x27;s 356→360 / 164→168), zero GL errors with refraction on and off,</p>\n<p>  P-bypass clean, volumetrics present, full quality after 5 min, frame time 20.4 ms vs main&#x27;s</p>\n<p>  23.1 ms. <b>Needs Michael:</b> the deprecated soft shadow map (above) is a real if small look</p>\n<p>  change, and the merge is his call. NOT merged.</p>\n<ul>\n<li>2026-08-06 — MERGED by Michael&#x27;s call (&quot;merge it&quot;): 109d5a3 on main. r184 live (probed REVISION 184, console clean). The harder raft-shadow edge is accepted; soften via shadow camera/map-size later if it bothers his eye</li>\n</ul>"}, {"slug": "sal-embodiment", "t": "SAL embodiment — edges, surfaces, strokes", "d": "Sal doesn't yet believe in what he touches: the raft has no edges, wood and silt get the same walk, and swimming is a glide instead of strokes. Three fixes, one round.", "tags": ["sal", "player", "physics"], "updated": "2026-08-07", "body": "<p>Sal doesn&#x27;t yet believe in what he touches: the raft has no edges, wood and silt get the same walk, and swimming is a glide instead of strokes. Three fixes, one round.</p>\n<h3>Detail</h3>\n<p>Michael&#x27;s verdicts (2026-08-07): (1) &quot;he can fall off from any side of the raft... enter the water exit the water via the ladder... the boom is in the way of the ladder. He collides with nothing on the raft&quot;; (2) &quot;walking is the same no matter what surface (ice skating on the raft)... at the bottom of the ocean pressure or buoyancy has no effect, walking under water is incredibly difficult&quot;; (3) &quot;swimming... just glides back and forth, this is why propulsion is important.&quot;</p>\n<ul>\n<li>EDGES: bulwark containment at the deck footprint (player.js deck block; frame ±4.7, walk lane, ladder bay |x|&lt;1.2 z 4.2-5.9 is THE one gap — the boarding ritual becomes physical). Boom re-rake in raft/davit.js so the climb line is clear. Standing rulings intact: no leash-clamp, HOSE_REQ gating untouched.</li>\n<li>SURFACES: deck walk grips (high friction, stride locked to travel, fast stop — kills the skate); seabed walk is pressed (drag per step, buoyancy trims effective weight via player.buoy, slower ramp). Top speed unchanged — ponderous stays, per the old ruling; it becomes LEGIBLE.</li>\n<li>STROKES: swim thrust pulses on the frog kick (impulse on kick, coast between, one clock shared with diver.js swimP so the visible kick IS the push); banked turns; weak sculls for back/strafe. Thruster remains the speed answer.</li>\n<li>Acceptance: Michael walks the deck edge and is held by the bulwark except at the ladder bay; boards/exits via the ladder with the boom clear; deck walk plants, seabed walk presses; swimming breathes with the stroke. Hose economy, respawn, ending untouched.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-07 — cut from Michael&#x27;s three oddities; single agent round on player.js/diver.js/davit.js with hard contracts</li>\n<li>2026-08-07 — shipped: (1) the bulwark is real — held at 4.36 on all rails with zero drift, the ladder bay is the one gap, Space no longer hops on deck, the davit purchase swung to starboard so the climb capsule is geometry-clean; (2) one walk law, two grounds — deck stops in 0.34u/0.55s, seabed 0.94-1.94u by dress fill (vented plants, full dress moon-walks), stride slip zeroed (ratio 0.999), top speed exactly 2.600 frame-rate independent; (3) swimming breathes — thrust pulses on the kick snap (±27% around a mean within 3% of shipped), banked turns (+6.7° into a sustained turn), back/strafe sculls at 55%. FEEL CHANGES FOR MICHAEL: scull speeds halved, deck hop removed, davit silhouette asymmetric, deck top +1.8%</li>\n<li>2026-08-07 — Michael on the stroke work: &quot;i really dont see any difference... swimming and walking still dont feel natural.&quot; Root cause owned: feel was measured in the physics loop but the CAMERA (critically-damped, 9u back) low-passes it away — feel is transmitted through the camera or not at all. FEEL CHANNEL built by the orchestrator: kick envelope deepened 0.60-&gt;0.88 (coast sags toward half the mean), stroke spin-up ~2.6x from a standstill (pressing forward means a kick NOW), camera breathes with the surge (speed-EMA coupling, ±0.3-0.5u of boom), heel strikes dip the eye 5cm on planks with 0.22s recovery. window.__feel = {on, surgeK, stepDip} is the live A/B. Pane could not run real-frame traces (rAF hidden-throttle) — MICHAEL&#x27;S WINDOW IS THE VERIFICATION</li>\n<li>2026-08-08 — closed with the sal-quality ruling</li>\n</ul>"}, {"slug": "rain-from-above", "t": "Rain from above", "d": "The air-side rain lattice read as stamped circles and was muted; needs a stochastic splash field.", "tags": ["water", "storm"], "updated": "2026-08-07", "body": "<p>The air-side rain lattice read as stamped circles and was muted; needs a stochastic splash field.</p>\n<h3>Detail</h3>\n<p>The from-below rain lens is fine and untouched. Air side needs non-lattice splash placement — a separate small system.</p>\n<ul>\n<li>Acceptance: Storm rain from the deck reads as stochastic splashes, no visible lattice, from eye height and from above.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried from the sky round</li>\n<li>2026-08-07 — picked as next after the SKY &amp; WIND round (Michael: &quot;ok rain next&quot;); agent launched</li>\n<li>2026-08-07 — built: air-side lattice replaced with a stochastic splash field (centre jitter + dead cells + per-cell beat, two lattices, the fine one rotated); new <code>src/world/rain.js</code> falling streaks (one instanced draw call, wind-slanted, surface-anchored). GLASS.rain added. Awaiting orchestrator review.</li>\n<li>2026-08-07 — shipped: lattice broken (jittered strike centers, 34% dead cells, per-cell beat, two rotated scales — same sample count as before; the old air side was actually muted to ZERO, so deck rain is new, not fixed) + world/rain.js falling streaks (420 quads, one draw call, camera-anchored cylinder, surface-anchored floor, slant = eased wind, gusts swing slant 27%, calm = one compare). Found and fixed: rain leaked into the refraction pass through a ShaderMaterial ignoring clip planes — it rained underwater in the transmitted scene</li>\n</ul>"}, {"slug": "zone1-vent-life", "t": "Zone-1 vent life", "d": "Pale shrimp and crabs swarming the chimneys — the boiler room inhabited, not just built.", "tags": ["zone 1", "creatures"], "updated": "2026-08-05", "body": "<p>Pale shrimp and crabs swarming the chimneys — the boiler room inhabited, not just built.</p>\n<h3>Detail</h3>\n<p>Pattern: creatures.js boid/instancing idioms; swarm anchors at the 12 active chimney positions (vents.js <code>activeVents</code>).</p>\n<p>Tone: pale, small, dense near throats — life that eats the heat. No glow.</p>\n<ul>\n<li>Acceptance: Swarms visible at every active chimney, dense near throats, zero glow, no measurable frame cost at the floor.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — agreed as next after the boiler room shipped</li>\n<li>2026-08-05 — started: <code>activeVents</code> exported from <code>vents.js</code>, contract stub <code>ventlife.js</code> wired into game.js (build/reseed/update), craft agent building the swarms</li>\n<li>2026-08-05 — shipped: <code>world/ventlife.js</code> — two InstancedMeshes (160 shrimp/vent GPU-swirled at the throat, 2 crabs/vent on the crust), all motion in the vertex shader, no glow, fog on, depth-band gate -340/-630. Verified live: 1920 shrimp + 24 crabs across 12 vents, materials stable across 5x reseed, no measurable frame cost at the floor (16.0 vs 16.2 ms median)</li>\n</ul>"}, {"slug": "wind-on-water", "t": "SKY & WIND — wind on the water", "d": "Waves follow the wind: directional bias and amplitude, whitecaps torn off crests in a gale, and an undercurrent that pushes at -30 and dies by the abyss.", "tags": ["water", "waves", "player"], "updated": "2026-08-05", "body": "<p>Waves follow the wind: directional bias and amplitude, whitecaps torn off crests in a gale, and an undercurrent that pushes at -30 and dies by the abyss.</p>\n<h3>Detail</h3>\n<p>Builds on day hands (wind {speed, dir}); runs AFTER the clouds/fog/moon card (same file, serialized).</p>\n<ul>\n<li>Surface: anisotropic wave bias along wind dir, amplitude from wind not just storm; whitecap crest brightening above ~0.6 wind. <code>world/water.js</code> surface shader.</li>\n<li>Below: storm current becomes a wind-aligned vector decaying with depth — real push at -30, whisper at -200, nothing in the abyss. <code>player.js</code> setStormCurrent wiring is the orchestrator&#x27;s.</li>\n<li>Raft swell already reads env.sea; verify the pairing in a gale.</li>\n<li>Acceptance: in the lab a wind sweep visibly re-aims the swell and whitecaps appear; the underwater push aligns with the surface wind and decays with depth; calm noon anchored.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — cut from the west-coast round; serialized behind the sky card</li>\n<li>2026-08-06 — shipped: anisotropic chop in waveSum (vertex+fragment+CPU mirror agree — maxAbsDiff 0 at wind 0 over 1600 samples), whitecaps height-led (coverage 9-13% calm to gale, hard-clamped 0.26 under bloom), wind-aligned undercurrent decaying exp(-depth/60) — push at -30 (2.2u/5s), noise by -200. game.js wired setWindCurrentVec off the EASED wind. GLASS.windwater knobs</li>\n</ul>"}, {"slug": "weather-light-lab", "t": "THE GLASS — weather & light lab", "d": "A movable sun, authored dawn/noon/dusk/night/storm palettes, one storm envelope tying surface to subsurface — plus an in-game lab to scrub time and tune it all live.", "tags": ["weather", "water", "lighting", "lab"], "updated": "2026-08-05", "body": "<p>A movable sun, authored dawn/noon/dusk/night/storm palettes, one storm envelope tying surface to subsurface — plus an in-game lab to scrub time and tune it all live.</p>\n<h3>Detail</h3>\n<p>Spec: docs/superpowers/specs/2026-08-05-weather-light-lab-design.md (approved).</p>\n<p>Michael&#x27;s finding: surface and subsurface don&#x27;t match and aren&#x27;t dynamic — mechanically the sun never moved (<code>config.js</code> <code>SUN_ELEV_DEG</code> was a fixed constant) and day/storm were brightness scalars.</p>\n<ul>\n<li>Sun authority: <code>config.js</code> <code>SUN</code> + <code>setSun</code> (air dir, Snell-clamped water dir, god-ray proj). Consumers read per frame — <code>lighting.js</code> key/shadow cam, <code>water.js</code> sky/glitter/shafts, <code>terrain.js</code> caustics.</li>\n<li>Palette: five authored stops (night/dawn/noon/dusk/storm); noon at storm 0 must stay bit-identical to the shipped look (regression anchor).</li>\n<li>Envelope: weather emits <code>env</code> {sky, sea, below}, below lags ~8s, converges at steady state.</li>\n<li>Lab: <code>?lab</code> flag, scrub/pause/speed on <code>window.weather</code>, knobs, copy-constants block.</li>\n<li>Acceptance: Michael scrubs a full day and a storm in the lab, surface and subsurface read as one weather, and either keeps the authored stops or tunes them to taste in the panel.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — spec approved (&quot;gtg&quot;); sun authority landed in config.js; machinery agent on weather/lighting/water/terrain</li>\n<li>2026-08-05 — machinery shipped: live sun (dawn 12°/-3.4° → noon 58°/26.6° → dusk 12°/56.6°, night floor 8°), five palette stops in config.js GLASS (noon bit-identical to shipped — regression anchor held to 6dp), env {sky,sea,below} storm envelope (parity 0.966 at steady state), god-ray proj + caustics sun now uniforms. game.js wired: swell reads env.sea, storm current reads env.below</li>\n<li>2026-08-05 — lab shipped: ?lab panel (time ring scrubber with pause/1x/4x/16x, storm slider riding the real envelope, GLASS.sun + five-stop color wells, copy-the-constants + reset). Verified: gated load, scrub moves the sun, dawn horizon well round-trips within 8-bit, input containment proven. Michael judges with his own eyes at http://localhost:8777/?lab</li>\n</ul>"}, {"slug": "the-ending", "t": "The ending", "d": "75s rift-threaded ascent, three sleeper passes, the title card.", "tags": ["cinematic"], "updated": "2026-08-05", "body": "<p>75s rift-threaded ascent, three sleeper passes, the title card.</p>\n<h3>Detail</h3>\n<p>Spline threads all three rift bowls (terrain is always present — a straight ascent pops through floors). Now gated once-ever by THE CHART; later completions get the chart-inking beat.</p>\n<h3>Log</h3>\n<ul>\n<li>pre-2026-08-05 — shipped; ending gate updated at de2aacc</li>\n</ul>"}, {"slug": "sky-drama", "t": "SKY & WIND — clouds, fog, moon", "d": "Procedural cumulus that drifts with the wind, marine-layer mornings the sun burns off, real blue noon, storm decks with dark bases, and a big moon with its own glitter path.", "tags": ["sky", "water", "shaders"], "updated": "2026-08-05", "body": "<p>Procedural cumulus that drifts with the wind, marine-layer mornings the sun burns off, real blue noon, storm decks with dark bases, and a big moon with its own glitter path.</p>\n<h3>Detail</h3>\n<p>Builds on the day-hands contract (weather state + GLASS). All in <code>world/water.js</code> sky dome (uCloud stub exists) + an air-side fog regime + <code>lighting.js</code> night.</p>\n<ul>\n<li>FBM cumulus: coverage/thickness from the day&#x27;s hand, drift from wind; sun-lit edges by day, ember undersides at the sunset stop.</li>\n<li>Marine layer: air visibility drops to a few hundred units at a foggy dawn, sun a pale disc, thins from above past the burn-off elevation. UNDERWATER OPTICS UNTOUCHED.</li>\n<li>Noon stop goes real blue (Michael&#x27;s ruling: shipped noon was flat).</li>\n<li>Moon: disc size/brightness/phase from the hand, moon glitter path, lifted full-moon night ambience.</li>\n<li>Sunset drama: leftover broken cloud catches the ember stops — post-storm sunsets go big, clear days stay modest.</li>\n<li>Acceptance: a foggy dawn burns off on scrub; a post-storm sunset visibly outdrames a clear one; big moon reads at night; calm-noon regression anchored except the sanctioned blue.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — cut from the west-coast round; waits on day hands</li>\n<li>2026-08-06 — shipped: FBM cumulus in skyRadiance (coverage/thickness from the hand, wind drift, sun-lit edges, storm deck sd 54.7→26.1 flat), marine layer burning off past fogBurn (underwater at -80 differs 0.025% between fog and clear mornings — untouched), moon disc with terminator + free glitter (7 lights before and after), sanctioned marine-blue noon zenith (B/R 3.44→7.50, blue channel NOT raised — bloom discipline). game.js wired setWeatherHand. Post-storm sunset R-B 18.8→36.7</li>\n</ul>"}, {"slug": "sky-day-hands", "t": "SKY & WIND — day hands", "d": "Each 12-minute day draws a seeded hand — fog morning or clear, storm dice, cloud regime, sunset drama, moon — so no two days repeat. Wind becomes a first-class weather output.", "tags": ["weather", "sky"], "updated": "2026-08-05", "body": "<p>Each 12-minute day draws a seeded hand — fog morning or clear, storm dice, cloud regime, sunset drama, moon — so no two days repeat. Wind becomes a first-class weather output.</p>\n<h3>Detail</h3>\n<p>Michael&#x27;s target: west-coast marine days — &quot;Early morning fog, sun burns the fog off. pop up ocean storm, clearing weather into a big beautiful sunset, big night time moon. This is not a rinse and repeat every day.&quot;</p>\n<ul>\n<li><code>systems/weather.js</code> — per-day hand from a day-index-seeded mulberry32 stream (pure function of t; replays identically, day 3 differs from day 4): fogDense/fogBurnHour, cloudRegime, storm dice (most days NONE — the squall is an event), sunsetDrama (fed by post-storm clearing), moonK/phase.</li>\n<li>Wind: <code>wind {speed, dir}</code> in the state — leads storms, gusts, calms overnight, direction drifts; a storm locks it.</li>\n<li>Consumers read the hand via the state object + GLASS; contract lands before the sky/water agents build on it.</li>\n<li>Acceptance: state exposes hand + wind; two consecutive days provably differ; storm days are a minority; deterministic replay holds.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — round approved after Michael&#x27;s lab verdict (flat range); cards cut, contract first</li>\n<li>2026-08-06 — shipped: hand {fog, fogBurn, clouds, cloudTex, stormDay/At/Len/Peak, sunsetDrama, moonK, moonPhase, windBase, windDir0, windLead} dealt per dayIndex; wind {speed, dir} leads storms by 60-90s and locks dir mid-storm; storms 33.00f 200 sampled days, post-storm sunsets average drama 0.772 vs 0.360; deterministic across reloads; env parity 1.0000. Dev: weather.day(n)/peek(n)/hand()/wind()</li>\n</ul>"}, {"slug": "silt-line-far-field", "t": "THE SILT LINE + far field", "d": "Stratified column, rising is the reveal; W2 rampart ridgeline; basin bit-identity proven.", "tags": ["water", "terrain"], "updated": "2026-08-05", "body": "<p>Stratified column, rising is the reveal; W2 rampart ridgeline; basin bit-identity proven.</p>\n<h3>Detail</h3>\n<p>rho(y) with saturated nepheloid; exact antiderivative in the fog chunk. W2: HALF 390-&gt;560, azimuthal rim warp, rampart at 340/410/540. Physics: brightness cannot buy distance (log scaling).</p>\n<h3>Log</h3>\n<ul>\n<li>pre-2026-08-05 — shipped across the far-field rounds</li>\n</ul>"}, {"slug": "sea-window", "t": "The sea became a window", "d": "Screen-space refraction both ways; Beer-Lambert absorption free via the global fog; temporal half-rate pass.", "tags": ["water"], "updated": "2026-08-05", "body": "<p>Screen-space refraction both ways; Beer-Lambert absorption free via the global fog; temporal half-rate pass.</p>\n<h3>Detail</h3>\n<p>No depth texture needed — the height-integrated fog pre-attenuates the far-side render. Hysteresis on side selection (swell flip-flop showed the wrong world). Hard-clamped distortion. Half-rate temporal (draw-call submission was the real cost, not pixels).</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (53376e8 + 87c5dbb + c70151e)</li>\n</ul>"}, {"slug": "raft-place", "t": "The raft became a place", "d": "Five-builder dive tender: hull, dressing station, gear, davit, pump; 44-row deck; sun at 58 degrees; raft-only shadows.", "tags": ["raft"], "updated": "2026-08-05", "body": "<p>Five-builder dive tender: hull, dressing station, gear, davit, pump; 44-row deck; sun at 58 degrees; raft-only shadows.</p>\n<h3>Detail</h3>\n<p>Board width was the deck (8 metre-wide slabs -&gt; 44 weathered rows). In-air lighting regime split from the underwater STOPS table. SUN_ELEV_DEG shared constant ended the 77-degree accident. ~10 draw calls, 36k tris.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (bb6e78a)</li>\n</ul>"}, {"slug": "quality-ladder", "t": "Quality ladder", "d": "Degrade sheds transparency LAST: quarter target, volumetrics/AO/sun-shadow, then full shed.", "tags": ["perf"], "updated": "2026-08-05", "body": "<p>Degrade sheds transparency LAST: quarter target, volumetrics/AO/sun-shadow, then full shed.</p>\n<h3>Detail</h3>\n<p>Each rung needs its own 4 sustained seconds under 34fps. window.__perf.stage() reports the rung. Tier 2 measured: 26.2 -&gt; 18.0 ms in-pane with the sea still a window.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (078200b + c70151e)</li>\n</ul>"}, {"slug": "predators-tools-weather", "t": "Predators + tools + weather", "d": "Shark FSM, octopus dens, squid ink economy; sonar, spear, thruster, knife; day cycle and storms.", "tags": ["systems"], "updated": "2026-08-05", "body": "<p>Shark FSM, octopus dens, squid ink economy; sonar, spear, thruster, knife; day cycle and storms.</p>\n<h3>Detail</h3>\n<p>Rounds 2-4 of the original plan. Ink counters shark charges; relics discovered in wrecks; deterministic 12-minute weather with storm pump-sputter.</p>\n<h3>Log</h3>\n<ul>\n<li>pre-2026-08-05 — shipped in earlier sessions</li>\n</ul>"}, {"slug": "honest-floor-light", "t": "Honest floor light", "d": "Caustics coloured by albedo and shaded by the normal; the volumetric march gained its missing density term.", "tags": ["light"], "updated": "2026-08-05", "body": "<p>Caustics coloured by albedo and shaded by the normal; the volumetric march gained its missing density term.</p>\n<h3>Detail</h3>\n<p>Caustics: partially-normalised albedo (raw albedo killed them on 0.05 rock — &#x27;only sand has that effect&#x27;). Chroma split cut from 0.35u to cm. Sun/storm gated.</p>\n<p>Volumetrics: source term had no sigma_s — linear blowup along the silt line&#x27;s clear paths; density factor + squared shared depth curve (march and billboards together).</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (87ccea5, 9c80a23)</li>\n</ul>"}, {"slug": "helmet-glb", "t": "Mark V helmet .glb", "d": "Wired and waiting. Needs your Sketchfab login to download the CC-BY model.", "tags": ["user action"], "updated": "2026-08-05", "body": "<p>Wired and waiting. Needs your Sketchfab login to download the CC-BY model.</p>\n<h3>Detail</h3>\n<p><code>entities/helmetSwap.js</code> mounts <code>assets/models/markv_helmet/helmet.glb</code> if present; silently absent otherwise.</p>\n<p><code>window.__helm</code> adjusts fit once mounted. CREDITS.md line already reserved.</p>\n<ul>\n<li>Acceptance: helmet.glb present in assets/models/markv_helmet/, mounted by helmetSwap, fit approved via __helm.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried; user download pending</li>\n<li>2026-08-07 — RETIRED by Michael&#x27;s hard rule (&quot;all assets must be generated by you&quot;): no external models, ever. The generated helmet is now part of the SAL round. helmetSwap.js mount point stays (it can mount a generated helmet just as well).</li>\n</ul>"}, {"slug": "glass-lab-v2", "t": "THE GLASS lab v2 — day hands + wind knobs", "d": "The lab learns the new vocabulary: today's hand on display, a reroll button to audition days, and knobs for wind, clouds, fog, and moon.", "tags": ["lab"], "updated": "2026-08-05", "body": "<p>The lab learns the new vocabulary: today&#x27;s hand on display, a reroll button to audition days, and knobs for wind, clouds, fog, and moon.</p>\n<h3>Detail</h3>\n<p><code>ui/lab.js</code> only. Mechanical spec once the machinery cards land: day-hand readout (fog/storm/clouds/sunset/moon), REROLL (&quot;deal me a foggy morning&quot; — jump day index), wind speed/dir override, cloud coverage/thickness, whitecap threshold, fog density/burn-off.</p>\n<ul>\n<li>Acceptance: Michael can deal days until he sees a foggy morning and a storm day without waiting through cycles; every new knob writes live.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — cut from the west-coast round; last, cheapest (mechanical spec)</li>\n<li>2026-08-06 — shipped: TODAY&#x27;S HAND readout + PREV/NEXT DAY + REROLL filter (any/foggy/storm/clear/big-moon, peek-scan capped at 60 days — foggy landed day 2 fog 0.865 in test), wind override dial with eased-vs-target readout, knob groups for GLASS cloud/fog/moon/windwater, RESET + COPY extended. Verified live: all four groups present, reroll works, plain load stays clean</li>\n</ul>"}, {"slug": "chart-v2-sonar-soundings", "t": "Chart V2: sonar soundings", "d": "The sounding set reveals new anchorages on the paper — the flagship V2 hook.", "tags": ["chart", "v2"], "updated": "2026-08-05", "body": "<p>The sounding set reveals new anchorages on the paper — the flagship V2 hook.</p>\n<h3>Detail</h3>\n<p>New site rows stay hidden until sonar-discovered; the chart gains blank water with a pencil question mark.</p>\n<p>Needs: hidden flag per site row, discovery event from sonarPing, chart redraw.</p>\n<ul>\n<li>Acceptance: A hidden site discovered by sonar appears on the paper and is sailable; undiscovered sites unreachable.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — from the design panel&#x27;s V2 list</li>\n<li>2026-08-05 — V2 round started; orchestrator wired contracts (site.js 4th hidden site, game.js found/keeps persistence), agents on keepsakes + creatures</li>\n<li>2026-08-05 — shipped: 4th hidden site THE UNSOUNDED SHELF in site.js; sonar ping from zone 2 discovers it once-ever (&quot;A FAR RETURN...&quot;); chart shows a pencil &quot;?&quot; until then, and the discovered anchorage renders in Sal&#x27;s pencil, not ink. Persisted in the save (found[]). Verified: real T-path discovery, terrain hash differs at site 3, site-0 round trip identical</li>\n</ul>"}, {"slug": "chart-v2-keepsakes", "t": "Chart V2: keepsakes shelf", "d": "Physical keepsake props on the raft; each remote wreck carries one line of the previous owner.", "tags": ["chart", "v2"], "updated": "2026-08-05", "body": "<p>Physical keepsake props on the raft; each remote wreck carries one line of the previous owner.</p>\n<h3>Detail</h3>\n<p>V1 shipped keepsakes as collect-flags only. V2: a shelf prop near the chart table, one object per keepsake, one line of story each.</p>\n<ul>\n<li>Acceptance: Each remote wreck yields a physical keepsake on the raft shelf with one line of the previous owner&#x27;s story.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — from the design panel&#x27;s V2 list</li>\n<li>2026-08-05 — V2 round started; orchestrator wired contracts (site.js 4th hidden site, game.js found/keeps persistence), agents on keepsakes + creatures</li>\n<li>2026-08-05 — shipped: keepsake props at every remote wreck (lib/keepsakes.js shapes, wrecks.js placement/pickup, 9 authored lines), shelf on the port bulwark by the chart table (raft/shelf.js, +0 static draw calls, one dynamic mesh). Real E-path pickup verified, persists, gaps in the row are the record</li>\n</ul>"}, {"slug": "chart-v2-creatures-reseed", "t": "Creatures reseed per site", "d": "Schools and jellies are identical everywhere; V1 deliberately skipped them.", "tags": ["chart", "v2"], "updated": "2026-08-05", "body": "<p>Schools and jellies are identical everywhere; V1 deliberately skipped them.</p>\n<h3>Detail</h3>\n<p>[risk]&#x27;s audit: mid-water Y-band placement means nothing breaks unseeded — it just repeats. Reseed = same pattern as flora (seed streams + dispose/rebuild), lower stakes.</p>\n<ul>\n<li>Acceptance: Schools/jellies differ per site, deterministic per seed, zero recompiles in the reseed soak.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — deliberate V1 cut</li>\n<li>2026-08-05 — V2 round started; orchestrator wired contracts (site.js 4th hidden site, game.js found/keeps persistence), agents on keepsakes + creatures</li>\n<li>2026-08-05 — shipped: creatures layout is a pure function of siteParams(&#x27;creatures&#x27;).rng (kills the last raw Math.random layout); schools/jellies/drifters/sparks re-lay in place per site. Verified: fresh boots identical, per-site hashes differ, 12-voyage soak flat at 353 programs / 148 geometries</li>\n</ul>"}, {"slug": "chart-v1", "t": "THE CHART v1", "d": "Three anchorages, paper chart, voyage, full-world in-place reseed, localStorage memory, authored sleepers, once-only ending rite.", "tags": ["chart"], "updated": "2026-08-05", "body": "<p>Three anchorages, paper chart, voyage, full-world in-place reseed, localStorage memory, authored sleepers, once-only ending rite.</p>\n<h3>Detail</h3>\n<p>Design: 3-designer/3-judge panel, fiction-first won with the realist&#x27;s reseed mechanism grafted in.</p>\n<p>Key files: world/site.js (registry), ui/chartOverlay.js, systems/raft/chart.js, reseed paths in 7 world modules, voyage state in game.js.</p>\n<p>Soak: 20 full-world reseeds — programs constant, zero memory growth, collider identity preserved, site-1 bit-repeatable. Persistence proven by cold reload into Pallid Bank (hash ef14da09).</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped across 353ec26 + de2aacc</li>\n</ul>"}, {"slug": "chart-seed-curation", "t": "THE CHART — seed curation", "d": "Author-tune the two remote sites once flown: terrain offsets, scarcity feel, sleeper rows, epithets.", "tags": ["chart", "phase 5"], "updated": "2026-08-05", "body": "<p>Author-tune the two remote sites once flown: terrain offsets, scarcity feel, sleeper rows, epithets.</p>\n<h3>Detail</h3>\n<p>Waits on the fly-remote-sites card. Levers all in <code>src/world/site.js</code>; every value authored, nothing generated.</p>\n<p>If two sites read too similar, the next knob is parameterising terrain&#x27;s PERM seed per site (deliberately NOT done in V1).</p>\n<ul>\n<li>Acceptance: Both remote sites signed off by Michael as distinct, fair, and worth the sail.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — opened at phase 4 ship (de2aacc)</li>\n<li>2026-08-05 — closed by Michael: &quot;ok seems we can mark chart as done.&quot; The authored site rows stand as shipped; any later tuning is a new card.</li>\n</ul>"}, {"slug": "boiler-room", "t": "The boiler room (zone 1)", "d": "17 black smokers in 4 clusters, plumes, shimmer, ember wayfinding, one shared throat light.", "tags": ["zone 1"], "updated": "2026-08-05", "body": "<p>17 black smokers in 4 clusters, plumes, shimmer, ember wayfinding, one shared throat light.</p>\n<h3>Detail</h3>\n<p>Display lessons recorded in CLAUDE.md: fog-off embers (per-channel fog turned amber teal), halo swells with distance, fire above the rim (the lip depth-tested it away), ONE PointLight ever (light-count changes recompile the scene).</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (cf0b51e)</li>\n</ul>"}, {"slug": "boarding-ladder", "t": "Sal boards by the ladder", "d": "Swim at it and keep swimming; steps inboard over the rail at the top.", "tags": ["raft"], "updated": "2026-08-05", "body": "<p>Swim at it and keep swimming; steps inboard over the rail at the top.</p>\n<h3>Detail</h3>\n<p>He literally could not re-board before (measured: swam clean under the deck). Three hidden blockers: surface backstop erasing the climb, swim thrust sliding him off, rungs outboard of the deck catch.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (ed915f4)</li>\n</ul>"}]}]};
const GLYPH = { decision:'●', wip:'●', next:'○', backlog:'·', done:'✔' };
const board = document.getElementById('board');
const shade = document.getElementById('shade');
const detail = document.getElementById('detail');
document.getElementById('b-title').textContent = DATA.title;
document.getElementById('b-path').textContent = DATA.project;
document.title = DATA.title;

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
const count = k => { const c = DATA.columns.find(c => c.key === k); return c ? c.cards.length : 0; };
const stats = [
  { k:'Cards', v:DATA.n },
  { k:'Needs decision', v:count('decision'), dot:'var(--amber)' },
  { k:'In progress', v:count('wip'), dot:'var(--blue)' },
  { k:'Up next', v:count('next') },
  { k:'Done', v:count('done'), dot:'var(--green)' },
  { k:'Last updated', v:DATA.inked, mono:true },
];
document.getElementById('stats').innerHTML = stats.map(s =>
  '<div class="stat"><div class="k">' + s.k + '</div><div class="v' + (s.mono?' mono':'') + '">'
  + (s.dot ? '<span class="dot" style="color:' + s.dot + '">●</span>' : '') + s.v + '</div></div>').join('');
const doneN = count('done');
document.getElementById('quip').textContent =
  doneN > 0 ? 'You’ve struck through ' + doneN + ' of ' + DATA.n + ' cards. The pencil is winning.' : '';

function openCard(col, c) {
  detail.className = 'on c-' + col.key;
  shade.className = 'on';
  detail.innerHTML = '<button class="close" aria-label="close">esc</button>'
    + '<div class="d-head"><span class="mark">' + (GLYPH[col.key]||'·') + '</span>'
    + '<h2>' + esc(c.t) + '</h2></div>'
    + '<div class="d-meta">' + esc(col.title) + ' &middot; updated ' + esc(c.updated)
    + ' &middot; <span class="mono">roadmap/' + esc(c.slug) + '.md</span></div>'
    + '<div class="d-body">' + c.body + '</div>';
  detail.querySelector('.close').onclick = closeCard;
}
function closeCard(){ detail.className=''; shade.className=''; }
shade.onclick = closeCard;
addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

for (const col of DATA.columns) {
  const el = document.createElement('div');
  el.className = 'col c-' + col.key;
  el.innerHTML = '<div class="col-head"><h2>' + esc(col.title) + '</h2>'
    + '<span class="n">' + col.cards.length + '</span></div>'
    + '<p class="sub">' + esc(col.sub) + '</p>';
  for (const c of col.cards) {
    const card = document.createElement('div');
    card.className = 'card'; card.tabIndex = 0;
    card.innerHTML = '<span class="mark">' + (GLYPH[col.key]||'·') + '</span>'
      + '<h3>' + esc(c.t) + '</h3><p>' + esc(c.d) + '</p>'
      + '<div class="tags">' + c.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>';
    card.onclick = () => openCard(col, c);
    card.onkeydown = e => { if (e.key === 'Enter') openCard(col, c); };
    el.appendChild(card);
  }
  board.appendChild(el);
}
</script>
