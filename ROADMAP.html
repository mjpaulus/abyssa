const DATA = {"title": "ABYSSA — Roadmap", "project": "~/sc/abyssa", "inked": "2026-09-05", "n": 80, "columns": [{"key": "backlog", "title": "Backlog", "sub": "captured, not scheduled", "cards": [{"slug": "ref-surface-relief", "t": "Screen-derivative surface relief", "d": "From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: S.", "tags": ["materials", "reference"], "updated": "2026-09-01", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: S.</p>\n<h3>Detail</h3>\n<p>Study: UnderwaterMaterial.js surfaceNormal() with the resolved = 1-smoothstep(fwidth) guard.</p>\n<p>CHANGE: Cheap scales/pores/strata on flora, rocks and fish from a procedural height, guarded so it never sparkles at distance — where triplanar isn&#x27;t used.</p>"}, {"slug": "ref-lightning-light", "t": "Lightning as a scene light", "d": "From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: S.", "tags": ["weather", "lighting", "reference"], "updated": "2026-09-01", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: S.</p>\n<h3>Detail</h3>\n<p>Study: Lightning.js _grow (recursive midpoint bolts, return-stroke train) and ShadingGLSL lightningContribution (two-slot inverse-square).</p>\n<p>CHANGE: Inject the two strongest bolts as uniforms into sea/raft/terrain through our fog-chunk-style global patch; bolt ribbons as one InstancedBufferGeometry. Today lightning is a flash scalar + underside sheet.</p>"}, {"slug": "ref-gpu-profiler-quality", "t": "GPU timer profiler + median quality loop", "d": "From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: S.", "tags": ["perf", "reference"], "updated": "2026-09-01", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: S.</p>\n<h3>Detail</h3>\n<p>Study: core/GpuProfiler.js (EXT_disjoint_timer_query ring, EMA, gl.finish fallback) and core/Quality.js tick() (median window, wall-time cap, log2 tier shed, cooldowns, UPGRADE path).</p>\n<p>CHANGE: Replace samplePerf&#x27;s one-window fps bar: per-zone GPU timings, outlier-proof median, panic shed by log2(overshoot), and the missing half — climbing back up when headroom appears.</p>"}, {"slug": "ref-fauna-vocabulary", "t": "Fauna vocabulary: loft / blade / limb / gape", "d": "From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: L.", "tags": ["creatures", "geometry", "reference"], "updated": "2026-09-01", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: L.</p>\n<h3>Detail</h3>\n<p>Study: FaunaGeometry.js helpers and the aPart/aPhase/aTissue vertex switch in UnderwaterMaterial.js VERT.</p>\n<p>CHANGE: Cross-section profile lofts with skin noise, fin blades with bulge, Frenet-frame limbs, real MOUTHS (gape: cavity + lip + teeth), per-vertex part id so one vertex shader lags fins behind bodies. Sharks/predators get jaws and gill slits without new draw calls.</p>"}, {"slug": "ref-cloud-selfshadow", "t": "Cloud self-shadow + silhouette erosion", "d": "From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.", "tags": ["sky", "clouds", "reference"], "updated": "2026-09-01", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.</p>\n<h3>Detail</h3>\n<p>Study: Clouds.js heightProfile, powder term, sampleLight octaves, CLOUD_DETAIL_FRAG. NOT a raymarch.</p>\n<p>CHANGE: Per-puff terms for our 480 instanced puffs: shadow each puff by the puffs between it and the sun (CPU), erode edges with a baked 2D worley alpha, height-profile density. Quiet palette compatible.</p>"}, {"slug": "ref-caustics-shadow", "t": "Wave-slope caustics + seabed sun shadow", "d": "From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.", "tags": ["water", "lighting", "reference"], "updated": "2026-09-01", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.</p>\n<h3>Detail</h3>\n<p>Study: UnderwaterMaterial.js caustic() with uCausticSlope displacing the uv; UnderwaterWorld.renderShadow (ortho map re-rendered on move/sun change, 9-tap PCF).</p>\n<p>CHANGE: Feed our Gerstner gradient into the caustic uv so caustics move with the actual waves; one 1024 ortho sun map over the zone-0 floor refreshed every ~18 frames so reef and wrecks cast shadows on sand.</p>"}, {"slug": "ref-auto-exposure", "t": "Auto-exposure (EV100)", "d": "From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.", "tags": ["postfx", "reference"], "updated": "2026-09-01", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.</p>\n<h3>Detail</h3>\n<p>Study: PostFX.js EXPOSURE_FRAG (log-luminance mip chain, asymmetric adaptation speed, -0.5 EV compensation). The single biggest reason their screenshots look composed.</p>\n<p>CHANGE: A 1x1 ping-pong float RT feeding renderer.toneMappingExposure; asymmetric speed; clamp range so the abyss stays dark by design (never brighten the deep past its authored stop). AdaptationPass history: do it as a tiny RT, not a Pass.</p>"}, {"slug": "feedback-doc-batch", "t": "Feedback doc batch", "d": "You keep a notes doc — expect a round of fixes when it lands.", "tags": ["user"], "updated": "2026-08-05", "body": "<p>You keep a notes doc — expect a round of fixes when it lands.</p>\n<h3>Detail</h3>\n<p>Standing intake card. When the doc arrives, split it into cards here and work the round.</p>\n<ul>\n<li>Acceptance: The doc&#x27;s notes are split into cards on this board and the doc is retired.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — standing</li>\n</ul>"}, {"slug": "audio-audit", "t": "Audio audit", "d": "Full mix pass with your ears; the synth engine has never had one.", "tags": ["audio", "user"], "updated": "2026-08-05", "body": "<p>Full mix pass with your ears; the synth engine has never had one.</p>\n<h3>Detail</h3>\n<p>Everything is synthesised in audio.js. Wants: level balance across depth, chime density, drone tuning per zone — a session with you listening.</p>\n<ul>\n<li>Acceptance: Michael signs off the full-depth mix in one sitting; changes land as log lines here.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — long-standing; needs the user present</li>\n</ul>"}]}, {"key": "next", "title": "Up Next", "sub": "agreed, queued", "cards": [{"slug": "flow-lean-style", "t": "The Flow lean (a style between NMS and Flow)", "d": "Michael: \"make a card that finds a style in the middle but leaning towards flow.\" Reference: Flow (2024, Zilbalodis) — real-time-rendered painting: matte, low-detail painted surfaces; naturalistic light + heavy atmosphere doing the work textures don't; colour authored per scene in the shaders (no compositing); documentary camera (long takes, layered handheld, shallow DoF). Our current bar (recent NMS underwater) sits at the glossy-PBR end. The target is the midpoint, leaning Flow: keep our physics (stratified column, real waves, real weather), soften how we PAINT them.", "tags": ["art-direction", "style", "postfx", "materials", "camera"], "updated": "2026-09-05", "body": "<p>Michael: &quot;make a card that finds a style in the middle but leaning towards flow.&quot; Reference: Flow (2024, Zilbalodis) — real-time-rendered painting: matte, low-detail painted surfaces; naturalistic light + heavy atmosphere doing the work textures don&#x27;t; colour authored per scene in the shaders (no compositing); documentary camera (long takes, layered handheld, shallow DoF). Our current bar (recent NMS underwater) sits at the glossy-PBR end. The target is the midpoint, leaning Flow: keep our physics (stratified column, real waves, real weather), soften how we PAINT them.</p>\n<h3>Detail</h3>\n<p>PRINCIPLES (the style in one paragraph): surfaces read as pigment, not plastic — matte first, specular only where it tells a story (wet brass, the glitter path, a jelly&#x27;s rim). Detail is suggested at the edge and dissolved in the middle. Light and haze carry depth; the eye reads form and distance, not micro-texture. Every zone commits to one strong mood colour authored by hand. The camera has a point of view. Never neon — Flow&#x27;s glow is halation on light, not emissive objects.</p>\n<p>THE PASS, in order of leverage (each an A/B behind a GLASS knob so the midpoint is dialable, not a cliff):</p>\n<p>1. MATERIAL RESPONSE — a global &quot;paint&quot; law: raise roughness floors across the generated PBR sets (rocks, terrain triplanar, flora, gardens, fauna, wrecks) so nothing but authored hero metal has a tight specular; clamp metalness on non-metals to 0; pull the new rock/deck normal-map strengths down so relief reads as brushwork not bump. Keep brass/copper/glitter as the exceptions.</p>\n<p>2. EDGE-NOT-MIDDLE DETAIL — the screen-derivative relief and detail normals already fade by footprint; add a mid-tone flattening term (detail contrast scaled by 1 - luminance-in-band) so texture lives in the shadow/edge transitions and dissolves on lit faces. Flow&#x27;s cat: strokes at the silhouette, nothing on the flank.</p>\n<p>3. ATMOSPHERE FORWARD — one stop more haze in every regime than physics says (airK, the nepheloid amps, the lid ring) with a matching lift in halation: bloom threshold lower + wider radius but LOWER intensity, so light blooms softly into haze instead of hot-spotting. Sun/lantern get a halo, objects never glow.</p>\n<p>4. AUTHORED SCENE COLOUR — one committed mood per zone and per weather stop, pushed further than now: gold/apricot on the deck at dusk, mossy teal reef, sulphur-amber boiler room, violet-black abyss. Extend the depth CDL grade (__grade) into a per-zone grade stack with hand-tuned lift/gamma/gain; saturation slightly UP in the mood hue, DOWN everywhere else.</p>\n<p>5. DEPTH OF FIELD WITH INTENT — DoF currently focuses on the diver; add a subject-aware focus (nearest fauna/ward/keepsake in the centre third pulls focus over ~0.6s) and a wider aperture underwater; deck stays sharp.</p>\n<p>6. CAMERA WITH A POINT OF VIEW — the FEEL channel becomes Flow&#x27;s layered handheld: separate standstill / walking / swimming noise layers (4-octave sine on position, look AND roll), mixed by state, plus a slow &quot;interest drift&quot; toward the nearest living thing. Sal&#x27;s gait fenced; this is the lens, not the legs.</p>\n<p>7. SILHOUETTE STROKES — an optional edge treatment on organic things (fur/fin/frond): a thin screen-space rim of darkened, slightly broken alpha (dither) so creatures and plants read as painted at the edge. Gate: must not read as an outline shader.</p>\n<p>8. WATER STAYS PHYSICAL BUT MATTE — keep the spectrum-filtering work; lower the mirror&#x27;s clarity (roughness floor on the reflection) so the sea reads as painted swell not glass, except in the glitter path.</p>\n<p>LIGHTING (Flow&#x27;s, and what to take from it): Zilbalodis lit every shot himself, and the lighting IS the style more than the shaders are. What the stills show — (a) BACKLIGHT FIRST: the key is usually behind or beside the subject, low and warm; characters read as silhouettes with a bright rim and a halo of scattered light (the capybara at sunset), fronts filled softly by haze, never by a hard fill. (b) SOFT, LARGE SOURCES: shadows are broad and feathered, no crisp contact shadows except where the sun is hard; ambient is a sky/haze gradient, not a flat term. (c) TEMPERATURE CONTRAST, not intensity contrast: warm key against cool fill/haze (apricot sun vs teal shadow) carries the depth; values stay compressed, hue does the separation. (d) LIGHT IS VISIBLE: god rays, halation, glow in fog — the medium is always lit, so light reads as a thing in the air/water, not just on surfaces. (e) PER-SHOT AUTHORSHIP: he adjusted material brightness per shot to serve the light — lighting is composition, not simulation.</p>\n<p>For ABYSSA: 9. RIM-LED THREE-POINT — rebalance Sal&#x27;s rig: rim/backlight up (sun above water, the sleeper&#x27;s wards and the lantern below as backlights when behind him), key softened and warmed, fill replaced by haze-scattered ambient so his front never flattens. Fauna and gardens get the same law via the shared vertex-colour/ambient path (rim from the brightest source direction). 10. SHADOW SOFTNESS — since PCFSoft radius is unavailable on our shadow type, widen the sun map&#x27;s PCF kernel (the raft map is tiny, cost is nothing) and lift shadow-side ambient so deck shadows feather like Flow&#x27;s. 11. TEMPERATURE SPLIT PER STOP — every palette stop and STOPS lighting entry gets an explicit warm-key/cool-fill pair; noon-clear included (Flow&#x27;s noon is still warm-vs-cool). 12. THE MEDIUM STAYS LIT — volumetrics + halation tuned as a unit so a low sun through the surface, a ward behind the leviathan, and Sal&#x27;s lantern in silt all read as light in the water first, illumination second.</p>\n<p>GATES: quiet, never neon; the hard rule holds (everything generated); A/B every step against main with GLASS.style.flowLean (0 = today, 1 = full lean) so Michael dials the midpoint by eye; storm walls, silt line, and the deck&#x27;s brass keep their reads. Reference shots to judge against: the cat on the bow (matte painted hull, soft island), the capybara sunset (halation, haze), the underwater cyan sequences.</p>"}]}, {"key": "wip", "title": "In Progress", "sub": "being built now", "cards": [{"slug": "rocks-surface", "t": "Rocks read as stone", "d": "Michael: 'rocks have zero texture.' Boulders/pebbles/hero landmarks are vertexColor-only MeshStandardMaterial blobs.", "tags": ["flora", "textures", "quality"], "updated": "2026-09-04", "body": "<p>Michael: &#x27;rocks have zero texture.&#x27; Boulders/pebbles/hero landmarks are vertexColor-only MeshStandardMaterial blobs.</p>\n<h3>Detail</h3>\n<p>Generated rock map set (strata fbm + worley fissures + grit; a darker fissured deep variant), triplanar via onBeforeCompile (instanced rocks have no usable UVs), screen-derivative relief for walk-up read (reference surfaceNormal with the fwidth-resolved guard), cleavage faces/ledges in rockGeo, wet-sheen roughness. Zone palettes still multiply through. Placement stream untouched — site-0 rock fingerprint must match.</p>\n<h3>Log</h3>\n<p>2026-09-04: Shipped, merged 8af8bc5. Two generated 512² map sets (strata + fissures + grit; darker deep variant; 100 ms boot), triplanar via onBeforeCompile, screen-derivative relief resolved by fwidth, three cleavage planes + bedding terraces in rockGeo (tri counts unchanged), wet Fresnel sheen per zone (0.9/0.4/0.12). Rock placement fingerprint bit-identical; programs flat; fps unchanged. TASTE: zone-2 strata read as regular ribbing at 2u — BANDS/weight in textures.js are the levers. Awaiting Michael&#x27;s eye.</p>"}, {"slug": "procedural-gardens", "t": "Procedural gardens (plant vocabulary)", "d": "Michael: 'we need more procedural plants.' Flora has kelp, reef communities, brain coral, rocks — thin for an NMS-bar reef.", "tags": ["flora", "geometry", "quality"], "updated": "2026-09-04", "body": "<p>Michael: &#x27;we need more procedural plants.&#x27; Flora has kelp, reef communities, brain coral, rocks — thin for an NMS-bar reef.</p>\n<h3>Detail</h3>\n<p>New src/world/gardens.js: sea fans, seagrass beds, staghorn, barrel sponges, anemones (zone 0); tube-worm colonies with retracting plumes at chimney feet, bacterial mats, crinoids (zone 1); sea pens with dim bioluminescent tips, glass sponges, whip corals (zone 2). Instanced, vertex-shader sway on the current, zone-gated, own siteParams(&#x27;gardens&#x27;) stream so flora/rock layouts stay bit-identical, ≤12 draw calls. Reseed step after reseedFlora — ORDER IS CONTRACT.</p>\n<h3>Log</h3>\n<p>2026-09-04: Shipped, merged d9c379a. 12 types, 12 draw calls, ~143k submitted tris at the reef; flora/rock fingerprints proven identical wired vs unwired; layout deterministic across voyages. Reseed sits after reseedVentLife (needs activeVents), still after flora. TASTE: colours pulled toward brass after a first pass read as candy — judge against the reference. TODO: authored gardens seeds in site.js (currently a per-site fallback stream). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "procedural-fauna", "t": "Procedural fauna (animal vocabulary)", "d": "Michael: 'we need more procedural sea life.' The evaluation also asked for an indifferent giant — every large body in sight is the objective.", "tags": ["creatures", "geometry", "quality"], "updated": "2026-09-04", "body": "<p>Michael: &#x27;we need more procedural sea life.&#x27; The evaluation also asked for an indifferent giant — every large body in sight is the objective.</p>\n<h3>Detail</h3>\n<p>New src/world/fauna.js with the reference vocabulary (loft/blade/limb/gape/eyes/photophores, part-id vertex animation, 30Hz steering + interpolation, banking): ray, sea turtle, moray in a crevice, reef crabs, sea stars/urchins (zone 0); blind vent fish, flapjack octopus, giant isopods (zone 1); anglerfish with lure, gulper eel, lanternfish shoal with paired running lights (zone 2). Diver + rock avoidance, rest bouts, no new lights, own siteParams(&#x27;fauna&#x27;) stream, hidden during the rite.</p>\n<h3>Log</h3>\n<p>2026-09-04: Shipped, merged 19df564 (recovered from a rate-limit interruption — the first agent left 1361 uncommitted lines; a finisher secured, rebased, and completed verification). 11 animals on one shared vocabulary program (loft/blade/limb/gape/eyes/photophores; part-id vertex animation: tail wave, wing wave, leg shuffle, jaw hinge, lure sway, umbrella pulse, rigid flipper), 30 Hz steering + interpolation, banking, rock + diver avoidance, rest bouts. 12 draw calls, ~97k tris worst case, programs flat at 219 across zone cycles + voyages, own fauna seeds in site.js, hidden during the rite, __noFauna A/B. Esca dimmed 2.2→1.6. FPS unmeasured (pane hidden) — delta is +6 calls/+65k tris at the reef. Awaiting Michael&#x27;s eye.</p>"}, {"slug": "milky-sea", "t": "The snowfield sea (bright-day milk)", "d": "Michael's screenshot: on a bright overcast day from the deck, the sea read as a snowfield — pale cyan-white, glassy, BRIGHTER than the grey sky it reflected. \"Maybe it's the transparency of the water from the surface.\"", "tags": ["water", "bug", "quality"], "updated": "2026-09-04", "body": "<p>Michael&#x27;s screenshot: on a bright overcast day from the deck, the sea read as a snowfield — pale cyan-white, glassy, BRIGHTER than the grey sky it reflected. &quot;Maybe it&#x27;s the transparency of the water from the surface.&quot;</p>\n<h3>Detail</h3>\n<p>Reproduced (day-4 hand, storm ~0.5, sun 41°) and shown to predate the surface-filtering round (identical on the pre-round build). Elimination: detail normals, glitter, foam accumulator, refraction, SSS each off → still icy; opacity off → paler/see-through; not the storm stack (settled storm 0 also milky under a lid).</p>\n<p>ROOT CAUSE (decomposition with a new uDbg term isolator, __sky.dbg(n)): from deck height the sea mirrors only the lowest ~10° of sky, and that band was ALWAYS the clear-day horizon ring — every palette stop authors hor at 2.4-6x zenith, the cloud deck dissolves into that ring at the horizon (&quot;THE MILKY BAND&quot;), and the fog chunk&#x27;s airlight was the noon ring baked as a literal. Under an overcast the lid overhead was dark while the sea mirrored a bright ring the lid had hidden, then had the same ring stacked on as haze. Measured: horizon sky 0.36, sea just under it 0.41 (brighter than the sky). Fresnel, body, transmission, roughness, SSS were all ≤0.03 — innocent. (Also: &quot;clouds 0.86&quot; in my repro was the hand&#x27;s FOG; and weather.set eases over ~8s — an unsettled storm 0 fooled one toggle.)</p>\n<h3>Log</h3>\n<p>2026-09-04: Fixed, merged 4582be0. uSkyHor (what the dome draws AND the sea mirrors) is pulled toward the lid&#x27;s own underside by lidK = max(ms(cov, lidCov), ms(storm, lidStorm)); the fog chunk got its first uniform (abyssaAir — one shared Float32Array installed on every fogged ShaderLib entry; flag 0 = old bake bit-for-bit) so fog airlight, sea rim, and dome horizon are ONE number = the ring under the lid. Numbers (scene-linear, post bypassed): bright overcast horizon sky/sea-under-horizon 0.36/0.41 → 0.20/0.22 — sea ≤ sky everywhere but the 0-2° slit it mirrors. Calm-noon anchor bit-identical (lidCov starts above day-0 cover). Gale keeps walls/foam, reads darker at the horizon than the shipped bright gale — GLASS.cloud.lidRing (0.10) is Michael&#x27;s lever (0.15 restores more haze). Awaiting Michael&#x27;s eye on the SAME bright day.</p>"}, {"slug": "ref-surface-filtering", "t": "Surface filtering (footprint roughness, aniso detail, GGX glitter)", "d": "From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.", "tags": ["water", "quality", "reference"], "updated": "2026-09-01", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.</p>\n<h3>Detail</h3>\n<p>Study: abyssal-living-deep OceanMesh.js FRAG (fpMajor/fpMinor, mssTotal/lost/alpha, the 3-rotation uRippleTex block), ShadingGLSL ggxD/smithGGXCorrelated, ProceduralTextures RIPPLE_FRAG.</p>\n<p>CHANGE: Baked 1024 ripple normal (fbm+worley, mips+aniso) sampled with textureGrad at three rotated incommensurate scales, faded on pixel FOOTPRINT not distance; GGX roughness = Cox-Munk slope variance (0.003+0.00512U) minus the resolved share; sun glitter as disc-widened GGX with correlated Smith replacing pow(sd,uSunSize). Keeps every piece of our Gerstner/foam/SSS/refraction machinery.</p>\n<h3>Log</h3>\n<p>2026-09-01: Shipped, merged b32eaee. Baked 1024² ripple normal (fbm+worley, seeded, zero files); three rotated textureGrad detail layers faded by pixel FOOTPRINT (no distance term — texture now holds to the horizon); Cox-Munk roughness minus the resolved share → GGX α; sun glitter is a disc-widened GGX × correlated Smith × Fresnel behind GLASS.chop.glitterLegacy (0/1 live A/B) with a soft cap so noon never exceeds today. Finding: the literal reference lobe was invisible at our sun/disc ratio — glitterK 14 + the cap made it read. Verdict: GGX = soft path lengthening toward the horizon; legacy = tighter sparkle column. SKIPPED (honest): crosswind narrowing (needs anisotropic GGX); sky-reflection roughness (our sky is analytic, no env lobe to widen). Awaiting Michael&#x27;s eye — the glitterLegacy knob is his A/B.</p>"}, {"slug": "ref-foam-accumulator", "t": "Foam accumulator with windrows", "d": "From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.", "tags": ["water", "quality", "reference"], "updated": "2026-09-01", "body": "<p>From the abyssal-living-deep reference analysis (emollick, fully procedural — a peer under the hard rule). Technique, not code. Effort: M.</p>\n<h3>Detail</h3>\n<p>Study: OceanFFT.js ASSEMBLE_FRAG (rate injection, decay, bubble channel) and the windFrame/stretch vec2(0.22,1) foam lookup in OceanMesh.js.</p>\n<p>CHANGE: A small world-tiled ping-pong RT (256²) fed by our existing Jacobian/lag fold source at a RATE with exponential decay (equilibrium coverage), advected by wind; mask stretched 0.22:1 along wind for Langmuir streaks; separate slow bubble channel. Ours persists ~4s via lags but never streaks.</p>\n<h3>Log</h3>\n<p>2026-09-01: Shipped inside the surface-filtering round (b32eaee). 2×256² HalfFloat ping-pong (own attachments), fed by our fold source at a RATE with exponential decay, wind-advected, bubble channel; surface sums it onto the instant lag foam, mask stretched 0.22:1 along wind. Measured: gale 12s → 11.6% cover; decays 0.48@3s → 0.02@21s after calm. Windrows read as faint pale streaks 3s after a gust — foamAccK is the lever if too subtle. Awaiting Michael&#x27;s eye.</p>"}, {"slug": "everything-better", "t": "Everything better (the campaign)", "d": "Michael: \"make every detail of this game better all of it.\" Run as a campaign: every actionable card on the board, plus fresh sweeps of the domains never audited. Decisions stay his.", "tags": ["campaign", "quality", "design"], "updated": "2026-09-01", "body": "<p>Michael: &quot;make every detail of this game better all of it.&quot; Run as a campaign: every actionable card on the board, plus fresh sweeps of the domains never audited. Decisions stay his.</p>\n<h3>Detail</h3>\n<p>WAVE 1 (five parallel branches, disjoint files):</p>\n<ul>\n<li>w1-design — the evaluation&#x27;s design/onboarding batch: settle the verb, bearing strip legible, HUD hierarchy, threaten the air (TORN DRESS leak state), shark-bite lantern flicker + light dip, force the rite to day, rift-shut message, hose gate announced at calm.</li>\n<li>w1-story — home mooring seeded with the mariner&#x27;s story (a keepsake at the skiff + three lines in his hand), tool-shaped reasons per zone (Orune&#x27;s wards answer the sonar; Mhor&#x27;s wards are squid-guarded), octopus lantern theft designed and shipped bounded.</li>\n<li>w1-audio — sailing soundscape (hull creak, canvas, water on the strakes), one bell no longer answers everything (a voice per event class), Web Audio engineering audit (node leaks, scheduling, ducking ramps, master compressor), deck bed, __audio dev surface. Levels conservative and knobbed — the ear pass is still Michael&#x27;s.</li>\n<li>w1-world — raft shadow on the sea (surface samples the sun map), marine snow thins in vent warm columns, ladder rung wear where the grip lands, rift bowl floor glow while it wakes.</li>\n<li>w1-audit (read-only) — the never-swept domains: input/interaction, UI/HUD/typography, survival economy on paper, performance/robustness (context loss, error boundaries, tab-hidden), accessibility/options. Feeds WAVE 2.</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: WAVE 1 merged (7d7771d / 5c36aa6 / 8e5726c / eec2480) — 15 cards closed: the seven design cards, both story cards, octopus theft, shark-bite flicker, sailing soundscape, raft shadow on the sea, vent-column snow, ladder wear. The audit of the unswept domains found first-ten-minutes bugs (Ctrl+W closes the tab while venting; keys stick on tab-out; Esc is not a pause; zone 2 is a fuel death by arithmetic; no context-loss handler; crafting never saves) → WAVE 2 (branch w2-integrate) applies wave-1 wiring patches + 15 audit fixes + the coherent economy set. Decision cut: hose-leash-decision. First wave-2 attempt died to a rate limit before starting; relaunched with per-task commits.</p>\n<p>2026-09-01 (wave 2): Merged e2de325 (+ chroma-off under reduced motion). Wiring patches applied (voyage passage, chime kinds, story messages, lantern hold, mark reads, shelf home slot). Audit fixes: C advertised as vent (Ctrl+W no longer closes the tab), keys clear on blur/unlock/transitions, Esc/blur is a real pause (&quot;CLICK TO TAKE THE HELM&quot;), camera probes the leviathan body + hull, pointer-lock hardened, chart swallows keys, key-repeat guard, keepsake/mark prompts, two-slot priority message queue (no more clobbered lines), HUD legible on the daylit deck + scales with the window, save validated + crafting persists, context-loss overlay, frame-loop failure card + safe() around ambient systems, compileAsync boot (world 268 ms, 88 programs 793 ms — measured for the first time), resize coalescing, reduced-motion + flash cap + threat tint + M mute, gamepad. Economy: FUEL_BURN 1/420, O2_REFILL 0.10, sputter cuts supply, HOSE 120/craft, REQ 640/920, respawn 240s, rescue fuel 0.5 — zone-2 floor now reached with 0.786 tank (~5.5 min of pump, was ~2.5). Campaign&#x27;s agent-doable scope COMPLETE. Remaining: Michael&#x27;s eye pass, ears (audio-audit), three decisions (props glTF, skyline fingerprint, hose leash).</p>"}, {"slug": "sal-breathing", "t": "Sal's breath (bubbles + rhythm)", "d": "Michael: \"sals air bubbles and breathing need more realism. Feel to standard.\" Period-correct Mark V breathing made visible.", "tags": ["quality", "sal", "fx"], "updated": "2026-08-26", "body": "<p>Michael: &quot;sals air bubbles and breathing need more realism. Feel to standard.&quot; Period-correct Mark V breathing made visible.</p>\n<h3>Detail</h3>\n<p>Round on branch sal-breath: exhaust BURSTS from the helmet&#x27;s actual valve position on a breath cycle (~4s at rest), not a stream — 1-2 lead bubbles + a small trail per exhale. Cycle rate driven by context: exertion shortens it, low air shallows it toward a panic read near drowning; phase exported for audio to hook later (no sounds added — audio audit is its own eared round). Bubble physics: size-dependent rise, helical wobble, visible expansion on long rises, death INTO the wave surface. More exhaust while ascending fast (expanding air); nothing in air. A subtle shoulder-rise breath motion on the same phase (rigid suit — it reads at the shoulders, not the chest). Budget: ≤1 new draw call, zero per-frame allocation, no new programs. Gait untouched.</p>\n<h3>Log</h3>\n<p>2026-08-26: Shipped, merged b4d465a, pushed. Scout found THREE unsynchronized breath clocks (shoulder oscillator, bubble timer, audio regulator setTimeout) — unified onto one phase driving shoulders, bubbles, AND the regulator sound. Bursts: 1-2 lead bubbles + 7-14 trail per exhale from the real valve anchor; stray leak rare. Cadence law measured live: rest 4.05-4.45s, sustained swim winds down to 2.25s and RECOVERS SLOWLY after (a sprint costs breaths after it ends); low air shortens toward 1.7s and shallows. Physics: size-dependent rise (leads outrun trail), 1/r helical corkscrew, 1.5x expansion over 30u, death into the actual swell. Fast ascents vent extra. Zero new draw calls (reused the instanced mesh, pool 60→96), zero per-frame alloc. window.__breath probe. Awaiting Michael&#x27;s feel check.</p>\n<p>2026-08-26 (feedback round): Michael: &quot;too subtle, no variability, dont disrupt the water surface.&quot; All three fixed, merged 98ddfe2. Presence: leads 2x+ bigger (r 0.11-0.17) with a silvery fresnel rim (emissive-injected — still fogs with depth), pool 200. Character: burst classes (1/4 thin sip, 1/5 heavy dump), ±60% lead size, gulp bubbles with hard wobble (1/8), valve-chatter double spits (1/5), head-yaw column drift, rest cadence 3.2-5.2s with held breaths (~6s then a big release, 1/10); variance collapses to metered under panic. Surface: new surfaceBoil(x,z,strength) hook — ripple rings folded into the wave normals + churning foam lace at the breach, both sides of the interface, ~1.5s decay; zero new draw calls. window.__boil probe. Note for the eye: in daylight air the white lace is partly eaten by near-field haze — the rings carry the read from the deck.</p>"}, {"slug": "aaa-postfx-pass", "t": "AAA postfx pass (HDR pipeline)", "d": "Fresh audit of the post-rework chain against the threejs-postprocessing pack. Engineering came back consistent (no primary/degrade drift, depth discipline upheld, effects merge as intended) — but the headline is structural: the whole chain runs in 8-bit.", "tags": ["quality", "postfx"], "updated": "2026-08-26", "body": "<p>Fresh audit of the post-rework chain against the threejs-postprocessing pack. Engineering came back consistent (no primary/degrade drift, depth discipline upheld, effects merge as intended) — but the headline is structural: the whole chain runs in 8-bit.</p>\n<h3>Detail</h3>\n<p>Findings: (1) composer never requests HalfFloat — bloom blooms tone-mapped 8-bit values instead of HDR energy, the depth grade double-quantizes (banding on the deep gradients), volumetrics hard-clip; (2) shafts added with no tone-map shoulder — clip to flat cyan-white, the &quot;milky&quot; failure the retune was fighting; (3) DoF air-blend breathes at wave frequency in swells; (4) no dither anywhere + grain dies above 0.75 luminance — mid-tone gradients borderline for banding; plus grain 1Hz re-roll tick, FiniteEffect false-safety comment, wrong auto-sort comment, per-frame string building, grade ramp saturating at −650 of −900, unused cheap-volumetrics degrade rung, screen-axis-locked chroma, vent-ember bloom shimmer watch.</p>\n<p>Fix round on branch aaa-postfx2: all twelve, HalfFloat + shaft shoulder judged together by eye, dither invisible-as-texture gate, DoF verified from the deck in a gale, full GL-error regression (P-bypass, resize, degrade ladder).</p>\n<h3>Log</h3>\n<p>2026-08-26: All twelve shipped, merged to main 3118d4a. Chain is HalfFloat end-to-end (no fps cost on this box — 120fps both sizes; marginal-hardware delta unmeasured); shafts get a Reinhard shoulder (intensity 0.85→1.0, lit-not-milky with internal falloff); DoF air-blend lagged — deck-in-gale horizon stable across bob cycles; zero-mean dither kills mid-tone banding (invisible as texture at −200); grain re-roll on golden ratio (no 1Hz tick); new degrade rung keeps cheap god rays alive before full removal; grade ramp extends −650→−900 with a quiet drift; chroma purely radial; comments honest (FiniteEffect scope, no auto-sort); zero-alloc updateGrade. GL regression clean: 6 bypass toggles, resize, all 4 degrade rungs. UNVERIFIED: vent-ember bloom shimmer at zone-1 range (agent could not stage it against hose physics) — check on a real dive; fix would be luminanceSmoothing up, not threshold. Awaiting Michael&#x27;s eye.</p>"}, {"slug": "aaa-geometry-pass", "t": "AAA geometry pass (go hard)", "d": "The deep one — every asset is generated, so geometry IS the art. Michael's call: \"the geometry pass is probably the one to spend most time on for aaa quality. go hard on this one.\" Three parallel domain audits (hero objects / world / life) with explicit license to spend triangles where the camera lives, then implementation branches.", "tags": ["quality", "geometry"], "updated": "2026-08-26", "body": "<p>The deep one — every asset is generated, so geometry IS the art. Michael&#x27;s call: &quot;the geometry pass is probably the one to spend most time on for aaa quality. go hard on this one.&quot; Three parallel domain audits (hero objects / world / life) with explicit license to spend triangles where the camera lives, then implementation branches.</p>\n<h3>Detail</h3>\n<p>Audit axes: engineering (indexing, segment counts vs viewing distance, tangent frames for the new normal maps, dispose/reseed, bounding volumes under deformation) and the AAA heart — silhouette quality: chamfers and castings on the raft&#x27;s hardware, plank edge relief, terrain ridges at the fog wall, wreck hull sheer/camber, anatomical read on every creature (fins, frills, asymmetry, per-instance variety). Budget deltas estimated per proposal and sanity-checked against 60fps.</p>\n<h3>Log</h3>\n<p>2026-08-26: Three audits complete. Headlines: (1) BUG — the trawler&#x27;s six portholes (including its &quot;one light still burning&quot; story beat) are built and never rendered, lost in an unbaked Part; (2) all three zones&#x27; terrain (~500k tris) renders every frame — zone gating saves ~330k/frame and pays for every uplift below several times over; (3) rock scatter culls at 175u while clear-band sightlines reach ~460u — the &quot;empty seabed&quot; feel is the LOD collapsing; (4) vent chimneys are 7-gons at walk-up; trawler plating authored but under-sampled; (5) the raft reads as primitive-assembly at 9u — no plank chamfers, 12-sided drums, strobing 18-seg flywheel; (6) creatures: fish tails are rigid 2-tri fans with no eyes, the shark is a painted body-of-revolution (no depressed snout, no caudal keel), leviathan cross-section aliases its own 7-lobe scallop, jelly frills are painted not shaped. Total plan ≈ +55k tris of detail, net −265k/frame, zero new draw calls/programs. Three implementation branches in flight (aaa-geo-hero / -world / -life).</p>\n<p>DECISION (Michael): terrain skyline redistribution — bending vertex density toward ridge crests fixes the polyline skyline at the fog wall at zero tri cost, but CHANGES the site-0 terrain fingerprint (the bit-identical regression anchor). Re-anchor deliberately, or keep the anchor and live with the faceted skyline?</p>\n<p>2026-08-26 (later): All three branches merged to main (c35c51b hero, 3b5c54f world, 1b15a44 life) and pushed; integrated build clean. Measured: raft 36k→56k tris at −6 draw calls (exhaust instanced); terrain gating −332k tris/frame with 0 visibility violations across the full ending ascent + voyages; site-0 fingerprint bit-identical (35acc2d0 both sides); program count stable. Shipped: chamfered planks + ovolo rail + hex bolts + deck nails, re-lathed drums, smooth flywheel, 44-seg helmet + Mark V hasp, the trawler&#x27;s lost lit porthole, 12-sided lobed chimneys, resolved hull plating, rock cull to real sightlines, wave-3 aliasing fix, shark spade snout/keel/curling tail/flexing pectorals, fish forked tails + eyes + per-fish proportions, leviathan 22-radial + billowing 4-row membranes + crescent gills + calm-fade perf guards, jelly scalloped lagging skirts (zone-distinct via rib counts), squid/octopus arm resolution, crab claw-lift. Awaiting Michael&#x27;s eye; skyline fingerprint decision still open.</p>"}, {"slug": "aaa-animation-pass", "t": "AAA animation pass", "d": "Last of the skill-pack sweeps. Audit verdict: the motion craft is far above baseline (dt-robustness fully clean, phase-integrated beats everywhere, springs stable, fish tails genuinely exploit the new geometry) — the findings are seams BETWEEN systems, not bad motion. Sal's approved gait fenced off throughout.", "tags": ["quality", "animation"], "updated": "2026-08-26", "body": "<p>Last of the skill-pack sweeps. Audit verdict: the motion craft is far above baseline (dt-robustness fully clean, phase-integrated beats everywhere, springs stable, fish tails genuinely exploit the new geometry) — the findings are seams BETWEEN systems, not bad motion. Sal&#x27;s approved gait fenced off throughout.</p>\n<h3>Detail</h3>\n<p>Fix round on branch aaa-anim: (1) the title screen&#x27;s raft is a dead prop — updateRaft never runs before the early return (frozen flywheel, no exhaust, hull ignoring the animated swell); (2) Sal frog-kicks up the ladder — onLadder is read by nothing → ladderF blend with alternating reach; (3) the calming beat snaps agitation 1→0 in one frame → the thrash now drains out over ~2s; (4) ending flythrough passes a dead boiler room and frozen predators; (5) leviathan half-rate rebuild jitters hide vs wards at close range; (6) lunge fires with zero anticipation → eased coil; (7) drowning = 2.5s half-frozen frame → dignified cut; (8) shark fades by shrinking over 63u → 8u band; (9) octopus flees without a jet — arms now answer; (10) jelly cull hysteresis; (11) raft ride ease → framerate-independent exp form; (12) knife sheath-return one frame early; (13) ending surf-beat eases framerate-independent.</p>\n<h3>Log</h3>\n<p>2026-08-26: All thirteen shipped, merged to main d900be6, pushed. Title raft rides the swell (verified two frames apart: hull attitude, lantern swing, exhaust all move); Sal climbs the ladder with alternating overhead reach + tucked knees (0.25s blend; note: onLadder only exists ascending — descent is a swim past, covered by the blend); calming thrash drains over ~2s (wave rate 3.7→1.15 measured); ending flythrough inhabited (vent life ticks, predators hidden at rite start); leviathan half-rate gated past 70u so the vigil never jitters; lunge coils in over 0.4s; drowning is a quiet pull-away instead of a frozen frame; shark fades in the fog wall&#x27;s last 8u at constant size; octopus jets with its arms; jelly cull hysteresis; raft/ending eases framerate-independent; knife sheath swap after the hand arrives. Integrated build console clean. Awaiting Michael&#x27;s eye. THE SKILL-PACK SWEEP IS COMPLETE: shaders, textures, lighting, geometry, postfx, animation.</p>"}, {"slug": "aaa-texture-pass", "t": "AAA texture pass", "d": "Full texture pass against the threejs-textures skill pack. Audit verdict: engineering is clean (all POT, colorSpace discipline correct, reseed dispose correct, ~15-20 MB budget) — the AAA gap is MISSING textures, not broken ones.", "tags": ["quality", "textures"], "updated": "2026-08-25", "body": "<p>Full texture pass against the threejs-textures skill pack. Audit verdict: engineering is clean (all POT, colorSpace discipline correct, reseed dispose correct, ~15-20 MB budget) — the AAA gap is MISSING textures, not broken ones.</p>\n<h3>Detail</h3>\n<p>Ranked gaps: (1) the raft deck — the game&#x27;s most-stared-at surface — has zero texture maps; 44 weathered boards read as painted plastic under the 58° sun. (2) Vent chimneys (zone 1&#x27;s heroes) untextured. (3) Wrecks lack roughness maps (no wet-metal/dry-scab corrosion contrast). (4) Sal&#x27;s brass is 256px at 2u close-up range. (5) No getMaxAnisotropy anywhere — planks/terrain/footprints blur at the grazing angles they&#x27;re always seen at. Plus: glow sprite duplicated in ending.js, leviathan hide non-deterministic per arrival.</p>\n<p>Fix round on branch aaa-tex: procedural grain/scratch map+rough+normal sets via lib/textures.js (diver.js pipeline; texture = structure, vertex weathering = hue, quiet), one shared 256 noise pair reused across chimneys/props/steel, max-aniso helper, 512 metal maps, roughness derived from existing height canvases.</p>\n<h3>Log</h3>\n<p>2026-08-25: Round shipped, merged to main 17ac658. Deck wood/brass/iron get procedural grain + micro-scratch map/rough/normal sets (grayscale multipliers — palette hues and vertex weathering stay authoritative; grain runs with the boards via BoxGeometry face-UV stretch); chimneys + props share one seeded 256 noise pair; wrecks derive roughness from their height canvases (wet-metal vs dry-scab); helmet brass/copper 256→512 with feature counts rescaled; steel/port share copper detail; getMaxAnisotropy wired everywhere (device 16); footfx prints anisotropic; ending glow dedup; leviathan hide now seeded (stable per site). Texture count +16, 6-voyage soak plateaus (no leak). Verified in-pane at all four hero ranges. Awaiting Michael&#x27;s eye.</p>"}, {"slug": "aaa-shader-pass", "t": "AAA shader pass (all shaders)", "d": "Full pass over every shader in the game against the threejs-skills packs, AAA bar. Three parallel audits (life / world / postfx), then three implementation branches. Absorbs the reversed-smoothstep sweep.", "tags": ["bug", "perf", "shaders", "quality"], "updated": "2026-08-25", "body": "<p>Full pass over every shader in the game against the threejs-skills packs, AAA bar. Three parallel audits (life / world / postfx), then three implementation branches. Absorbs the reversed-smoothstep sweep.</p>\n<h3>Detail</h3>\n<p>Audit headlines (2026-08-25):</p>\n<ul>\n<li><b>Eleven dead reversed-smoothsteps confirmed</b> (sweep card knew 10 of the sites; ventlife shrimp flick is new). Art that has NEVER rendered: the entire 48-billboard god-ray system, both marine-snow layers (6,600 points), every fish&#x27;s photophore rows (the whole zone-2 species identity), jelly crown glow + four-lobed inner core, the shark&#x27;s eye/gills/lateral sheen, all brain-coral grooves AND their bioluminescence, shrimp tail-flick.</li>\n<li>Volumetric shafts were tuned against the invisible billboards — joint re-balance owed on resurrection. All resurrected art is un-reviewed: first live render gets re-tuned to the quiet bar.</li>\n<li>Eight more transparent-DoubleSide double-draws (r163 class): jelly trails/drifters (additive = silently 2× brightness), leviathan membranes, boot prints, rift shaft/caustic/rim, sonar + thruster rings.</li>\n<li>Predator culling stale vs the stratified fog (shark pops at 205u while sightlines reach ~420); rift motes have no distance fade (neon points across the basin — house-law violation); spear metal has no envMap (black stick); chimney normal seams; grain applied before SMAA then smoothed away; COLOR_DODGE grain brightens the murk; DoF blurs the deck horizon; no NaN guard before mipmap bloom.</li>\n<li>Worth reviving from the benched cinematic pass: NaN scrub + depth-driven CDL grade (as merged Effects, not Passes).</li>\n</ul>\n<p>DECISION (Michael): props.js loads downloaded glTF models — violates the generated-only hard rule (predates it). Regenerate props procedurally, or exempt?</p>\n<h3>Log</h3>\n<p>2026-08-25: All three branches merged to main (e36295d postfx, 3166de7 world, f797037 life) and pushed. Combined verify on main: clean console, god rays + snow + jelly structure confirmed live at 52 m (first render ever). Retunes logged in-code old→new (fish glowI 7.5→1.5 etc., volumetrics 1.05→0.85, uRayFade 0.62→0.42, grain COLOR_DODGE→shadow-weighted, deck DoF air-blended). New knob: __grade.amount (depth CDL, default 0.15). Awaiting Michael&#x27;s eye; props.js glTF decision still open.</p>"}, {"slug": "aaa-lighting-pass", "t": "AAA lighting pass", "d": "Full lighting pass against the threejs-lighting skill pack. Audit verdict: the rig's architecture is genuinely strong (three-point on Sal, STOPS depth grading, disciplined per-frame writes) with ONE real contradiction: the leviathan's per-sigil PointLights break the light-count-stability law the vents module treats as sacred — every zone change recompiles every lit material mid-dive.", "tags": ["quality", "lighting", "perf"], "updated": "2026-08-25", "body": "<p>Full lighting pass against the threejs-lighting skill pack. Audit verdict: the rig&#x27;s architecture is genuinely strong (three-point on Sal, STOPS depth grading, disciplined per-frame writes) with ONE real contradiction: the leviathan&#x27;s per-sigil PointLights break the light-count-stability law the vents module treats as sacred — every zone change recompiles every lit material mid-dive.</p>\n<h3>Detail</h3>\n<p>Fix round on branch aaa-light: (1) boot-time pool of 5 sigil lights, borrowed/returned, light count constant forever; (2) calming-flash spike (+900 at decay 1.8) tamed to physical decay with same close-range read; (3) lantern cube shadow 1024→512 A/B; (4) N8AO radius 2.2→~1.0 A/B — contact grounding, gear seats onto planks; (5) procedural deep-water env for underwater metals (RoomEnvironment softboxes → oceanic gradient; raft keeps sky probe); (6) beacon lamp dims in air; (7) rim light clamped above terrain on vertical descent; (8) sun light.layers idea evaluated and DECLINED (per-render light gathering — layers can&#x27;t scope per-material without recompile risk), documented in-code.</p>\n<p>Backlog seed: LightProbe from the sky PMREM could replace the hand-tuned AIR_SKY/AIR_SEA ambient with sunset-correct SH for the deck at dusk (+1 permanent light, added at boot only).</p>\n<h3>Log</h3>\n<p>2026-08-25: Shipped, merged to main 3e4f12e. Sigil pool: light count probe-constant at 14 across two zone cycles AND a full voyage; program count flat after first visits (the mid-dive recompile hitch is gone). Flash 900→360 at decay 2.0 (close-up blaze intact, scene splash gone). Lantern shadow 512 won the A/B (no stair-stepping in murk at 34u). N8AO 2.2/2.6→1.0/3.0 — gear seats onto the planks. New envTexDeep (procedural teal-to-black PMREM) for wrecks/props/flora/tools/tether/leviathan; raft+diver keep the sky path. Beacon dims in air; rim clamped on descent; layers idea declined in-code. TASTE CALL for Michael: lit wards read slightly tighter at long range under physical decay — judge on next dive. Integrated build console clean.</p>"}, {"slug": "water-inkwell-ideas", "t": "Surface water bar (inkwell + poseidon)", "d": "Harvest the ideas (not the code) that make the inkwell WebGPU ocean read so well, as bounded passes on our own WebGL surface: physically-derived foam, wind-shaped glitter, capillary detail, backlit crests.", "tags": ["water", "reference"], "updated": "2026-08-16", "body": "<p>Harvest the ideas (not the code) that make the inkwell WebGPU ocean read so well, as bounded passes on our own WebGL surface: physically-derived foam, wind-shaped glitter, capillary detail, backlit crests.</p>\n<h3>Detail</h3>\n<p>Reference: https://github.com/siliconjungle/inkwell-webgpu-water (MIT). Michael&#x27;s read: &quot;the result was amazing&quot; — full adoption declined (raw WebGPU, no three.js, ~6.8ms GPU, standalone app; would require the WebGPU optics rewrite we ruled out at the r184 upgrade). What actually makes it look right, in rough order of payoff for us:</p>\n<ul>\n<li><b>Jacobian foam</b>: foam where the surface COMPRESSES (the Jacobian of the horizontal displacement), not where it is tall. Our <code>water.js</code> <code>waveSum</code> is analytic so its derivatives are too — true compression is a few extra ops in the fragment shader. Replaces/augments the height-led whitecap gate; foam would track breaking crests through their whole life instead of flashing on peaks.</li>\n<li><b>Cox-Munk glitter</b>: the sun/moon glitter path widens across-wind and tightens along-wind as wind rises (closed-form slope-distribution BRDF, small change in the existing glitter term). One more place the wind becomes visible.</li>\n<li><b>Capillary cascade</b>: a third, very high-frequency normal-only detail layer scaled by wind — the fine &quot;skin&quot; texture that sells their close-ups. Normal perturbation only, no displacement, so localSurfaceY/tether/refraction are untouched.</li>\n<li><b>Backlit crest translucency</b> (&quot;low-energy volume scattering&quot;): when the sun is low and behind a wave, thin crest tops glow green-through. A cheap view/sun/crest-height term; biggest payoff at dawn/dusk, which is where our new days live.</li>\n</ul>\n<p>Constraints as always: no new render targets, bloom discipline, calm-noon anchor, CPU height mirror agreement for anything that displaces.</p>\n<ul>\n<li>Acceptance: each idea lands as its own small verified pass; Michael judges against the inkwell demo&#x27;s feel, knowing ours is a different (quieter) sea.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-07 — evaluated the repo at Michael&#x27;s ask; adoption declined, ideas harvested (&quot;add to backlog... if you have some ideas to push closer to it&quot;)</li>\n<li>2026-08-07 — second reference: https://github.com/owenyuwono/poseidon (&quot;This is amazing&quot; — Michael, with a storm screenshot). Same wall: WebGPU-only Tessendorf FFT, TSL, no WebGL fallback. NEW harvest from his screenshot: (1) CHOPPY horizontal displacement — steep-fronted waves from crowding vertices toward crests (Gerstner-style term on our analytic field; the CPU height mirror in water.js surfaceHeightAt MUST mirror it or the raft/camera/refraction part ways with the mesh); (2) TEXTURED foam with build/decay off the Jacobian (fold-born, lingering, streaking — upgrades the flat whitecap term); (3) foam texture procedural per the all-generated rule. Plan when Michael returns to surface water: the WebGL &quot;poseidon look&quot; pass first (~70% of the screenshot), then, if his eye wants the true spectrum motion, the WebGPU migration becomes a named project-defining decision.</li>\n<li>2026-08-07 — round started (Michael: &quot;go ahead and start surface water bar while I test sal changes&quot;); agent in an isolated worktree so his live test tree stays stable</li>\n<li>2026-08-16 — WebGL &quot;poseidon look&quot; pass SHIPPED on branch <code>surface-water-bar</code> (1f8ab9b), all four pieces in <code>src/world/water.js</code> + a new <code>GLASS.chop</code> block in config.js. (1) Gerstner horizontal displacement per component, gated on <code>k * max(smoothstep(storm,0,0.9), wind)</code> so calm windless is bit-identical. The CPU mirror became an INVERSE problem and is solved by fixed point (up to 4 iterations, early out); measured residual at full chop max 0.032 u / RMS 0.0035 u against a 4.31 u horizontal displacement. New varying <code>vP0</code> carries the parameter point to the fragment shader; the world gradient is <code>(I+J)^-1 grad_p h</code>. (2) Jacobian foam with build/decay and NO render target — a Gerstner field is Lagrangian, so <code>sin(q - w*tau)</code> off the sin/cos already in hand answers &quot;did THIS parcel fold recently&quot; exactly, three lagged samples at one float each. (3) Three-octave procedural foam texture, wind-advected and wind-stretched, absorbing the wind round&#x27;s height-led whitecap; 0.26 clamp kept, foam never blooms. (4) Backlit crest scatter — dusk lights 3.4% of frame at +18 green, noon and night exactly zero pixels. Calm anchor: localSurfaceY maxAbsDiff 0 over 1600 points, frame max 1 code value. Perf +0.20 ms median at deck-in-gale (budget 0.5). 60 s soak flat.</li>\n<li>2026-08-16 — TWO THINGS NEED MICHAEL&#x27;S EYE. (a) <code>GLASS.chop.streakLegacy</code> (default 1.0 = shipped): the OLD wind-streak block paints straight unbroken bands along a fixed 20-degree bearing whether or not the water is folding, and from height in a gale it now reads as corduroy under the new fold-born lace. 0 hands the gale entirely to the Jacobian foam. (b) <code>GLASS.chop.k</code> (1.55): the steepness dial. Deck-wash was measured over 45 frames at k = 0/0.8/1.2/1.55/2.0 and does NOT rise with chop (1.5-1.9% of the deck region either way), so the open <code>gale-crests-deck</code> decision is not made worse — but the taste of how steep this sea should be is his.</li>\n</ul>\n<ul>\n<li>2026-08-08 — merged (c79feaf) + THE MISSING PIECE found by Michael&#x27;s &quot;still dont see the improved water&quot;: at storm 1 the new 2.5u waves rolled THROUGH the raft (its bob was a decorative ±0.32 sine) and buried the standing camera inside the wave. The raft now RIDES surfaceHeightAt (center/bow/beam average, 0.35s ease, pitch/roll from differentials) — deck stays above the sea and the storm is something you WATCH from it. Verified: noon gale from deck, camera dry, foam field visible to horizon</li>\n<li>2026-08-08 — reopened by Michael against the poseidon reference: &quot;not seeing the surface quality I was expecting.&quot; Gap re-diagnosed as LIGHT not mechanics: (1) broad-body SSS — the reference&#x27;s luminous teal lives across whole wave flanks (sun scattered through the upper mass), ours only rims backlit crests at dusk; (2) our storm STOP desaturates to slate by design, fighting the reference&#x27;s BRIGHT sunlit storm — desat must key off darkness, not storm, so a noon gale stays vivid and a night gale stays dread; (3) storm swell scale up now that the raft rides the field. Luminous-sea pass launched</li>\n<li>2026-08-08 — luminous-sea merged (with the orchestrator&#x27;s live-experiment correction: the grey wall was FOUR stacked dimmers — reflected slate storm sky, dark cloud lid, un-gated irradiance cut, un-gated lighting cut — not airFog, which measures 0 in a clear gale). Shipped: broad-body SSS (hue derived from the water&#x27;s own spectrum), a second authored stormDay stop cross-faded by solar height (night gale bit-identical BY CONSTRUCTION), the day gate on lighting&#x27;s storm cut (15.75% at noon, shipped 45% at night), gale swells 1.56x, bloom held to clear-noon levels (42.9%). HONEST REMAINING GAP vs the reference: ours is a bright overcast gale; the reference is a sunlit storm with a hole in the cloud — covStorm 0.30 closes the sky completely, so the sun never breaks through. That breakup is the next pass if Michael wants the last step</li>\n<li>2026-08-08 — Michael: &quot;closer&quot; + three notes: transparency throwing it off (reference sea is OPAQUE — churned storm water; ours stays a glass window), no BREAKING (whitewater must spill down the front faces), and Sal floats on the OLD flat swell while gale waves roll through him. Sal fix landed by the orchestrator (buoyancy equilibrium + ceiling now ride surfaceHeightAt at his position); storm-opacity + spilling breakers to the agent</li>\n<li>2026-08-08 — opaque-storm merged (7ba056c): THE FOAM WAS NEVER ALIVE on this driver (reversed smoothstep = undefined = 0) — fixed; gale seas now opaque-thick (calm window bit-identical, refraction render skipped at full gale — a storm is cheaper than a calm now), whitewater spills down leading faces. Below-side thickening authored at 0.35 (gameplay over physics — Michael may re-rule). Remaining vs reference: cloud breakup (covStorm) + close-range whitewater texture</li>\n</ul>"}, {"slug": "cloud-vibe-bar", "t": "Clouds to the photo bar", "d": "Michael set the cloud quality bar with a reference photo: dusk marine sky, ragged individual cloud clumps gathered low near the horizon with dark flat undersides, a milky haze band at the waterline, ruthlessly quiet grey-lavender palette.", "tags": ["sky", "taste"], "updated": "2026-08-06", "body": "<p>Michael set the cloud quality bar with a reference photo: dusk marine sky, ragged individual cloud clumps gathered low near the horizon with dark flat undersides, a milky haze band at the waterline, ruthlessly quiet grey-lavender palette.</p>\n<h3>Detail</h3>\n<p>The bar (&quot;the vibe of the clouds. this is the bar&quot;): a dock at dusk — sparse torn cumulus CLUMPS each with its own silhouette (not a modulated field), perspective-compressed into a band low in the sky, zenith nearly empty, bases darker than the sky behind them (backlit), merging into a hazy horizon band, calm mirror water. Measurable properties: clump isolation, horizon gathering, dark-base dominance at dawn/dusk ring stops, low chroma.</p>\n<p>Levers: <code>world/water.js</code> <code>skyRadiance</code> cloud block (fbm2 shaping, coverage threshold curve, uCloudDrift), <code>config.js</code> <code>GLASS.cloud</code>.</p>\n<ul>\n<li>Acceptance: side-by-side against the photo&#x27;s four properties at a fair-cumulus dusk; Michael says it hits the vibe.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-06 — bar set by photo; shaping pass launched</li>\n<li>2026-08-06 — shaping pass landed in <code>world/water.js</code> skyRadiance + <code>config.js</code> GLASS.cloud.</li>\n</ul>\n<p>  Four techniques, one per property. (1) CLUMPS: a second, much lower-frequency value-noise</p>\n<p>  blob field gates where cloud may exist, swinging the coverage threshold +/-<code>islAmp</code></p>\n<p>  two-sided (a one-sided penalty just empties the sky — measured 12.9% cover -&gt; 0.7%), plus a</p>\n<p>  high-frequency vn tearing the silhouette. At hand.clouds 0.4 the field went 30 components -&gt;</p>\n<p>  15, mean clump 0.45% -&gt; 0.93% of the sky, isoperimetric ratio 1.76 -&gt; 2.02, at the SAME total</p>\n<p>  cover. (2) HORIZON GATHERING: a view-elevation term on the threshold plus a lowered horizon</p>\n<p>  fade. Cover by band (2-10/10-25/25-45/45-90 deg) inverted from 0.1/8.4/13.1/23.3% to</p>\n<p>  9.1/13.3/17.1/7.7%; zenith cap 24.4% -&gt; 7.5%. The uv clamp became <code>up + 0.10</code> — the old</p>\n<p>  <code>max(up, 0.10)</code> froze the projection below 5.7 deg and stood pale curtains on the waterline.</p>\n<p>  (3) DARK BASES: <code>uCloudBak</code> rises as the sun sinks and pushes the lighting term through</p>\n<p>  pow(k, 2.2)*0.88. Mean cloud radiance / sky radiance at 20 deg: noon 1.07 (inert, lit tops</p>\n<p>  dominate), dusk 1.03 -&gt; 0.90, dawn 0.98 -&gt; 0.86. Bases sit at 0.74x the sky behind them.</p>\n<p>  (4) MILKY BAND: cloud AMOUNT (not colour) is attenuated over the lowest 10.4 deg, so it</p>\n<p>  cannot double-apply with the marine layer&#x27;s airFog. Rendered cloud/sky contrast falls 18.2</p>\n<p>  -&gt; 5.5 code values from the cloud band to the waterline, i.e. to the dither floor.</p>\n<p>  Storm is untouched by construction — every shaping term is storm-scaled to zero (verified</p>\n<p>  live: islAmp 0.20 -&gt; 0.010, rag -&gt; 0.008, zenBias -&gt; 0.013, bak 0) and the deck still</p>\n<p>  flattens dark (sky SD 13.8 at storm 0.91 vs 21.1 fair). Wind drift, ember undersides and</p>\n<p>  the bloom cap all intact. Cost: 2 extra value-noise samples per above-horizon fragment</p>\n<p>  against the 8 already there; below the measurement floor in the pane (28.66 vs 28.60 ms mean).</p>\n<p>  Still needs Michael&#x27;s eye against the photo — that is the acceptance test.</p>\n<ul>\n<li>2026-08-06 — shaping shipped: clump-isolating blob mask (30→15 components at equal cover, clumps 2x bigger, raggedness 1.76→2.02), horizon gathering (zenith 24.4%→7.5%, low band 0.1%→9.1%), dark bases at the day&#x27;s edges (0.86-0.90x the sky, exactly 0 at noon), 10.4° milky merge (contrast 18.2→5.5 into the glint floor). Storm deck and wind drift untouched; cost unresolvable above pane noise. AWAITING MICHAEL&#x27;S EYE vs the photo</li>\n<li>2026-08-06 — Michael: &quot;clouds seem really flat still, no dimension.&quot; Diagnosis: coverage-map shading — no lit/shadow flank per clump. Dimension pass launched: sun-offset density gradient (cheap volumetric illusion), per-clump vertical profile (dark flat base -&gt; domed lit top), sunward cauliflower detail</li>\n<li>2026-08-06 — dimension pass shipped: terminator flank shading off the existing sun gradient (zero added noise samples), threshold-relative height profile (dark base skirt -&gt; domed lit crown), cauliflower relief on lit faces only. Within-clump range 1.6-&gt;2.0 (control region unmoved), sun-side swing +26% and flips with the sun, dusk bases within -5% (no double-darkening), storm deck byte-equivalent on/off, +0.29ms. GLASS.cloud form* knobs. Still awaiting Michael&#x27;s eye vs the photo</li>\n<li>2026-08-07 — OPTION A shipped on r184: world/clouds.js — one InstancedMesh, 16 clusters x 30 soft puffs, dealt per dayIndex, per-puff sun form in the vertex shader (crown 0.96 vs base 0.39, flanks cross when the sun swings), depth-sorted per frame, drifting on the eased wind. PARALLAX IS REAL: near cluster shifts 20.95px vs far 6.24px for a 6-unit camera move — 3.4x differential, the thing no dome can do. Storm hands off to the flat painted deck (GLASS.cloud.dome), fog mornings dissolve clusters, visible refracted through Snell&#x27;s window. +1 draw call. Awaiting Michael&#x27;s eye vs the photo</li>\n</ul>"}]}, {"key": "decision", "title": "Needs Decision", "sub": "blocked on the user's call", "cards": [{"slug": "hose-leash-decision", "t": "The hard hose leash — keep or cut?", "d": "The audit found a hard leash: tether.js clamps player.pos at survival.hose. CLAUDE.md records that you REJECTED leash-clamping (\"never leash-clamp the player\"). Either the doc is stale or the clamp regressed in.", "tags": ["design", "survival", "decision"], "updated": "2026-09-01", "body": "<p>The audit found a hard leash: tether.js clamps player.pos at survival.hose. CLAUDE.md records that you REJECTED leash-clamping (&quot;never leash-clamp the player&quot;). Either the doc is stale or the clamp regressed in.</p>\n<h3>Detail</h3>\n<p>As shipped: at full hose the diver is HELD and (tautness 1 → unsupplied) DRAINS at the same moment. Options: (a) keep the clamp — physical, but contradicts the recorded ruling; (b) soft leash — no clamp, taut line just cuts supply and the drag pulls back (the rejected-clamp version); (c) clamp with give — a 4-6u elastic band then hold. The new HOSE_REQ set (640/920) was chosen to equal floor-diagonal reach so the leash never fires against a sleeper&#x27;s wander regardless. Your ruling; the code is untouched until then.</p>"}, {"slug": "warm-near-field", "t": "Warm near field, zone 0", "d": "Red 2% reach 84 -> 105 units in zone 0. Is the warmth right?", "tags": ["water", "taste"], "updated": "2026-08-05", "body": "<p>Red 2% reach 84 -&gt; 105 units in zone 0. Is the warmth right?</p>\n<h3>Detail</h3>\n<p>Kill switch is three adjacent constants in <code>src/world/water.js</code>: set <code>K_PART</code> equal to <code>K_EXT</code> and <code>SILT_MIX</code>/<code>SILT_GAIN</code> to 0.00/1.00 to revert the warm near field entirely.</p>\n<p>Worth judging NOW: until the samplePerf fix the game silently ran with volumetrics/AO/shadows off — you had never seen full quality.</p>\n<ul>\n<li>Acceptance: Michael rules keep / revert / tune, after seeing zone 0 at full quality; his words go in the log.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried from the silt-line round; still awaiting the call</li>\n</ul>"}, {"slug": "voyage-fade-timing", "t": "Voyage fade timing", "d": "2s fade out, 2.3s at black (reseed), 1.6s return. Judged only by feel, in real time.", "tags": ["chart"], "updated": "2026-08-05", "body": "<p>2s fade out, 2.3s at black (reseed), 1.6s return. Judged only by feel, in real time.</p>\n<h3>Detail</h3>\n<p>Constants live in game.js voyage block (<code>voyageT</code> thresholds 2 / 2.3 / 4.6 / 6.2).</p>\n<p>Sound is currently chain slam at weigh-anchor + bell on arrival.</p>\n<ul>\n<li>Acceptance: Michael sails once at real speed and rules on the three thresholds; retune is minutes.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at phase 4 ship (de2aacc)</li>\n</ul>"}, {"slug": "vent-ember-strength", "t": "Vent ember strength", "d": "The ember halo reads to 90 units — zone 1's wayfinding. Too shy or too loud on a real monitor?", "tags": ["zone 1"], "updated": "2026-08-05", "body": "<p>The ember halo reads to 90 units — zone 1&#x27;s wayfinding. Too shy or too loud on a real monitor?</p>\n<h3>Detail</h3>\n<p><code>src/world/vents.js</code> update loop: far term <code>far * 0.22</code>, near bore-fire <code>near^2 * 0.30</code>, halo swell <code>0.9 + dist * 0.075</code>.</p>\n<p>The vent light gate is linear over 34 units (camera trails the diver by ~10).</p>\n<ul>\n<li>Acceptance: Michael approaches a hot vent from 90 units out at night and rules on the far and near coefficients.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at boiler-room ship (cf0b51e)</li>\n</ul>"}, {"slug": "sleepers-persist-decision", "t": "Sleepers-persist decision", "d": "V1: the chart records history but sleepers re-wake per visit. Keep as ritual, or persist the calm per site?", "tags": ["chart", "design"], "updated": "2026-08-05", "body": "<p>V1: the chart records history but sleepers re-wake per visit. Keep as ritual, or persist the calm per site?</p>\n<h3>Detail</h3>\n<p>Design question, then small build. Persisting needs makeLeviathan to boot calmed (sigils lit, <code>calmed=true</code>) — modest leviathan surgery.</p>\n<p>The ritual reading: the sleepers stir again when you leave; the chart remembers that you HAVE calmed them, the water does not.</p>\n<ul>\n<li>Acceptance: Michael rules ritual (re-wake) or persistence; if persistence, a follow-up card scopes the leviathan boot-calmed work.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — deferred deliberately at phase 4; user call pending</li>\n<li>2026-08-05 — moved next -&gt; decision; the generic columns made it obvious this is blocked on the user, not queued work</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: Evaluation&#x27;s recommended ruling — &quot;ritual, remembered&quot;: sleepers re-wake per visit, but a previously calmed one carries its wards already dim-lit and needs N-1 touches; the water half-remembers. Keeps the ritual, shortens revisits; cost is a calmedBefore bool into the makeLeviathan override. Michael&#x27;s call.</p>"}, {"slug": "pump-audio-level", "t": "Pump audio level", "d": "The synth engine thump is deliberately shy. Does it carry on your speakers?", "tags": ["audio"], "updated": "2026-08-05", "body": "<p>The synth engine thump is deliberately shy. Does it carry on your speakers?</p>\n<h3>Detail</h3>\n<p><code>src/audio.js</code> setPump: ceiling ~0.08 dry-equivalent at point-blank. Raise the 0.30 in pumpBus&#x27;s ramp if it hides.</p>\n<p>The fuel-out die-down is the load-bearing moment: rate stretches naturally, no linear fade.</p>\n<ul>\n<li>Acceptance: Michael stands by the pump and dives once with sound on; the pumpBus ceiling moves or stays.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at pump-audio ship; never heard by anyone yet</li>\n</ul>"}, {"slug": "gale-crests-deck", "t": "Gale crests over the deck", "d": "In a full gale, wave crests overlapping the raft show refracted water, not the deck behind them.", "tags": ["water", "storm"], "updated": "2026-08-05", "body": "<p>In a full gale, wave crests overlapping the raft show refracted water, not the deck behind them.</p>\n<h3>Detail</h3>\n<p>Inherent screen-space refraction limit: geometry above water is not in the underwater target.</p>\n<p>Reads as sea washing the deck — defensible in a storm, but judge in motion.</p>\n<p>Distortion already hard-clamped at 0.035 NDC (unbounded it ghosted a phantom davit leg).</p>\n<p>If unacceptable: fade <code>uRefrK</code> by fragment-to-raft proximity on the air side, at the cost of transparency right at the hull.</p>\n<ul>\n<li>Acceptance: Michael watches a full gale from the deck and rules acceptable-as-sea-washing or fix-by-proximity-fade.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at refraction ship (53376e8)</li>\n</ul>"}, {"slug": "fly-remote-sites", "t": "Fly Pallid Bank + Burned Ground", "d": "Phase 5 of THE CHART: judge both remote skylines, vent clusters, wreck placement with your own eye.", "tags": ["chart", "phase 5"], "updated": "2026-08-05", "body": "<p>Phase 5 of THE CHART: judge both remote skylines, vent clusters, wreck placement with your own eye.</p>\n<h3>Detail</h3>\n<p>Sail via the chart table, or console: <code>__chart.arrive(1)</code> (Pallid) / <code>__chart.arrive(2)</code> (Burned).</p>\n<p>Tuning is one row per site in <code>src/world/site.js</code>: <code>terra.off</code> moves skylines, <code>scarcity</code> moves the economy, <code>sleepers</code> rows carry sigils/hue/epithets.</p>\n<p>Terrain fingerprints if a probe is needed: home 5e6cfe45, Pallid ef14da09 (32x32x3 grid).</p>\n<ul>\n<li>Acceptance: both sites feel like different water, not palette swaps; sleeper rows read harder without being unfair.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at THE CHART v1 ship (de2aacc); awaiting flyover</li>\n</ul>"}, {"slug": "far-ridgeline-read", "t": "Far ridgeline read", "d": "Does the W2 rampart read against the rim? 4.5% vs 13.1% transmittance — measured 2.9x separation, but subtle.", "tags": ["terrain"], "updated": "2026-08-05", "body": "<p>Does the W2 rampart read against the rim? 4.5% vs 13.1% transmittance — measured 2.9x separation, but subtle.</p>\n<h3>Detail</h3>\n<p><code>RAM_H</code> in <code>src/world/terrain.js</code> (currently 66) is the lever if too faint on a real monitor.</p>\n<p>Also of note: the rampart breaches the surface in places — distant &#x27;islands&#x27; on the horizon from the deck. Looks intentional; confirm you like it.</p>\n<ul>\n<li>Acceptance: Michael judges the horizon from mid-water and from the deck; RAM_H moves or stays; islands blessed or cut.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried from W2; islands observation added during the raft round</li>\n</ul>"}, {"slug": "deck-camera-pullin", "t": "Deck camera pull-in", "d": "Camera sits 9 back; the raft is 9.4 wide — deck detail is only ever read from range.", "tags": ["camera"], "updated": "2026-08-05", "body": "<p>Camera sits 9 back; the raft is 9.4 wide — deck detail is only ever read from range.</p>\n<h3>Detail</h3>\n<p>The levers are <code>CAM_BACK</code> and <code>CAM_UP</code> in <code>game.js</code>. Pulling the camera in while <code>player.onDeck</code> is true would change movement feel — explicitly the user&#x27;s call.</p>\n<p>All raft detail work to date was judged at the 9-unit distance.</p>\n<ul>\n<li>Acceptance: A ruling: keep the 9-unit boom everywhere, or a chosen closer distance on deck; then implement and judge live.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried from the raft round (bb6e78a)</li>\n</ul>"}, {"slug": "chart-parchment-look", "t": "Chart parchment on your monitor", "d": "The in-game paper chart: warmth, size, drop shadow, and the one authored margin line.", "tags": ["chart", "ui"], "updated": "2026-08-05", "body": "<p>The in-game paper chart: warmth, size, drop shadow, and the one authored margin line.</p>\n<h3>Detail</h3>\n<p><code>src/ui/chartOverlay.js</code>. Judged fine in the pane; only a real monitor settles it.</p>\n<ul>\n<li>The drop-shadow filter is the first thing to cut if it reads as a floating UI card.</li>\n<li>The margin line WHAT SLEEPS WILL WAKE FOR NOISE is the only authored copy beyond YOU RIDE HERE — delete if it oversteps.</li>\n<li>Check the two conditions lines clear each other at narrow widths.</li>\n</ul>\n<ul>\n<li>Acceptance: Michael judges warmth/size/shadow/margin-line on his monitor; each keeps or changes by his word.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created; overlay verified structurally + visually in pane</li>\n</ul>"}]}, {"key": "done", "title": "Done", "sub": "shipped and verified", "cards": [{"slug": "vent-warm-column-snow-thin", "t": "Thin Marine Snow In Vent Warm Columns", "d": "Marine snow should thin out inside the hydrothermal vents' warm water columns, since rising heated water would carry fewer sinking particles through those columns than the surrounding cold water.", "tags": ["water", "vents", "marine-snow"], "updated": "2026-09-01", "body": "<p>Marine snow should thin out inside the hydrothermal vents&#x27; warm water columns, since rising heated water would carry fewer sinking particles through those columns than the surrounding cold water.</p>\n<h3>Detail</h3>\n<p>Currently the marine snow layers are built without regard to vent shimmer columns, so snow density looks uniform whether or not a column of warm water is passing through it.</p>\n<ul>\n<li>Marine snow layers: <code>src/world/water.js</code> — the <code>snowLayers</code> uniform holders and the snow build inside <code>buildWater</code> (the <code>snow</code> group); per-layer density already driven by <code>uDepth</code> writes in <code>updateWater</code> via <code>murkFrac</code>.</li>\n<li>Vent shimmer columns: <code>src/world/vents.js</code> <code>buildShimmer</code> — the hot-vent positions live in <code>hotVents</code>.</li>\n<li>Likely approach: sample each vent&#x27;s shimmer column position/radius when generating or updating snow particles, and reduce local snow density/opacity within that radius (falloff toward the column&#x27;s edge, not a hard cutoff).</li>\n<li>Acceptance criteria: marine snow visibly and smoothly thins inside each vent&#x27;s warm water column compared to ambient water; no regression to snow density/behavior outside vent fields; no new perf hit large enough to disqualify (spot-check frame time near a vent field).</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "shark-bite-lantern-flicker", "t": "Shark Bite Lantern Flicker + HUD Dip", "d": "When the shark bites Sal, the lantern should flicker and the HUD light meter should visibly dip, so a hit reads as a hit beyond the oxygen loss and camera shake.", "tags": ["predators", "lantern", "hud"], "updated": "2026-09-01", "body": "<p>When the shark bites Sal, the lantern should flicker and the HUD light meter should visibly dip, so a hit reads as a hit beyond the oxygen loss and camera shake.</p>\n<h3>Detail</h3>\n<p>Currently a bite only drains oxygen and shakes the camera — see <code>src/world/predators.js</code> where the strike FSM raises <code>ev.bite</code>, consumed in <code>src/game.js</code>&#x27;s <code>updatePredators</code> event block (<code>pev.bite</code>), which currently only reduces <code>survival.oxygen</code>. There is no lantern or HUD reaction to a bite specifically.</p>\n<p>Levers in <code>src/game.js</code>:</p>\n<ul>\n<li><code>player.light</code> is the light meter value (0–1), read by <code>setLight(player.light)</code> and by <code>$lightfill.style.transform = scaleX(...)</code> for the HUD bar.</li>\n<li><code>lanternLight.intensity</code> is already flicker-driven each frame from <code>player.light</code> and sine terms — a bite could add a transient extra dip/flicker term keyed off a timestamp or a decaying multiplier.</li>\n<li><code>pev.lightSteal</code> already shows the precedent for a predator event draining <code>player.light</code> over time (<code>player.light = Math.max(0, player.light - pev.lightSteal * dt)</code>), so a bite-triggered dip can follow the same pattern: on <code>pev.bite</code>, apply an immediate partial drop to <code>player.light</code> (and/or a short flicker envelope on <code>lanternLight.intensity</code>) that decays back over ~0.5-1s.</li>\n</ul>\n<p>Rejected/undecided: exact magnitude and decay curve not yet designed — needs a quick pass to avoid it reading as a second oxygen penalty rather than a lighting effect.</p>\n<p>Acceptance criteria: on <code>ev.bite</code>/<code>pev.bite</code>, the lantern visibly flickers (extra intensity dip beyond the ambient sine flicker) and <code>$lightfill</code> HUD bar visibly dips and recovers, distinct from and in addition to the existing oxygen-loss and camera-shake feedback.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "sailing-soundscape", "t": "Sailing soundscape", "d": "The voyage has a chain slam and a bell. Wants hull creak, canvas, water on the strakes.", "tags": ["audio", "chart"], "updated": "2026-09-01", "body": "<p>The voyage has a chain slam and a bell. Wants hull creak, canvas, water on the strakes.</p>\n<h3>Detail</h3>\n<p>audio.js one-shots + a 6-second wash keyed to the voyage timeline. All synthesised, house style.</p>\n<ul>\n<li>Acceptance: The voyage carries hull/canvas/water sound end to end with nothing neon; judged by ear.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — noted at phase 4 ship</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "raft-shadow-on-sea", "t": "Raft shadow on the sea", "d": "No dark patch marks the hull from below; wants the surface to receive the sun map.", "tags": ["water"], "updated": "2026-09-01", "body": "<p>No dark patch marks the hull from below; wants the surface to receive the sun map.</p>\n<h3>Detail</h3>\n<p>The sea surface material would need to sample the sun&#x27;s shadow map — receiveShadow on a custom ShaderMaterial means wiring shadow chunks in. Modest but fiddly.</p>\n<ul>\n<li>Acceptance: The hull reads as a dark patch on the water from below in daylight, gone at night and depth.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — noted at the raft round</li>\n</ul>\n<h3>Log</h3>\n<p>2026-09-01: Shipped in campaign wave 1 (merged 7d7771d design / 5c36aa6 story / 8e5726c audio / eec2480 world). Awaiting Michael&#x27;s eye.</p>"}, {"slug": "octopus-lantern-theft", "t": "Octopus Steals Sal's Lantern", "d": "The octopus should sometimes snatch Sal's hand lantern during a grab and drag it back to its den, forcing the p
