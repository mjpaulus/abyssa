<script>
const DATA = {"title": "ABYSSA — Roadmap", "project": "~/sc/abyssa", "inked": "2026-08-05", "n": 36, "columns": [{"key": "backlog", "title": "Backlog", "sub": "captured, not scheduled", "cards": [{"slug": "vent-warm-column-snow-thin", "t": "Thin Marine Snow In Vent Warm Columns", "d": "Marine snow should thin out inside the hydrothermal vents' warm water columns, since rising heated water would carry fewer sinking particles through those columns than the surrounding cold water.", "tags": ["water", "vents", "marine-snow"], "updated": "2026-08-05", "body": "<p>Marine snow should thin out inside the hydrothermal vents&#x27; warm water columns, since rising heated water would carry fewer sinking particles through those columns than the surrounding cold water.</p>\n<h3>Detail</h3>\n<p>Currently the marine snow layers are built without regard to vent shimmer columns, so snow density looks uniform whether or not a column of warm water is passing through it.</p>\n<ul>\n<li>Marine snow layers: <code>src/world/water.js</code> — the <code>snowLayers</code> uniform holders and the snow build inside <code>buildWater</code> (the <code>snow</code> group); per-layer density already driven by <code>uDepth</code> writes in <code>updateWater</code> via <code>murkFrac</code>.</li>\n<li>Vent shimmer columns: <code>src/world/vents.js</code> <code>buildShimmer</code> — the hot-vent positions live in <code>hotVents</code>.</li>\n<li>Likely approach: sample each vent&#x27;s shimmer column position/radius when generating or updating snow particles, and reduce local snow density/opacity within that radius (falloff toward the column&#x27;s edge, not a hard cutoff).</li>\n<li>Acceptance criteria: marine snow visibly and smoothly thins inside each vent&#x27;s warm water column compared to ambient water; no regression to snow density/behavior outside vent fields; no new perf hit large enough to disqualify (spot-check frame time near a vent field).</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created</li>\n</ul>"}, {"slug": "shark-bite-lantern-flicker", "t": "Shark Bite Lantern Flicker + HUD Dip", "d": "When the shark bites Sal, the lantern should flicker and the HUD light meter should visibly dip, so a hit reads as a hit beyond the oxygen loss and camera shake.", "tags": ["predators", "lantern", "hud"], "updated": "2026-08-05", "body": "<p>When the shark bites Sal, the lantern should flicker and the HUD light meter should visibly dip, so a hit reads as a hit beyond the oxygen loss and camera shake.</p>\n<h3>Detail</h3>\n<p>Currently a bite only drains oxygen and shakes the camera — see <code>src/world/predators.js</code> where the strike FSM raises <code>ev.bite</code>, consumed in <code>src/game.js</code>&#x27;s <code>updatePredators</code> event block (<code>pev.bite</code>), which currently only reduces <code>survival.oxygen</code>. There is no lantern or HUD reaction to a bite specifically.</p>\n<p>Levers in <code>src/game.js</code>:</p>\n<ul>\n<li><code>player.light</code> is the light meter value (0–1), read by <code>setLight(player.light)</code> and by <code>$lightfill.style.transform = scaleX(...)</code> for the HUD bar.</li>\n<li><code>lanternLight.intensity</code> is already flicker-driven each frame from <code>player.light</code> and sine terms — a bite could add a transient extra dip/flicker term keyed off a timestamp or a decaying multiplier.</li>\n<li><code>pev.lightSteal</code> already shows the precedent for a predator event draining <code>player.light</code> over time (<code>player.light = Math.max(0, player.light - pev.lightSteal * dt)</code>), so a bite-triggered dip can follow the same pattern: on <code>pev.bite</code>, apply an immediate partial drop to <code>player.light</code> (and/or a short flicker envelope on <code>lanternLight.intensity</code>) that decays back over ~0.5-1s.</li>\n</ul>\n<p>Rejected/undecided: exact magnitude and decay curve not yet designed — needs a quick pass to avoid it reading as a second oxygen penalty rather than a lighting effect.</p>\n<p>Acceptance criteria: on <code>ev.bite</code>/<code>pev.bite</code>, the lantern visibly flickers (extra intensity dip beyond the ambient sine flicker) and <code>$lightfill</code> HUD bar visibly dips and recovers, distinct from and in addition to the existing oxygen-loss and camera-shake feedback.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created</li>\n</ul>"}, {"slug": "rain-from-above", "t": "Rain from above", "d": "The air-side rain lattice read as stamped circles and was muted; needs a stochastic splash field.", "tags": ["water", "storm"], "updated": "2026-08-05", "body": "<p>The air-side rain lattice read as stamped circles and was muted; needs a stochastic splash field.</p>\n<h3>Detail</h3>\n<p>The from-below rain lens is fine and untouched. Air side needs non-lattice splash placement — a separate small system.</p>\n<ul>\n<li>Acceptance: Storm rain from the deck reads as stochastic splashes, no visible lattice, from eye height and from above.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried from the sky round</li>\n</ul>"}, {"slug": "raft-shadow-on-sea", "t": "Raft shadow on the sea", "d": "No dark patch marks the hull from below; wants the surface to receive the sun map.", "tags": ["water"], "updated": "2026-08-05", "body": "<p>No dark patch marks the hull from below; wants the surface to receive the sun map.</p>\n<h3>Detail</h3>\n<p>The sea surface material would need to sample the sun&#x27;s shadow map — receiveShadow on a custom ShaderMaterial means wiring shadow chunks in. Modest but fiddly.</p>\n<ul>\n<li>Acceptance: The hull reads as a dark patch on the water from below in daylight, gone at night and depth.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — noted at the raft round</li>\n</ul>"}, {"slug": "octopus-lantern-theft", "t": "Octopus Steals Sal's Lantern", "d": "The octopus should sometimes snatch Sal's hand lantern during a grab and drag it back to its den, forcing the player to go retrieve it.", "tags": ["octopus", "predators", "light"], "updated": "2026-08-05", "body": "<p>The octopus should sometimes snatch Sal&#x27;s hand lantern during a grab and drag it back to its den, forcing the player to go retrieve it.</p>\n<h3>Detail</h3>\n<p>Idea only, not yet designed or scheduled. There is already a <code>lightSteal</code> event emitted from the octopus grab logic in <code>src/world/predators.js</code>&#x27;s octopus grab handling, and <code>game.js</code> already consumes <code>pev.lightSteal</code> to drain <code>player.light</code>. That existing hookup drains light on steal but does not model the octopus carrying the lantern into its den or give the player a way to get it back — this card is about extending that into a real steal-and-retrieve mechanic.</p>\n<p>Open questions / acceptance criteria (still needs design pass before moving to next):</p>\n<ul>\n<li>What triggers the steal vs. a normal grab (chance? proximity? already-provoked state?)</li>\n<li>Where the octopus&#x27;s den is and how the player locates/reaches it</li>\n<li>What &quot;retrieval&quot; looks like — is the lantern lootable at the den, does the octopus need to be fought/scared off, is there a timer</li>\n<li>How this interacts with the existing light-drain-on-steal behavior — does draining still happen, or does losing the lantern outright override it</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — captured as backlog idea</li>\n</ul>"}, {"slug": "ladder-rung-wear", "t": "Boarding Ladder Rungs Should Show Wear Where Sal Grabs", "d": "The boarding ladder's rungs are bare iron cylinders with only waterline grime. Add\nworn, hand-polished patches where Sal's grip actually lands each climb, so the\nladder reads as used rather than freshly built.", "tags": ["raft", "davit", "detail"], "updated": "2026-08-05", "body": "<p>The boarding ladder&#x27;s rungs are bare iron cylinders with only waterline grime. Add</p>\n<p>worn, hand-polished patches where Sal&#x27;s grip actually lands each climb, so the</p>\n<p>ladder reads as used rather than freshly built.</p>\n<h3>Detail</h3>\n<p>The ladder is built by hand in <code>davit.js</code> <code>buildDavit</code>, in the boarding-ladder block: two side rails plus <code>RUNGS = 9</code> rungs, each placed with</p>\n<p><code>P.put(cyl(...), iron, 0, ry, LZ, 0, 0, Math.PI / 2)</code> and finished with <code>wetGrime()</code></p>\n<p>for the waterline slime band. There is currently no separate &quot;hand wear&quot; treatment —</p>\n<p>only the uniform grime pass.</p>\n<p>The climb itself is <code>player.js</code> <code>updatePlayer</code>, in the <code>player.onLadder</code> block: holding W in the bulwark-gap zone rises Sal up the rung line at</p>\n<p><code>CLIMB_RATE</code> from ladder-foot depth to the deck catch. That logic already knows the</p>\n<p>Y range Sal&#x27;s hands travel through, which is the natural source of &quot;where he grabs.&quot;</p>\n<p>Open questions for whoever picks this up:</p>\n<ul>\n<li>Wear as authored dulled/polished vertex-color patches at fixed rung heights (cheap,</li>\n</ul>\n<p>  static, matches the &quot;weather as boards not as noise&quot; precedent used elsewhere on</p>\n<p>  the raft), vs. wear keyed dynamically off climb usage (more true to the prompt but</p>\n<p>  adds state to track and persist — likely overkill for a cosmetic detail).</p>\n<ul>\n<li>Recommend starting with the static approach: bake brighter/worn iron patches into</li>\n</ul>\n<p>  the rung material in <code>davit.js</code>&#x27;s per-rung loop, roughly where a climbing hand</p>\n<p>  would land relative to rung spacing, using the same <code>Part</code>/<code>weather()</code> idiom</p>\n<p>  (<code>raft/kit.js</code>) rather than inventing a new vertex-paint path.</p>\n<p>Acceptance criteria: rungs show visible burnished/worn patches distinct from the</p>\n<p>grime band, concentrated where a climbing hand would naturally grip; raft draw-call</p>\n<p>count budget (~10 static calls) is not increased; verified in-browser at the ladder</p>\n<p>in daylight and matched against the &quot;recent No Man&#x27;s Sky underwater&quot; quality bar.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created; captured from user request, not yet scheduled.</li>\n</ul>"}, {"slug": "ladder-climb-anim", "t": "Sal climbs hand-over-hand", "d": "Boarding works; the climb is a smooth rise without a rung-grab pose.", "tags": ["animation"], "updated": "2026-08-05", "body": "<p>Boarding works; the climb is a smooth rise without a rung-grab pose.</p>\n<h3>Detail</h3>\n<p>diver.js pose overlay while <code>player.onLadder</code> (already published): arms alternating reach, boots on rungs. Same overlay pattern as the knife slash.</p>\n<ul>\n<li>Acceptance: Climbing reads as hand-over-hand on the rungs from the default camera; no pose pop at grab or dismount.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — noted at the boarding ship (ed915f4)</li>\n</ul>"}, {"slug": "feedback-doc-batch", "t": "Feedback doc batch", "d": "You keep a notes doc — expect a round of fixes when it lands.", "tags": ["user"], "updated": "2026-08-05", "body": "<p>You keep a notes doc — expect a round of fixes when it lands.</p>\n<h3>Detail</h3>\n<p>Standing intake card. When the doc arrives, split it into cards here and work the round.</p>\n<ul>\n<li>Acceptance: The doc&#x27;s notes are split into cards on this board and the doc is retired.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — standing</li>\n</ul>"}, {"slug": "chart-v2-sonar-soundings", "t": "Chart V2: sonar soundings", "d": "The sounding set reveals new anchorages on the paper — the flagship V2 hook.", "tags": ["chart", "v2"], "updated": "2026-08-05", "body": "<p>The sounding set reveals new anchorages on the paper — the flagship V2 hook.</p>\n<h3>Detail</h3>\n<p>New site rows stay hidden until sonar-discovered; the chart gains blank water with a pencil question mark.</p>\n<p>Needs: hidden flag per site row, discovery event from sonarPing, chart redraw.</p>\n<ul>\n<li>Acceptance: A hidden site discovered by sonar appears on the paper and is sailable; undiscovered sites unreachable.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — from the design panel&#x27;s V2 list</li>\n</ul>"}, {"slug": "chart-v2-keepsakes", "t": "Chart V2: keepsakes shelf", "d": "Physical keepsake props on the raft; each remote wreck carries one line of the previous owner.", "tags": ["chart", "v2"], "updated": "2026-08-05", "body": "<p>Physical keepsake props on the raft; each remote wreck carries one line of the previous owner.</p>\n<h3>Detail</h3>\n<p>V1 shipped keepsakes as collect-flags only. V2: a shelf prop near the chart table, one object per keepsake, one line of story each.</p>\n<ul>\n<li>Acceptance: Each remote wreck yields a physical keepsake on the raft shelf with one line of the previous owner&#x27;s story.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — from the design panel&#x27;s V2 list</li>\n</ul>"}, {"slug": "chart-v2-creatures-reseed", "t": "Creatures reseed per site", "d": "Schools and jellies are identical everywhere; V1 deliberately skipped them.", "tags": ["chart", "v2"], "updated": "2026-08-05", "body": "<p>Schools and jellies are identical everywhere; V1 deliberately skipped them.</p>\n<h3>Detail</h3>\n<p>[risk]&#x27;s audit: mid-water Y-band placement means nothing breaks unseeded — it just repeats. Reseed = same pattern as flora (seed streams + dispose/rebuild), lower stakes.</p>\n<ul>\n<li>Acceptance: Schools/jellies differ per site, deterministic per seed, zero recompiles in the reseed soak.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — deliberate V1 cut</li>\n</ul>"}, {"slug": "audio-audit", "t": "Audio audit", "d": "Full mix pass with your ears; the synth engine has never had one.", "tags": ["audio", "user"], "updated": "2026-08-05", "body": "<p>Full mix pass with your ears; the synth engine has never had one.</p>\n<h3>Detail</h3>\n<p>Everything is synthesised in audio.js. Wants: level balance across depth, chime density, drone tuning per zone — a session with you listening.</p>\n<ul>\n<li>Acceptance: Michael signs off the full-depth mix in one sitting; changes land as log lines here.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — long-standing; needs the user present</li>\n</ul>"}]}, {"key": "next", "title": "Up Next", "sub": "agreed, queued", "cards": [{"slug": "sailing-soundscape", "t": "Sailing soundscape", "d": "The voyage has a chain slam and a bell. Wants hull creak, canvas, water on the strakes.", "tags": ["audio", "chart"], "updated": "2026-08-05", "body": "<p>The voyage has a chain slam and a bell. Wants hull creak, canvas, water on the strakes.</p>\n<h3>Detail</h3>\n<p>audio.js one-shots + a 6-second wash keyed to the voyage timeline. All synthesised, house style.</p>\n<ul>\n<li>Acceptance: The voyage carries hull/canvas/water sound end to end with nothing neon; judged by ear.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — noted at phase 4 ship</li>\n</ul>"}, {"slug": "helmet-glb", "t": "Mark V helmet .glb", "d": "Wired and waiting. Needs your Sketchfab login to download the CC-BY model.", "tags": ["user action"], "updated": "2026-08-05", "body": "<p>Wired and waiting. Needs your Sketchfab login to download the CC-BY model.</p>\n<h3>Detail</h3>\n<p><code>entities/helmetSwap.js</code> mounts <code>assets/models/markv_helmet/helmet.glb</code> if present; silently absent otherwise.</p>\n<p><code>window.__helm</code> adjusts fit once mounted. CREDITS.md line already reserved.</p>\n<ul>\n<li>Acceptance: helmet.glb present in assets/models/markv_helmet/, mounted by helmetSwap, fit approved via __helm.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried; user download pending</li>\n</ul>"}]}, {"key": "wip", "title": "In Progress", "sub": "being built now", "cards": [{"slug": "chart-seed-curation", "t": "THE CHART — seed curation", "d": "Author-tune the two remote sites once flown: terrain offsets, scarcity feel, sleeper rows, epithets.", "tags": ["chart", "phase 5"], "updated": "2026-08-05", "body": "<p>Author-tune the two remote sites once flown: terrain offsets, scarcity feel, sleeper rows, epithets.</p>\n<h3>Detail</h3>\n<p>Waits on the fly-remote-sites card. Levers all in <code>src/world/site.js</code>; every value authored, nothing generated.</p>\n<p>If two sites read too similar, the next knob is parameterising terrain&#x27;s PERM seed per site (deliberately NOT done in V1).</p>\n<ul>\n<li>Acceptance: Both remote sites signed off by Michael as distinct, fair, and worth the sail.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — opened at phase 4 ship (de2aacc)</li>\n</ul>"}]}, {"key": "decision", "title": "Needs Decision", "sub": "blocked on the user's call", "cards": [{"slug": "warm-near-field", "t": "Warm near field, zone 0", "d": "Red 2% reach 84 -> 105 units in zone 0. Is the warmth right?", "tags": ["water", "taste"], "updated": "2026-08-05", "body": "<p>Red 2% reach 84 -&gt; 105 units in zone 0. Is the warmth right?</p>\n<h3>Detail</h3>\n<p>Kill switch is three adjacent constants in <code>src/world/water.js</code>: set <code>K_PART</code> equal to <code>K_EXT</code> and <code>SILT_MIX</code>/<code>SILT_GAIN</code> to 0.00/1.00 to revert the warm near field entirely.</p>\n<p>Worth judging NOW: until the samplePerf fix the game silently ran with volumetrics/AO/shadows off — you had never seen full quality.</p>\n<ul>\n<li>Acceptance: Michael rules keep / revert / tune, after seeing zone 0 at full quality; his words go in the log.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried from the silt-line round; still awaiting the call</li>\n</ul>"}, {"slug": "voyage-fade-timing", "t": "Voyage fade timing", "d": "2s fade out, 2.3s at black (reseed), 1.6s return. Judged only by feel, in real time.", "tags": ["chart"], "updated": "2026-08-05", "body": "<p>2s fade out, 2.3s at black (reseed), 1.6s return. Judged only by feel, in real time.</p>\n<h3>Detail</h3>\n<p>Constants live in game.js voyage block (<code>voyageT</code> thresholds 2 / 2.3 / 4.6 / 6.2).</p>\n<p>Sound is currently chain slam at weigh-anchor + bell on arrival.</p>\n<ul>\n<li>Acceptance: Michael sails once at real speed and rules on the three thresholds; retune is minutes.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at phase 4 ship (de2aacc)</li>\n</ul>"}, {"slug": "vent-ember-strength", "t": "Vent ember strength", "d": "The ember halo reads to 90 units — zone 1's wayfinding. Too shy or too loud on a real monitor?", "tags": ["zone 1"], "updated": "2026-08-05", "body": "<p>The ember halo reads to 90 units — zone 1&#x27;s wayfinding. Too shy or too loud on a real monitor?</p>\n<h3>Detail</h3>\n<p><code>src/world/vents.js</code> update loop: far term <code>far * 0.22</code>, near bore-fire <code>near^2 * 0.30</code>, halo swell <code>0.9 + dist * 0.075</code>.</p>\n<p>The vent light gate is linear over 34 units (camera trails the diver by ~10).</p>\n<ul>\n<li>Acceptance: Michael approaches a hot vent from 90 units out at night and rules on the far and near coefficients.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at boiler-room ship (cf0b51e)</li>\n</ul>"}, {"slug": "sleepers-persist-decision", "t": "Sleepers-persist decision", "d": "V1: the chart records history but sleepers re-wake per visit. Keep as ritual, or persist the calm per site?", "tags": ["chart", "design"], "updated": "2026-08-05", "body": "<p>V1: the chart records history but sleepers re-wake per visit. Keep as ritual, or persist the calm per site?</p>\n<h3>Detail</h3>\n<p>Design question, then small build. Persisting needs makeLeviathan to boot calmed (sigils lit, <code>calmed=true</code>) — modest leviathan surgery.</p>\n<p>The ritual reading: the sleepers stir again when you leave; the chart remembers that you HAVE calmed them, the water does not.</p>\n<ul>\n<li>Acceptance: Michael rules ritual (re-wake) or persistence; if persistence, a follow-up card scopes the leviathan boot-calmed work.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — deferred deliberately at phase 4; user call pending</li>\n<li>2026-08-05 — moved next -&gt; decision; the generic columns made it obvious this is blocked on the user, not queued work</li>\n</ul>"}, {"slug": "pump-audio-level", "t": "Pump audio level", "d": "The synth engine thump is deliberately shy. Does it carry on your speakers?", "tags": ["audio"], "updated": "2026-08-05", "body": "<p>The synth engine thump is deliberately shy. Does it carry on your speakers?</p>\n<h3>Detail</h3>\n<p><code>src/audio.js</code> setPump: ceiling ~0.08 dry-equivalent at point-blank. Raise the 0.30 in pumpBus&#x27;s ramp if it hides.</p>\n<p>The fuel-out die-down is the load-bearing moment: rate stretches naturally, no linear fade.</p>\n<ul>\n<li>Acceptance: Michael stands by the pump and dives once with sound on; the pumpBus ceiling moves or stays.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at pump-audio ship; never heard by anyone yet</li>\n</ul>"}, {"slug": "gale-crests-deck", "t": "Gale crests over the deck", "d": "In a full gale, wave crests overlapping the raft show refracted water, not the deck behind them.", "tags": ["water", "storm"], "updated": "2026-08-05", "body": "<p>In a full gale, wave crests overlapping the raft show refracted water, not the deck behind them.</p>\n<h3>Detail</h3>\n<p>Inherent screen-space refraction limit: geometry above water is not in the underwater target.</p>\n<p>Reads as sea washing the deck — defensible in a storm, but judge in motion.</p>\n<p>Distortion already hard-clamped at 0.035 NDC (unbounded it ghosted a phantom davit leg).</p>\n<p>If unacceptable: fade <code>uRefrK</code> by fragment-to-raft proximity on the air side, at the cost of transparency right at the hull.</p>\n<ul>\n<li>Acceptance: Michael watches a full gale from the deck and rules acceptable-as-sea-washing or fix-by-proximity-fade.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at refraction ship (53376e8)</li>\n</ul>"}, {"slug": "fly-remote-sites", "t": "Fly Pallid Bank + Burned Ground", "d": "Phase 5 of THE CHART: judge both remote skylines, vent clusters, wreck placement with your own eye.", "tags": ["chart", "phase 5"], "updated": "2026-08-05", "body": "<p>Phase 5 of THE CHART: judge both remote skylines, vent clusters, wreck placement with your own eye.</p>\n<h3>Detail</h3>\n<p>Sail via the chart table, or console: <code>__chart.arrive(1)</code> (Pallid) / <code>__chart.arrive(2)</code> (Burned).</p>\n<p>Tuning is one row per site in <code>src/world/site.js</code>: <code>terra.off</code> moves skylines, <code>scarcity</code> moves the economy, <code>sleepers</code> rows carry sigils/hue/epithets.</p>\n<p>Terrain fingerprints if a probe is needed: home 5e6cfe45, Pallid ef14da09 (32x32x3 grid).</p>\n<ul>\n<li>Acceptance: both sites feel like different water, not palette swaps; sleeper rows read harder without being unfair.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at THE CHART v1 ship (de2aacc); awaiting flyover</li>\n</ul>"}, {"slug": "far-ridgeline-read", "t": "Far ridgeline read", "d": "Does the W2 rampart read against the rim? 4.5% vs 13.1% transmittance — measured 2.9x separation, but subtle.", "tags": ["terrain"], "updated": "2026-08-05", "body": "<p>Does the W2 rampart read against the rim? 4.5% vs 13.1% transmittance — measured 2.9x separation, but subtle.</p>\n<h3>Detail</h3>\n<p><code>RAM_H</code> in <code>src/world/terrain.js</code> (currently 66) is the lever if too faint on a real monitor.</p>\n<p>Also of note: the rampart breaches the surface in places — distant &#x27;islands&#x27; on the horizon from the deck. Looks intentional; confirm you like it.</p>\n<ul>\n<li>Acceptance: Michael judges the horizon from mid-water and from the deck; RAM_H moves or stays; islands blessed or cut.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried from W2; islands observation added during the raft round</li>\n</ul>"}, {"slug": "deck-camera-pullin", "t": "Deck camera pull-in", "d": "Camera sits 9 back; the raft is 9.4 wide — deck detail is only ever read from range.", "tags": ["camera"], "updated": "2026-08-05", "body": "<p>Camera sits 9 back; the raft is 9.4 wide — deck detail is only ever read from range.</p>\n<h3>Detail</h3>\n<p>The levers are <code>CAM_BACK</code> and <code>CAM_UP</code> in <code>game.js</code>. Pulling the camera in while <code>player.onDeck</code> is true would change movement feel — explicitly the user&#x27;s call.</p>\n<p>All raft detail work to date was judged at the 9-unit distance.</p>\n<ul>\n<li>Acceptance: A ruling: keep the 9-unit boom everywhere, or a chosen closer distance on deck; then implement and judge live.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried from the raft round (bb6e78a)</li>\n</ul>"}, {"slug": "chart-parchment-look", "t": "Chart parchment on your monitor", "d": "The in-game paper chart: warmth, size, drop shadow, and the one authored margin line.", "tags": ["chart", "ui"], "updated": "2026-08-05", "body": "<p>The in-game paper chart: warmth, size, drop shadow, and the one authored margin line.</p>\n<h3>Detail</h3>\n<p><code>src/ui/chartOverlay.js</code>. Judged fine in the pane; only a real monitor settles it.</p>\n<ul>\n<li>The drop-shadow filter is the first thing to cut if it reads as a floating UI card.</li>\n<li>The margin line WHAT SLEEPS WILL WAKE FOR NOISE is the only authored copy beyond YOU RIDE HERE — delete if it oversteps.</li>\n<li>Check the two conditions lines clear each other at narrow widths.</li>\n</ul>\n<ul>\n<li>Acceptance: Michael judges warmth/size/shadow/margin-line on his monitor; each keeps or changes by his word.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created; overlay verified structurally + visually in pane</li>\n</ul>"}]}, {"key": "done", "title": "Done", "sub": "shipped and verified", "cards": [{"slug": "zone1-vent-life", "t": "Zone-1 vent life", "d": "Pale shrimp and crabs swarming the chimneys — the boiler room inhabited, not just built.", "tags": ["zone 1", "creatures"], "updated": "2026-08-05", "body": "<p>Pale shrimp and crabs swarming the chimneys — the boiler room inhabited, not just built.</p>\n<h3>Detail</h3>\n<p>Pattern: creatures.js boid/instancing idioms; swarm anchors at the 12 active chimney positions (vents.js <code>activeVents</code>).</p>\n<p>Tone: pale, small, dense near throats — life that eats the heat. No glow.</p>\n<ul>\n<li>Acceptance: Swarms visible at every active chimney, dense near throats, zero glow, no measurable frame cost at the floor.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — agreed as next after the boiler room shipped</li>\n<li>2026-08-05 — started: <code>activeVents</code> exported from <code>vents.js</code>, contract stub <code>ventlife.js</code> wired into game.js (build/reseed/update), craft agent building the swarms</li>\n<li>2026-08-05 — shipped: <code>world/ventlife.js</code> — two InstancedMeshes (160 shrimp/vent GPU-swirled at the throat, 2 crabs/vent on the crust), all motion in the vertex shader, no glow, fog on, depth-band gate -340/-630. Verified live: 1920 shrimp + 24 crabs across 12 vents, materials stable across 5x reseed, no measurable frame cost at the floor (16.0 vs 16.2 ms median)</li>\n</ul>"}, {"slug": "the-ending", "t": "The ending", "d": "75s rift-threaded ascent, three sleeper passes, the title card.", "tags": ["cinematic"], "updated": "2026-08-05", "body": "<p>75s rift-threaded ascent, three sleeper passes, the title card.</p>\n<h3>Detail</h3>\n<p>Spline threads all three rift bowls (terrain is always present — a straight ascent pops through floors). Now gated once-ever by THE CHART; later completions get the chart-inking beat.</p>\n<h3>Log</h3>\n<ul>\n<li>pre-2026-08-05 — shipped; ending gate updated at de2aacc</li>\n</ul>"}, {"slug": "silt-line-far-field", "t": "THE SILT LINE + far field", "d": "Stratified column, rising is the reveal; W2 rampart ridgeline; basin bit-identity proven.", "tags": ["water", "terrain"], "updated": "2026-08-05", "body": "<p>Stratified column, rising is the reveal; W2 rampart ridgeline; basin bit-identity proven.</p>\n<h3>Detail</h3>\n<p>rho(y) with saturated nepheloid; exact antiderivative in the fog chunk. W2: HALF 390-&gt;560, azimuthal rim warp, rampart at 340/410/540. Physics: brightness cannot buy distance (log scaling).</p>\n<h3>Log</h3>\n<ul>\n<li>pre-2026-08-05 — shipped across the far-field rounds</li>\n</ul>"}, {"slug": "sea-window", "t": "The sea became a window", "d": "Screen-space refraction both ways; Beer-Lambert absorption free via the global fog; temporal half-rate pass.", "tags": ["water"], "updated": "2026-08-05", "body": "<p>Screen-space refraction both ways; Beer-Lambert absorption free via the global fog; temporal half-rate pass.</p>\n<h3>Detail</h3>\n<p>No depth texture needed — the height-integrated fog pre-attenuates the far-side render. Hysteresis on side selection (swell flip-flop showed the wrong world). Hard-clamped distortion. Half-rate temporal (draw-call submission was the real cost, not pixels).</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (53376e8 + 87c5dbb + c70151e)</li>\n</ul>"}, {"slug": "raft-place", "t": "The raft became a place", "d": "Five-builder dive tender: hull, dressing station, gear, davit, pump; 44-row deck; sun at 58 degrees; raft-only shadows.", "tags": ["raft"], "updated": "2026-08-05", "body": "<p>Five-builder dive tender: hull, dressing station, gear, davit, pump; 44-row deck; sun at 58 degrees; raft-only shadows.</p>\n<h3>Detail</h3>\n<p>Board width was the deck (8 metre-wide slabs -&gt; 44 weathered rows). In-air lighting regime split from the underwater STOPS table. SUN_ELEV_DEG shared constant ended the 77-degree accident. ~10 draw calls, 36k tris.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (bb6e78a)</li>\n</ul>"}, {"slug": "quality-ladder", "t": "Quality ladder", "d": "Degrade sheds transparency LAST: quarter target, volumetrics/AO/sun-shadow, then full shed.", "tags": ["perf"], "updated": "2026-08-05", "body": "<p>Degrade sheds transparency LAST: quarter target, volumetrics/AO/sun-shadow, then full shed.</p>\n<h3>Detail</h3>\n<p>Each rung needs its own 4 sustained seconds under 34fps. window.__perf.stage() reports the rung. Tier 2 measured: 26.2 -&gt; 18.0 ms in-pane with the sea still a window.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (078200b + c70151e)</li>\n</ul>"}, {"slug": "predators-tools-weather", "t": "Predators + tools + weather", "d": "Shark FSM, octopus dens, squid ink economy; sonar, spear, thruster, knife; day cycle and storms.", "tags": ["systems"], "updated": "2026-08-05", "body": "<p>Shark FSM, octopus dens, squid ink economy; sonar, spear, thruster, knife; day cycle and storms.</p>\n<h3>Detail</h3>\n<p>Rounds 2-4 of the original plan. Ink counters shark charges; relics discovered in wrecks; deterministic 12-minute weather with storm pump-sputter.</p>\n<h3>Log</h3>\n<ul>\n<li>pre-2026-08-05 — shipped in earlier sessions</li>\n</ul>"}, {"slug": "honest-floor-light", "t": "Honest floor light", "d": "Caustics coloured by albedo and shaded by the normal; the volumetric march gained its missing density term.", "tags": ["light"], "updated": "2026-08-05", "body": "<p>Caustics coloured by albedo and shaded by the normal; the volumetric march gained its missing density term.</p>\n<h3>Detail</h3>\n<p>Caustics: partially-normalised albedo (raw albedo killed them on 0.05 rock — &#x27;only sand has that effect&#x27;). Chroma split cut from 0.35u to cm. Sun/storm gated.</p>\n<p>Volumetrics: source term had no sigma_s — linear blowup along the silt line&#x27;s clear paths; density factor + squared shared depth curve (march and billboards together).</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (87ccea5, 9c80a23)</li>\n</ul>"}, {"slug": "chart-v1", "t": "THE CHART v1", "d": "Three anchorages, paper chart, voyage, full-world in-place reseed, localStorage memory, authored sleepers, once-only ending rite.", "tags": ["chart"], "updated": "2026-08-05", "body": "<p>Three anchorages, paper chart, voyage, full-world in-place reseed, localStorage memory, authored sleepers, once-only ending rite.</p>\n<h3>Detail</h3>\n<p>Design: 3-designer/3-judge panel, fiction-first won with the realist&#x27;s reseed mechanism grafted in.</p>\n<p>Key files: world/site.js (registry), ui/chartOverlay.js, systems/raft/chart.js, reseed paths in 7 world modules, voyage state in game.js.</p>\n<p>Soak: 20 full-world reseeds — programs constant, zero memory growth, collider identity preserved, site-1 bit-repeatable. Persistence proven by cold reload into Pallid Bank (hash ef14da09).</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped across 353ec26 + de2aacc</li>\n</ul>"}, {"slug": "boiler-room", "t": "The boiler room (zone 1)", "d": "17 black smokers in 4 clusters, plumes, shimmer, ember wayfinding, one shared throat light.", "tags": ["zone 1"], "updated": "2026-08-05", "body": "<p>17 black smokers in 4 clusters, plumes, shimmer, ember wayfinding, one shared throat light.</p>\n<h3>Detail</h3>\n<p>Display lessons recorded in CLAUDE.md: fog-off embers (per-channel fog turned amber teal), halo swells with distance, fire above the rim (the lip depth-tested it away), ONE PointLight ever (light-count changes recompile the scene).</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (cf0b51e)</li>\n</ul>"}, {"slug": "boarding-ladder", "t": "Sal boards by the ladder", "d": "Swim at it and keep swimming; steps inboard over the rail at the top.", "tags": ["raft"], "updated": "2026-08-05", "body": "<p>Swim at it and keep swimming; steps inboard over the rail at the top.</p>\n<h3>Detail</h3>\n<p>He literally could not re-board before (measured: swam clean under the deck). Three hidden blockers: surface backstop erasing the climb, swim thrust sliding him off, rungs outboard of the deck catch.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (ed915f4)</li>\n</ul>"}]}]};
const GLYPH = { decision:'●', wip:'●', next:'○', backlog:'·', done:'✔' };
const board = document.getElementById('board');
const shade = document.getElementById('shade');
const detail = document.getElementById('detail');
document.getElementById('b-title').textContent = DATA.title;
document.getElementById('b-path').textContent = DATA.project;
document.title = DATA.title;

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
const count = k => { const c = DATA.columns.find(c => c.key === k); return c ? c.cards.length : 0; };
const stats = [
  { k:'Cards', v:DATA.n },
  { k:'Needs decision', v:count('decision'), dot:'var(--amber)' },
  { k:'In progress', v:count('wip'), dot:'var(--blue)' },
  { k:'Up next', v:count('next') },
  { k:'Done', v:count('done'), dot:'var(--green)' },
  { k:'Last updated', v:DATA.inked, mono:true },
];
document.getElementById('stats').innerHTML = stats.map(s =>
  '<div class="stat"><div class="k">' + s.k + '</div><div class="v' + (s.mono?' mono':'') + '">'
  + (s.dot ? '<span class="dot" style="color:' + s.dot + '">●</span>' : '') + s.v + '</div></div>').join('');
const doneN = count('done');
document.getElementById('quip').textContent =
  doneN > 0 ? 'You’ve struck through ' + doneN + ' of ' + DATA.n + ' cards. The pencil is winning.' : '';

function openCard(col, c) {
  detail.className = 'on c-' + col.key;
  shade.className = 'on';
  detail.innerHTML = '<button class="close" aria-label="close">esc</button>'
    + '<div class="d-head"><span class="mark">' + (GLYPH[col.key]||'·') + '</span>'
    + '<h2>' + esc(c.t) + '</h2></div>'
    + '<div class="d-meta">' + esc(col.title) + ' &middot; updated ' + esc(c.updated)
    + ' &middot; <span class="mono">roadmap/' + esc(c.slug) + '.md</span></div>'
    + '<div class="d-body">' + c.body + '</div>';
  detail.querySelector('.close').onclick = closeCard;
}
function closeCard(){ detail.className=''; shade.className=''; }
shade.onclick = closeCard;
addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

for (const col of DATA.columns) {
  const el = document.createElement('div');
  el.className = 'col c-' + col.key;
  el.innerHTML = '<div class="col-head"><h2>' + esc(col.title) + '</h2>'
    + '<span class="n">' + col.cards.length + '</span></div>'
    + '<p class="sub">' + esc(col.sub) + '</p>';
  for (const c of col.cards) {
    const card = document.createElement('div');
    card.className = 'card'; card.tabIndex = 0;
    card.innerHTML = '<span class="mark">' + (GLYPH[col.key]||'·') + '</span>'
      + '<h3>' + esc(c.t) + '</h3><p>' + esc(c.d) + '</p>'
      + '<div class="tags">' + c.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>';
    card.onclick = () => openCard(col, c);
    card.onkeydown = e => { if (e.key === 'Enter') openCard(col, c); };
    el.appendChild(card);
  }
  board.appendChild(el);
}
</script>
