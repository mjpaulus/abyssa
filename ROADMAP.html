  ==========================================
  THIS FILE IS THE SOURCE OF TRUTH *AND* THE ARTIFACT SOURCE.

  Any session that changes feature state:
    1. edits the BOARD const below (move/add/retire cards, bump `inked`),
    2. republishes with the Artifact tool: file_path = this file,
       url = the artifact URL recorded in CLAUDE.md ("THE WORKING CHART"),
       favicon "⚓" (keep it stable),
    3. commits this file with the code change.
  Columns are ordered by actionability. `eye` cards are decisions only Michael can

<title>ABYSSA — The Working Chart</title>

  .wrap { max-width: 1720px; margin: 0 auto; padding: 2.2rem 1.6rem 3rem; }

  .over { font-size: .68rem; letter-spacing: .34em; color: var(--ink-soft);

  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr);
    gap: 1.1rem; min-width: 1460px; align-items: start; }

  .col { background: var(--paper-hi); border: 1px solid var(--edge);
    border-radius: 3px; padding: .9rem .8rem 1rem; }
  .col h2 { font-size: .74rem; font-weight: 400; letter-spacing: .26em;

    justify-content: space-between; align-items: baseline; gap: .5rem; }
  .col h2 .n { font-family: ui-monospace, Menlo, monospace;
    font-variant-numeric: tabular-nums; font-size: .78rem; color: var(--pencil); }
  .col .sub { font-size: .66rem; letter-spacing: .1em; color: var(--pencil);
    margin: 0 0 .8rem; font-style: italic; }
  .cards { display: flex; flex-direction: column; gap: .65rem; }

  .card { background: var(--card); border: 1px solid var(--edge); border-radius: 2px;
    padding: .6rem .7rem .55rem .85rem; position: relative; box-shadow: var(--shadow); }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--stripe); }
  .card h3 { font-size: .82rem; font-weight: 400; margin: 0 0 .28rem;
    letter-spacing: .12em; text-transform: uppercase; line-height: 1.45; }
  .card p { font-size: .76rem; line-height: 1.5; margin: 0; color: var(--ink-soft); }
  .card .tags { margin-top: .45rem; display: flex; flex-wrap: wrap; gap: .3rem; }
  .tag { font-size: .58rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--pencil); border: 1px solid var(--edge); border-radius: 2px;
    padding: .1rem .4rem .08rem; }

  .c-eye  { --stripe: var(--stripe-eye); }
  .c-wip  { --stripe: var(--stripe-wip); }
  .c-next { --stripe: var(--stripe-next); }
  .c-back { --stripe: var(--stripe-back); }
  .c-ship { --stripe: var(--stripe-ship); }

  /* the game's own idiom: what is done takes the pencil */
  .c-ship .card h3 { color: var(--pencil); position: relative; display: inline-block; }
  .c-ship .card h3::after { content: ""; position: absolute; left: -2px; right: -2px;
    top: 54%; height: 1.5px; background: var(--pencil); opacity: .85;
    transform: rotate(-.6deg); }
  .c-ship .card p { color: var(--pencil); }
  .c-ship .card { box-shadow: none; }

  .c-eye .card h3 { color: var(--red); }

  footer { margin-top: 1.6rem; text-align: center; font-size: .64rem;
    letter-spacing: .22em; text-transform: uppercase; color: var(--pencil); }

  @media (max-width: 720px) {
    .board { min-width: 1200px; }
    .wrap { padding: 1.4rem .9rem 2rem; }
  }
</style>
