swell <code>0.9 + dist * 0.075</code>.</p>\n<p>The vent light gate is linear over 34 units (camera trails the diver by ~10).</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at boiler-room ship (cf0b51e)</li>\n</ul>"}, {"slug": "pump-audio-level", "t": "Pump audio level", "d": "The synth engine thump is deliberately shy. Does it carry on your speakers?", "tags": ["audio"], "updated": "2026-08-05", "body": "<p>The synth engine thump is deliberately shy. Does it carry on your speakers?</p>\n<h3>Detail</h3>\n<p><code>src/audio.js</code> setPump: ceiling ~0.08 dry-equivalent at point-blank. Raise the 0.30 in pumpBus&#x27;s ramp if it hides.</p>\n<p>The fuel-out die-down is the load-bearing moment: rate stretches naturally, no linear fade.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at pump-audio ship; never heard by anyone yet</li>\n</ul>"}, {"slug": "gale-crests-deck", "t": "Gale crests over the deck", "d": "In a full gale, wave crests overlapping the raft show refracted water, not the deck behind them.", "tags": ["water", "storm"], "updated": "2026-08-05", "body": "<p>In a full gale, wave crests overlapping the raft show refracted water, not the deck behind them.</p>\n<h3>Detail</h3>\n<p>Inherent screen-space refraction limit: geometry above water is not in the underwater target.</p>\n<p>Reads as sea washing the deck — defensible in a storm, but judge in motion.</p>\n<p>Distortion already hard-clamped at 0.035 NDC (unbounded it ghosted a phantom davit leg).</p>\n<p>If unacceptable: fade <code>uRefrK</code> by fragment-to-raft proximity on the air side, at the cost of transparency right at the hull.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at refraction ship (53376e8)</li>\n</ul>"}, {"slug": "fly-remote-sites", "t": "Fly Pallid Bank + Burned Ground", "d": "Phase 5 of THE CHART: judge both remote skylines, vent clusters, wreck placement with your own eye.", "tags": ["chart", "phase 5"], "updated": "2026-08-05", "body": "<p>Phase 5 of THE CHART: judge both remote skylines, vent clusters, wreck placement with your own eye.</p>\n<h3>Detail</h3>\n<p>Sail via the chart table, or console: <code>__chart.arrive(1)</code> (Pallid) / <code>__chart.arrive(2)</code> (Burned).</p>\n<p>Tuning is one row per site in <code>src/world/site.js</code>: <code>terra.off</code> moves skylines, <code>scarcity</code> moves the economy, <code>sleepers</code> rows carry sigils/hue/epithets.</p>\n<p>Terrain fingerprints if a probe is needed: home 5e6cfe45, Pallid ef14da09 (32x32x3 grid).</p>\n<ul>\n<li>Acceptance: both sites feel like different water, not palette swaps; sleeper rows read harder without being unfair.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created at THE CHART v1 ship (de2aacc); awaiting flyover</li>\n</ul>"}, {"slug": "far-ridgeline-read", "t": "Far ridgeline read", "d": "Does the W2 rampart read against the rim? 4.5% vs 13.1% transmittance — measured 2.9x separation, but subtle.", "tags": ["terrain"], "updated": "2026-08-05", "body": "<p>Does the W2 rampart read against the rim? 4.5% vs 13.1% transmittance — measured 2.9x separation, but subtle.</p>\n<h3>Detail</h3>\n<p><code>RAM_H</code> in <code>src/world/terrain.js</code> (currently 66) is the lever if too faint on a real monitor.</p>\n<p>Also of note: the rampart breaches the surface in places — distant &#x27;islands&#x27; on the horizon from the deck. Looks intentional; confirm you like it.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried from W2; islands observation added during the raft round</li>\n</ul>"}, {"slug": "deck-camera-pullin", "t": "Deck camera pull-in", "d": "Camera sits 9 back; the raft is 9.4 wide — deck detail is only ever read from range.", "tags": ["camera"], "updated": "2026-08-05", "body": "<p>Camera sits 9 back; the raft is 9.4 wide — deck detail is only ever read from range.</p>\n<h3>Detail</h3>\n<p>CAM_BACK/CAM_UP in game.js (~line 335). Pulling in while <code>player.onDeck</code> would change movement feel — explicitly your call, not mine.</p>\n<p>All raft detail work to date was judged at the 9-unit distance.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried from the raft round (bb6e78a)</li>\n</ul>"}, {"slug": "chart-parchment-look", "t": "Chart parchment on your monitor", "d": "The in-game paper chart: warmth, size, drop shadow, and the one authored margin line.", "tags": ["chart", "ui"], "updated": "2026-08-05", "body": "<p>The in-game paper chart: warmth, size, drop shadow, and the one authored margin line.</p>\n<h3>Detail</h3>\n<p><code>src/ui/chartOverlay.js</code>. Judged fine in the pane; only a real monitor settles it.</p>\n<ul>\n<li>The drop-shadow filter is the first thing to cut if it reads as a floating UI card.</li>\n<li>The margin line WHAT SLEEPS WILL WAKE FOR NOISE is the only authored copy beyond YOU RIDE HERE — delete if it oversteps.</li>\n<li>Check the two conditions lines clear each other at narrow widths.</li>\n</ul>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — created; overlay verified structurally + visually in pane</li>\n</ul>"}]}, {"key": "wip", "title": "In the Water", "sub": "being built right now", "cards": [{"slug": "chart-seed-curation", "t": "THE CHART — seed curation", "d": "Author-tune the two remote sites once flown: terrain offsets, scarcity feel, sleeper rows, epithets.", "tags": ["chart", "phase 5"], "updated": "2026-08-05", "body": "<p>Author-tune the two remote sites once flown: terrain offsets, scarcity feel, sleeper rows, epithets.</p>\n<h3>Detail</h3>\n<p>Waits on the fly-remote-sites card. Levers all in <code>src/world/site.js</code>; every value authored, nothing generated.</p>\n<p>If two sites read too similar, the next knob is parameterising terrain&#x27;s PERM seed per site (deliberately NOT done in V1).</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — opened at phase 4 ship (de2aacc)</li>\n</ul>"}]}, {"key": "next", "title": "Next", "sub": "agreed, not started", "cards": [{"slug": "zone1-vent-life", "t": "Zone-1 vent life", "d": "Pale shrimp and crabs swarming the chimneys — the boiler room inhabited, not just built.", "tags": ["zone 1", "creatures"], "updated": "2026-08-05", "body": "<p>Pale shrimp and crabs swarming the chimneys — the boiler room inhabited, not just built.</p>\n<h3>Detail</h3>\n<p>Pattern: creatures.js boid/instancing idioms; swarm anchors at the 12 active chimney positions (vents.js <code>activeVents</code>).</p>\n<p>Tone: pale, small, dense near throats — life that eats the heat. No glow.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — agreed as next after the boiler room shipped</li>\n</ul>"}, {"slug": "sleepers-persist-decision", "t": "Sleepers-persist decision", "d": "V1: the chart records history but sleepers re-wake per visit. Keep as ritual, or persist the calm per site?", "tags": ["chart", "design"], "updated": "2026-08-05", "body": "<p>V1: the chart records history but sleepers re-wake per visit. Keep as ritual, or persist the calm per site?</p>\n<h3>Detail</h3>\n<p>Design question, then small build. Persisting needs makeLeviathan to boot calmed (sigils lit, <code>calmed=true</code>) — modest leviathan surgery.</p>\n<p>The ritual reading: the sleepers stir again when you leave; the chart remembers that you HAVE calmed them, the water does not.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — deferred deliberately at phase 4; user call pending</li>\n</ul>"}, {"slug": "sailing-soundscape", "t": "Sailing soundscape", "d": "The voyage has a chain slam and a bell. Wants hull creak, canvas, water on the strakes.", "tags": ["audio", "chart"], "updated": "2026-08-05", "body": "<p>The voyage has a chain slam and a bell. Wants hull creak, canvas, water on the strakes.</p>\n<h3>Detail</h3>\n<p>audio.js one-shots + a 6-second wash keyed to the voyage timeline. All synthesised, house style.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — noted at phase 4 ship</li>\n</ul>"}, {"slug": "helmet-glb", "t": "Mark V helmet .glb", "d": "Wired and waiting. Needs your Sketchfab login to download the CC-BY model.", "tags": ["user action"], "updated": "2026-08-05", "body": "<p>Wired and waiting. Needs your Sketchfab login to download the CC-BY model.</p>\n<h3>Detail</h3>\n<p><code>entities/helmetSwap.js</code> mounts <code>assets/models/markv_helmet/helmet.glb</code> if present; silently absent otherwise.</p>\n<p><code>window.__helm</code> adjusts fit once mounted. CREDITS.md line already reserved.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried; user download pending</li>\n</ul>"}]}, {"key": "back", "title": "Charted", "sub": "the backlog, in no order", "cards": [{"slug": "rain-from-above", "t": "Rain from above", "d": "The air-side rain lattice read as stamped circles and was muted; needs a stochastic splash field.", "tags": ["water", "storm"], "updated": "2026-08-05", "body": "<p>The air-side rain lattice read as stamped circles and was muted; needs a stochastic splash field.</p>\n<h3>Detail</h3>\n<p>The from-below rain lens is fine and untouched. Air side needs non-lattice splash placement — a separate small system.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — carried from the sky round</li>\n</ul>"}, {"slug": "raft-shadow-on-sea", "t": "Raft shadow on the sea", "d": "No dark patch marks the hull from below; wants the surface to receive the sun map.", "tags": ["water"], "updated": "2026-08-05", "body": "<p>No dark patch marks the hull from below; wants the surface to receive the sun map.</p>\n<h3>Detail</h3>\n<p>The sea surface material would need to sample the sun&#x27;s shadow map — receiveShadow on a custom ShaderMaterial means wiring shadow chunks in. Modest but fiddly.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — noted at the raft round</li>\n</ul>"}, {"slug": "ladder-climb-anim", "t": "Sal climbs hand-over-hand", "d": "Boarding works; the climb is a smooth rise without a rung-grab pose.", "tags": ["animation"], "updated": "2026-08-05", "body": "<p>Boarding works; the climb is a smooth rise without a rung-grab pose.</p>\n<h3>Detail</h3>\n<p>diver.js pose overlay while <code>player.onLadder</code> (already published): arms alternating reach, boots on rungs. Same overlay pattern as the knife slash.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — noted at the boarding ship (ed915f4)</li>\n</ul>"}, {"slug": "feedback-doc-batch", "t": "Feedback doc batch", "d": "You keep a notes doc — expect a round of fixes when it lands.", "tags": ["user"], "updated": "2026-08-05", "body": "<p>You keep a notes doc — expect a round of fixes when it lands.</p>\n<h3>Detail</h3>\n<p>Standing intake card. When the doc arrives, split it into cards here and work the round.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — standing</li>\n</ul>"}, {"slug": "chart-v2-sonar-soundings", "t": "Chart V2: sonar soundings", "d": "The sounding set reveals new anchorages on the paper — the flagship V2 hook.", "tags": ["chart", "v2"], "updated": "2026-08-05", "body": "<p>The sounding set reveals new anchorages on the paper — the flagship V2 hook.</p>\n<h3>Detail</h3>\n<p>New site rows stay hidden until sonar-discovered; the chart gains blank water with a pencil question mark.</p>\n<p>Needs: hidden flag per site row, discovery event from sonarPing, chart redraw.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — from the design panel&#x27;s V2 list</li>\n</ul>"}, {"slug": "chart-v2-keepsakes", "t": "Chart V2: keepsakes shelf", "d": "Physical keepsake props on the raft; each remote wreck carries one line of the previous owner.", "tags": ["chart", "v2"], "updated": "2026-08-05", "body": "<p>Physical keepsake props on the raft; each remote wreck carries one line of the previous owner.</p>\n<h3>Detail</h3>\n<p>V1 shipped keepsakes as collect-flags only. V2: a shelf prop near the chart table, one object per keepsake, one line of story each.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — from the design panel&#x27;s V2 list</li>\n</ul>"}, {"slug": "chart-v2-creatures-reseed", "t": "Creatures reseed per site", "d": "Schools and jellies are identical everywhere; V1 deliberately skipped them.", "tags": ["chart", "v2"], "updated": "2026-08-05", "body": "<p>Schools and jellies are identical everywhere; V1 deliberately skipped them.</p>\n<h3>Detail</h3>\n<p>[risk]&#x27;s audit: mid-water Y-band placement means nothing breaks unseeded — it just repeats. Reseed = same pattern as flora (seed streams + dispose/rebuild), lower stakes.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — deliberate V1 cut</li>\n</ul>"}, {"slug": "audio-audit", "t": "Audio audit", "d": "Full mix pass with your ears; the synth engine has never had one.", "tags": ["audio", "user"], "updated": "2026-08-05", "body": "<p>Full mix pass with your ears; the synth engine has never had one.</p>\n<h3>Detail</h3>\n<p>Everything is synthesised in audio.js. Wants: level balance across depth, chime density, drone tuning per zone — a session with you listening.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — long-standing; needs the user present</li>\n</ul>"}]}, {"key": "ship", "title": "Shipped", "sub": "the pencil takes what is done", "cards": [{"slug": "the-ending", "t": "The ending", "d": "75s rift-threaded ascent, three sleeper passes, the title card.", "tags": ["cinematic"], "updated": "2026-08-05", "body": "<p>75s rift-threaded ascent, three sleeper passes, the title card.</p>\n<h3>Detail</h3>\n<p>Spline threads all three rift bowls (terrain is always present — a straight ascent pops through floors). Now gated once-ever by THE CHART; later completions get the chart-inking beat.</p>\n<h3>Log</h3>\n<ul>\n<li>pre-2026-08-05 — shipped; ending gate updated at de2aacc</li>\n</ul>"}, {"slug": "silt-line-far-field", "t": "THE SILT LINE + far field", "d": "Stratified column, rising is the reveal; W2 rampart ridgeline; basin bit-identity proven.", "tags": ["water", "terrain"], "updated": "2026-08-05", "body": "<p>Stratified column, rising is the reveal; W2 rampart ridgeline; basin bit-identity proven.</p>\n<h3>Detail</h3>\n<p>rho(y) with saturated nepheloid; exact antiderivative in the fog chunk. W2: HALF 390-&gt;560, azimuthal rim warp, rampart at 340/410/540. Physics: brightness cannot buy distance (log scaling).</p>\n<h3>Log</h3>\n<ul>\n<li>pre-2026-08-05 — shipped across the far-field rounds</li>\n</ul>"}, {"slug": "sea-window", "t": "The sea became a window", "d": "Screen-space refraction both ways; Beer-Lambert absorption free via the global fog; temporal half-rate pass.", "tags": ["water"], "updated": "2026-08-05", "body": "<p>Screen-space refraction both ways; Beer-Lambert absorption free via the global fog; temporal half-rate pass.</p>\n<h3>Detail</h3>\n<p>No depth texture needed — the height-integrated fog pre-attenuates the far-side render. Hysteresis on side selection (swell flip-flop showed the wrong world). Hard-clamped distortion. Half-rate temporal (draw-call submission was the real cost, not pixels).</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (53376e8 + 87c5dbb + c70151e)</li>\n</ul>"}, {"slug": "raft-place", "t": "The raft became a place", "d": "Five-builder dive tender: hull, dressing station, gear, davit, pump; 44-row deck; sun at 58 degrees; raft-only shadows.", "tags": ["raft"], "updated": "2026-08-05", "body": "<p>Five-builder dive tender: hull, dressing station, gear, davit, pump; 44-row deck; sun at 58 degrees; raft-only shadows.</p>\n<h3>Detail</h3>\n<p>Board width was the deck (8 metre-wide slabs -&gt; 44 weathered rows). In-air lighting regime split from the underwater STOPS table. SUN_ELEV_DEG shared constant ended the 77-degree accident. ~10 draw calls, 36k tris.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (bb6e78a)</li>\n</ul>"}, {"slug": "quality-ladder", "t": "Quality ladder", "d": "Degrade sheds transparency LAST: quarter target, volumetrics/AO/sun-shadow, then full shed.", "tags": ["perf"], "updated": "2026-08-05", "body": "<p>Degrade sheds transparency LAST: quarter target, volumetrics/AO/sun-shadow, then full shed.</p>\n<h3>Detail</h3>\n<p>Each rung needs its own 4 sustained seconds under 34fps. window.__perf.stage() reports the rung. Tier 2 measured: 26.2 -&gt; 18.0 ms in-pane with the sea still a window.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (078200b + c70151e)</li>\n</ul>"}, {"slug": "predators-tools-weather", "t": "Predators + tools + weather", "d": "Shark FSM, octopus dens, squid ink economy; sonar, spear, thruster, knife; day cycle and storms.", "tags": ["systems"], "updated": "2026-08-05", "body": "<p>Shark FSM, octopus dens, squid ink economy; sonar, spear, thruster, knife; day cycle and storms.</p>\n<h3>Detail</h3>\n<p>Rounds 2-4 of the original plan. Ink counters shark charges; relics discovered in wrecks; deterministic 12-minute weather with storm pump-sputter.</p>\n<h3>Log</h3>\n<ul>\n<li>pre-2026-08-05 — shipped in earlier sessions</li>\n</ul>"}, {"slug": "honest-floor-light", "t": "Honest floor light", "d": "Caustics coloured by albedo and shaded by the normal; the volumetric march gained its missing density term.", "tags": ["light"], "updated": "2026-08-05", "body": "<p>Caustics coloured by albedo and shaded by the normal; the volumetric march gained its missing density term.</p>\n<h3>Detail</h3>\n<p>Caustics: partially-normalised albedo (raw albedo killed them on 0.05 rock — &#x27;only sand has that effect&#x27;). Chroma split cut from 0.35u to cm. Sun/storm gated.</p>\n<p>Volumetrics: source term had no sigma_s — linear blowup along the silt line&#x27;s clear paths; density factor + squared shared depth curve (march and billboards together).</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (87ccea5, 9c80a23)</li>\n</ul>"}, {"slug": "chart-v1", "t": "THE CHART v1", "d": "Three anchorages, paper chart, voyage, full-world in-place reseed, localStorage memory, authored sleepers, once-only ending rite.", "tags": ["chart"], "updated": "2026-08-05", "body": "<p>Three anchorages, paper chart, voyage, full-world in-place reseed, localStorage memory, authored sleepers, once-only ending rite.</p>\n<h3>Detail</h3>\n<p>Design: 3-designer/3-judge panel, fiction-first won with the realist&#x27;s reseed mechanism grafted in.</p>\n<p>Key files: world/site.js (registry), ui/chartOverlay.js, systems/raft/chart.js, reseed paths in 7 world modules, voyage state in game.js.</p>\n<p>Soak: 20 full-world reseeds — programs constant, zero memory growth, collider identity preserved, site-1 bit-repeatable. Persistence proven by cold reload into Pallid Bank (hash ef14da09).</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped across 353ec26 + de2aacc</li>\n</ul>"}, {"slug": "boiler-room", "t": "The boiler room (zone 1)", "d": "17 black smokers in 4 clusters, plumes, shimmer, ember wayfinding, one shared throat light.", "tags": ["zone 1"], "updated": "2026-08-05", "body": "<p>17 black smokers in 4 clusters, plumes, shimmer, ember wayfinding, one shared throat light.</p>\n<h3>Detail</h3>\n<p>Display lessons recorded in CLAUDE.md: fog-off embers (per-channel fog turned amber teal), halo swells with distance, fire above the rim (the lip depth-tested it away), ONE PointLight ever (light-count changes recompile the scene).</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (cf0b51e)</li>\n</ul>"}, {"slug": "boarding-ladder", "t": "Sal boards by the ladder", "d": "Swim at it and keep swimming; steps inboard over the rail at the top.", "tags": ["raft"], "updated": "2026-08-05", "body": "<p>Swim at it and keep swimming; steps inboard over the rail at the top.</p>\n<h3>Detail</h3>\n<p>He literally could not re-board before (measured: swam clean under the deck). Three hidden blockers: surface backstop erasing the climb, swim thrust sliding him off, rungs outboard of the deck catch.</p>\n<h3>Log</h3>\n<ul>\n<li>2026-08-05 — shipped (ed915f4)</li>\n</ul>"}]}]};
const GLYPH = { eye:'●', wip:'◐', next:'○', back:'·', ship:'✔' };
const board = document.getElementById('board');
const shade = document.getElementById('shade');
const detail = document.getElementById('detail');
document.getElementById('b-title').textContent = DATA.title;
document.getElementById('b-path').textContent = DATA.project + ' · ' + DATA.n + ' cards';
document.getElementById('meta').innerHTML = '--inked <code>' + DATA.inked + '</code>';
document.title = DATA.title;

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function openCard(col, c) {
  detail.className = 'on c-' + col.key;
  shade.className = 'on';
  detail.innerHTML = '<button class="close" aria-label="close">esc</button>'
    + '<div class="d-head"><span class="mark">' + (GLYPH[col.key]||'·') + '</span>'
    + '<h2>' + esc(c.t) + '</h2></div>'
    + '<div class="d-meta">' + esc(col.title) + ' · updated ' + esc(c.updated)
    + ' · roadmap/' + esc(c.slug) + '.md</div>'
    + '<div class="d-body">' + c.body + '</div>';
  detail.querySelector('.close').onclick = closeCard;
}
function closeCard(){ detail.className=''; shade.className=''; }
shade.onclick = closeCard;
addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

for (const col of DATA.columns) {
  const el = document.createElement('div');
  el.className = 'col c-' + col.key;
  el.innerHTML = '<div class="col-head"><span class="glyph">' + (GLYPH[col.key]||'·')
    + '</span><h2>' + esc(col.title) + '</h2><span class="n">' + col.cards.length + '</span></div>'
    + '<p class="sub">' + esc(col.sub) + '</p>';
  for (const c of col.cards) {
    const card = document.createElement('div');
    card.className = 'card'; card.tabIndex = 0;
    card.innerHTML = '<span class="mark">' + (GLYPH[col.key]||'·') + '</span>'
      + '<h3>' + esc(c.t) + '</h3><p>' + esc(c.d) + '</p>'
      + '<div class="tags">' + c.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>';
    card.onclick = () => openCard(col, c);
    card.onkeydown = e => { if (e.key === 'Enter') openCard(col, c); };
    el.appendChild(card);
  }
  board.appendChild(el);
}
</script>
