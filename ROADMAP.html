<!--
  ABYSSA — THE WORKING CHART (feature board)
  ==========================================
  THIS FILE IS THE SOURCE OF TRUTH *AND* THE ARTIFACT SOURCE.

  Any session that changes feature state:
    1. edits the BOARD const below (move/add/retire cards, bump `inked`),
    2. republishes with the Artifact tool: file_path = this file,
       url = the artifact URL recorded in CLAUDE.md ("THE WORKING CHART"),
       favicon "⚓" (keep it stable),
    3. commits this file with the code change.
  Columns are ordered by actionability. `eye` cards are decisions only Michael can
  make — never resolve one without his explicit call.

  Styled after Claude Code's own terminal: monospace, the coral accent, status
  glyphs per column, done items struck through. Both themes.
-->
<title>ABYSSA — The Working Chart</title>
<style>
  :root {
    --bg: #faf9f5; --panel: #f3f1ea; --line: #dedbd1; --line-soft: #e9e6dd;
    --fg: #3d3d3a; --dim: #83817b; --faint: #a8a49b;
    --accent: #c15f3c;            /* claude coral, print-weight for paper */
    --good: #3d7a4a; --warn: #a06a1f;
    --card-hover: #edeae1;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #1a1915; --panel: #201f1a; --line: #38362e; --line-soft: #2b2a24;
    --fg: #e8e6dc; --dim: #8f8c80; --faint: #5f5d53;
    --accent: #d97757;            /* claude coral */
    --good: #7cc08a; --warn: #d9a441;
    --card-hover: #262520;
  } }
  :root[data-theme="dark"] {
    --bg: #1a1915; --panel: #201f1a; --line: #38362e; --line-soft: #2b2a24;
    --fg: #e8e6dc; --dim: #8f8c80; --faint: #5f5d53;
    --accent: #d97757; --good: #7cc08a; --warn: #d9a441;
    --card-hover: #262520;
  }
  :root[data-theme="light"] {
    --bg: #faf9f5; --panel: #f3f1ea; --line: #dedbd1; --line-soft: #e9e6dd;
    --fg: #3d3d3a; --dim: #83817b; --faint: #a8a49b;
    --accent: #c15f3c; --good: #3d7a4a; --warn: #a06a1f;
    --card-hover: #edeae1;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
    font-size: 13px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1780px; margin: 0 auto; padding: 28px 22px 48px; }

  /* ---- banner: the CLI welcome box ---- */
  .banner { border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 18px; margin-bottom: 10px; background: var(--panel); }
  .banner .hello { color: var(--fg); }
  .banner .hello .spark { color: var(--accent); font-weight: 700; }
  .banner .path { color: var(--dim); margin-top: 2px; }
  .prompt { color: var(--dim); margin: 14px 2px 20px; }
  .prompt .caret { color: var(--accent); }
  .prompt code { color: var(--fg); }

  /* ---- board ---- */
  .board-scroll { overflow-x: auto; padding-bottom: 12px; }
  .board { display: grid; grid-auto-flow: column;
    grid-auto-columns: minmax(290px, 1fr); gap: 12px; min-width: 1500px;
    align-items: start; }

  .col { border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    padding: 0 0 10px; overflow: hidden; }
  .col-head { display: flex; align-items: baseline; gap: 8px;
    padding: 9px 12px 8px; border-bottom: 1px solid var(--line-soft); }
  .col-head .glyph { color: var(--col-glyph); }
  .col-head h2 { font-size: 13px; font-weight: 700; margin: 0; letter-spacing: .02em; }
  .col-head .n { margin-left: auto; color: var(--dim);
    font-variant-numeric: tabular-nums; }
  .col .sub { margin: 6px 12px 4px; color: var(--faint); font-size: 12px; }
  .cards { display: flex; flex-direction: column; }

  .card { padding: 9px 12px 8px 30px; position: relative;
    border-top: 1px solid var(--line-soft); }
  .card:first-child { border-top: 0; }
  .card:hover { background: var(--card-hover); }
  .card .mark { position: absolute; left: 11px; top: 9px; color: var(--col-glyph); }
  .card h3 { font-size: 13px; font-weight: 700; margin: 0 0 3px; letter-spacing: .01em; }
  .card p { margin: 0; color: var(--dim); font-size: 12px; }
  .card .tags { margin-top: 5px; color: var(--faint); font-size: 11px;
    display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .tag::before { content: "["; } .tag::after { content: "]"; }

  .c-eye  { --col-glyph: var(--accent); }
  .c-wip  { --col-glyph: var(--warn); }
  .c-next { --col-glyph: var(--dim); }
  .c-back { --col-glyph: var(--faint); }
  .c-ship { --col-glyph: var(--good); }

  .c-eye .card h3 { color: var(--accent); }
  .c-wip .card .mark { animation: half 2.4s steps(2) infinite; }
  @keyframes half { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .c-wip .card .mark { animation: none; } }

  .c-ship .card h3 { color: var(--dim); font-weight: 400;
    text-decoration: line-through; text-decoration-color: var(--faint); }
  .c-ship .card p { color: var(--faint); }

  footer { margin-top: 18px; color: var(--faint); font-size: 12px; }
  footer .caret { color: var(--accent); }

  @media (max-width: 720px) { .wrap { padding: 16px 10px 32px; } }
</style>

<div class="wrap">
  <div class="banner">
    <div class="hello"><span class="spark">&#10035;</span> Welcome back to <b>ABYSSA</b> — the working chart</div>
    <div class="path">~/sc/abyssa &middot; feature board &middot; truth lives in ROADMAP.html</div>
  </div>
  <div class="prompt"><span class="caret">&gt;</span> <code>/roadmap</code> <span id="meta"></span></div>
  <div class="board-scroll"><div class="board" id="board"></div></div>
  <footer><span class="caret">&gt;</span> to move a card: tell any session, or edit the BOARD block and republish</footer>
</div>
