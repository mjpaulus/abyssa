<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ABYSSA sculpt lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1d1f; color: #cfc8b8; font: 12px/1.4 monospace; overflow: hidden; }
  #hud { position: fixed; left: 8px; top: 8px; white-space: pre; pointer-events: none; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="hud">loading...</div>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.184.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.184.0/examples/jsm/"
}}
</script>
<script type="module">
// SCULPT LAB (dev only): a neutral studio for lib/sculpt.js jobs. Not part of the game.
//   ?job=<module path>#<export>   the export is a job object or a function returning one
//   window.lab: { res, meshes, view(mode), cam(pos, look), shot(name) }
//   view modes: 'lit' (baked maps), 'flat' (no maps: the bare game mesh), 'normal'
//   (world normals from the normal map), 'ao', 'wire'
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { sculptAsync, toGeometry, toTextures } from './src/lib/sculpt.js';

const q = new URLSearchParams(location.search);
// DEV ONLY, behind ?lab like the game's own lab: a bare URL does nothing (nothing in the
// game links here; tools/blender/README.md gives the lab URLs)
if (!q.has('lab')) {
  document.getElementById('hud').textContent = 'ABYSSA sculpt lab: a dev tool. Open with ?lab&job=... or ?lab&asset=... (tools/blender/README.md).';
  throw new Error('sculptlab: ?lab required');
}
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2d30);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
camera.position.set(1.6, 1.2, 2.4);
const ctl = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbfd4e6, 0x3a3228, 0.9));
const key = new THREE.DirectionalLight(0xfff1dc, 2.6); key.position.set(3, 4, 2); scene.add(key);
const rim = new THREE.DirectionalLight(0x9fc4ff, 1.4); rim.position.set(-3, 1.5, -3); scene.add(rim);
const hud = document.getElementById('hud');

const lab = window.lab = { meshes: [], res: null };
// ?asset=<name>: the pipeline's baked output (assets/sleepers/<name>/), every piece laid out
async function loadAsset(name) {
  const { loadSculpted } = await import('./src/lib/assets.js');
  const a = await loadSculpted('assets/sleepers/' + name + '/', name);
  lab.asset = a;
  const mats = {};
  for (const set in a.maps) {
    const t = a.maps[set];
    mats[set] = new THREE.MeshStandardMaterial({ map: t.map, normalMap: t.normalMap, roughnessMap: t.ormMap, aoMap: t.ormMap, roughness: 1, metalness: 0 });
  }
  lab.mats = { lit: null, flat: new THREE.MeshStandardMaterial({ color: 0x9a9a92, roughness: 0.6 }), wire: new THREE.MeshBasicMaterial({ color: 0xcccccc, wireframe: true }) };
  const setOf = {};
  for (const [k, v] of Object.entries(a.meta.stats.pieces)) setOf[k] = k === 'body' ? 'body' : 'limbs';
  let x = 0, z = 0, row = 0, tris = 0;
  for (const [n, g] of Object.entries(a.geos)) {
    const m = new THREE.Mesh(g, mats[setOf[n] || 'limbs']);
    m.userData.lit = m.material;
    g.computeBoundingBox();
    const bb = g.boundingBox, w = bb.max.x - bb.min.x;
    if (n === 'body') m.position.set(0, 0, -1.6);
    else { m.position.set(x - bb.min.x - 1.6, 0, z); x += w + 0.12; row = Math.max(row, bb.max.z - bb.min.z); if (x > 3.2) { x = 0; z += row + 0.15; row = 0; } }
    m.name = n; scene.add(m); lab.meshes.push(m); tris += g.index.count / 3;
  }
  hud.textContent = 'asset ' + name + '  pieces ' + lab.meshes.length + '  tris ' + tris + '  load ' + a.ms.toFixed(0) + ' ms';
  lab.view = mode => { for (const m of lab.meshes) m.material = mode === 'lit' ? m.userData.lit : lab.mats[mode]; return mode; };
  lab.solo = n => { for (const m of lab.meshes) m.visible = !n || m.name === n; };
  lab.ready = true;
}
async function load() {
  if (q.get('asset')) return loadAsset(q.get('asset'));
  const spec = q.get('job') || './src/entities/sleeper/brooderSculpt.js#bodyJob';
  const [path, name] = spec.split('#');
  const mod = await import(path);
  let job = mod[name || 'default'];
  if (typeof job === 'function') job = job();
  const t0 = performance.now();
  const res = await sculptAsync(job);
  lab.res = res; lab.ms = performance.now() - t0;
  const tex = toTextures(THREE, res.maps);
  lab.tex = tex;
  const mat = new THREE.MeshStandardMaterial({ map: tex.map, normalMap: tex.normalMap, roughnessMap: tex.ormMap, aoMap: tex.ormMap, roughness: 1, metalness: 0 });
  lab.mats = { lit: mat, flat: new THREE.MeshStandardMaterial({ color: 0x9a9a92, roughness: 0.6 }),
    normal: new THREE.MeshNormalMaterial({ normalMap: tex.normalMap }), wire: new THREE.MeshBasicMaterial({ color: 0xcccccc, wireframe: true }),
    ao: new THREE.MeshBasicMaterial({ map: tex.ormMap }) };
  let x = 0, tris = 0;
  const names = Object.keys(res.parts);
  for (const n of names) {
    const g = toGeometry(THREE, res.parts[n]);
    const m = new THREE.Mesh(g, mat);
    const bb = g.boundingBox;
    const lay = job.layout && job.layout[n];
    if (lay) m.position.fromArray(lay); else { m.position.x = x - bb.min.x; x += bb.max.x - bb.min.x + 0.1; }
    m.name = n; scene.add(m); lab.meshes.push(m);
    tris += g.index.count / 3;
  }
  const st = res.stats;
  hud.textContent = `job ${spec}\n${lab.ms.toFixed(0)} ms wall (worker total ${st.totalMs.toFixed(0)})\ntris ${tris}  atlas ${res.maps.size}  texel ${st.texel.toFixed(4)}\nbake ${st.bakeMs.toFixed(0)} ms  evals ${st.bakeEvals}\n` +
    Object.entries(st.parts).map(([k, v]) => `${k}: field ${v.fieldMs.toFixed(0)} mesh ${v.meshMs.toFixed(0)} dec ${v.decMs.toFixed(0)} raw ${v.rawTris} -> ${v.tris}`).join('\n');
  lab.ready = true;
}
if (!lab.view) lab.view = mode => { for (const m of lab.meshes) m.material = lab.mats[mode]; return mode; };
// frame every visible mesh from direction d (optionally just the named one)
lab.fit = (d = [1, 0.6, 1.2], name, zoom = 1) => {
  const bb = new THREE.Box3();
  for (const m of lab.meshes) if (m.visible && (!name || m.name === name)) bb.expandByObject(m);
  const c = bb.getCenter(new THREE.Vector3()), r = bb.getSize(new THREE.Vector3()).length() * 0.5;
  const dir = new THREE.Vector3(...d).normalize(), dist = r / Math.sin(THREE.MathUtils.degToRad(camera.fov * 0.5)) * 0.9 / zoom;
  lab.cam(c.clone().addScaledVector(dir, dist).toArray(), c.toArray());
};
lab.cam = (p, l) => { camera.position.fromArray(p); ctl.target.fromArray(l); ctl.update(); };
lab.shot = async name => {
  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL('image/jpeg', 0.92);
  await fetch('http://127.0.0.1:8839/' + name, { method: 'POST', body: url });
  return name;
};
(function loop() { requestAnimationFrame(loop); ctl.update(); renderer.render(scene, camera); })();
load().catch(e => { hud.textContent = 'FAILED ' + e.stack; console.error(e); });
</script>
</body>
</html>
